# 站点版本号（唯一来源）
# 格式：V{year}.{major}.{patch}，例如 V26.14.0
# 计数单位：每一次提交（git commit）都算一次更新；版号变更与本次改动放在同一个提交里。
# 维护规则（2026-10-22 起，用户指令）：
#   - BB（major）只能由用户明确决定；Agent 不得自行 major + 1（即使自评 S/A 级也不行）。
#   - CC（patch）：正常更新默认 + 1；文章/放映作品/图片等内容发布、文案样式调整、清理等
#     日常更新一律只动 patch。
#   - AA（year）：跨年时改为新年后两位，major 与 patch 继续累积，不重置。
#   - merge 提交若自身无文件变更，不单独计数，随被合并的提交计算。
# 历史：V26.10.0 = 2026-10-21 之前按「更新日批次」统计的 19 次更新（10 个 S/A 批）；
#       2026-10-21 起改为按单次提交计数；2026-10-22 起 major 由用户决定。
#       2026-10-24 F（Product Launch）整站改版，用户指定计为重大更新 → V26.14.0。
year: 26
major: 14
patch: 7
