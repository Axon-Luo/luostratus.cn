# 站点版本号（唯一来源）
# 格式：V{year}.{major}.{patch}，例如 V26.10.1
# 计数单位：每一次提交（git commit）都算一次更新。每次提交前先评级并同步本文件，
#           版号变更与代码改动放在同一个提交里；不要单独提交一次「只改版号」。
# 评级：按 功能价值 / 影响范围 / 用户可见度 / 风险处理 / 工程长期价值 五维评 S/A/B/C/D。
# 维护规则：
#   - S 级 / A 级更新：major + 1，patch 归零
#   - B 级 / C 级 / D 级更新：patch + 1
#   - 跨年：year 改为新年后两位，major 与 patch 继续累积
#   - merge 提交若自身无文件变更，不单独计数，随被合并的提交计算
# 基线：V26.10.0 = 2026-10-21 之前按「更新日批次」统计的 19 次更新（10 个 S/A 级）；
#       自本次提交起改为按单次提交计数。
year: 26
major: 11
patch: 0
