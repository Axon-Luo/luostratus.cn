<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="配色工坊 · 生活调色盘：拍一张生活里的图，一键得到能直接用的配色，可预览、可检查、可带走"
    />
    <title>配色工坊 · 生活调色盘</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="配色工坊" />
    <script type="module" crossorigin src="./assets/index-BK5KPPcV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-NfhKYd-B.css">
    <style>
      /* 与 luostratus.cn 站点页脚统一：细分割线、居中、两行、蓝色版本号 */
      footer.footer.cf-site-footer {
        margin-top: 48px;
        padding: 26px 16px 34px;
        border-top: 1px solid #26262D;
        background: transparent;
        color: #A1A1A6;
        text-align: center;
      }
      footer.footer.cf-site-footer .container {
        display: block;
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 0;
      }
      footer.footer.cf-site-footer .cf-footer-line {
        display: block;
        font-size: 13px;
        line-height: 2.1;
      }
      footer.footer.cf-site-footer .cf-footer-meta {
        font-size: 12.5px;
      }
      footer.footer.cf-site-footer a {
        color: #A1A1A6;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color .2s ease, border-color .2s ease;
      }
      footer.footer.cf-site-footer a:hover {
        color: #F5F5F7;
        border-color: rgba(245, 245, 247, .35);
      }
      footer.footer.cf-site-footer .cf-version {
        color: #5B7BFF;
      }
      @media (max-width: 600px) {
        footer.footer.cf-site-footer {
          margin-top: 36px;
          padding: 22px 14px 30px;
        }
        footer.footer.cf-site-footer .cf-footer-line { font-size: 12px; }
        footer.footer.cf-site-footer .cf-footer-meta { font-size: 11.5px; }
      }
      /* 返回小工具：放在配色工坊 logo 正左边 */
      .cf-tool-back {
        display: inline-flex;
        align-items: center;
        flex: none;
        padding: 7px 12px;
        border: 1px solid #26262D;
        border-radius: 999px;
        background: #141419;
        color: #A1A1A6;
        font-size: 12px;
        line-height: 1;
        text-decoration: none;
        box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
        transition: color .2s ease, border-color .2s ease, transform .2s ease;
      }
      .cf-tool-back:hover {
        color: #F5F5F7;
        border-color: #5B7BFF;
        transform: translateY(-1px);
      }
      @media (max-width: 600px) {
        .topbar-inner { gap: 10px; }
        .cf-tool-back { padding: 6px 9px; font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var SITE_VERSION = 'V26.15.6';
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var updated = (function () {
          var raw = document.lastModified;
          var d = raw && !isNaN(Date.parse(raw)) ? new Date(raw) : new Date();
          d = new Date(d.getTime() + 8 * 60 * 60 * 1000);
          return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) +
            ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
        })();
        var render = function () {
          var footer = document.querySelector('footer.footer');
          if (!footer || footer.querySelector('.cf-site-footer-inner')) return;
          footer.classList.add('cf-site-footer');
          footer.innerHTML =
            '<div class="container cf-site-footer-inner">' +
              '<div class="cf-footer-line">© 2026 <a href="/">LuoStratus 的个人站</a> · Powered by ' +
                '<a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a> &amp; ' +
                '<a href="https://github.com/adityatelange/hugo-PaperMod/" target="_blank" rel="noopener">PaperMod</a></div>' +
              '<div class="cf-footer-line cf-footer-meta">Last Updated: ' + updated +
                ' (UTC+8) · <span class="cf-version">Version ' + SITE_VERSION + '</span></div>' +
            '</div>';
        };
        var renderBack = function () {
          var inner = document.querySelector('.topbar-inner');
          if (!inner || inner.querySelector('.cf-tool-back')) return;
          var brand = inner.querySelector('.brand');
          var link = document.createElement('a');
          link.className = 'cf-tool-back';
          link.href = '/tools/';
          link.setAttribute('aria-label', '返回小工具');
          link.textContent = '返回小工具';
          if (brand) inner.insertBefore(link, brand);
          else inner.prepend(link);
        };
        var boot = function () {
          render();
          renderBack();
          new MutationObserver(function () { render(); renderBack(); }).observe(document.body, { childList: true, subtree: true });
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
      })();
    </script>
    <script>
      (function () {
        var KEY = 'pref-theme';
        var ready = false;
        var applying = false;
        var tries = 0;
        var observer = null;

        function readSiteMode() {
          try { return localStorage.getItem(KEY) || 'dark'; } catch (e) { return 'dark'; }
        }
        function systemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function wantedTheme() {
          var mode = readSiteMode();
          if (mode === 'auto') return systemTheme();
          return mode === 'light' ? 'light' : 'dark';
        }
        function currentTheme() {
          return document.documentElement.getAttribute('data-theme');
        }
        function primeStoredTheme() {
          var want = wantedTheme();
          try { document.documentElement.setAttribute('data-theme', want); } catch (e) {}
          try {
            var raw = localStorage.getItem('cf.v2');
            if (!raw) return;
            var data = JSON.parse(raw);
            if (!data.settings) data.settings = {};
            if (data.settings.theme !== want) {
              data.settings.theme = want;
              localStorage.setItem('cf.v2', JSON.stringify(data));
            }
          } catch (e) {}
        }
        function toggleButton() {
          return document.querySelector('.theme-toggle');
        }
        function observeApp() {
          if (observer) return;
          observer = new MutationObserver(function () {
            if (!ready || applying) return;
            var cur = currentTheme();
            if (cur !== 'light' && cur !== 'dark') return;
            try { localStorage.setItem(KEY, cur); } catch (e) {}
          });
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        }
        function init() {
          if (ready) return;
          if (++tries > 60) return;
          var btn = toggleButton();
          var cur = currentTheme();
          if (!btn || (cur !== 'light' && cur !== 'dark')) {
            setTimeout(init, 200);
            return;
          }
          var want = wantedTheme();
          if (cur !== want) {
            if (applying) {
              setTimeout(init, 120);
              return;
            }
            applying = true;
            btn.click();
            setTimeout(function () {
              applying = false;
              setTimeout(init, 80);
            }, 140);
            return;
          }
          ready = true;
          observeApp();
        }
        function reapply() {
          ready = false;
          tries = 0;
          init();
        }

        window.addEventListener('storage', function (e) {
          if (e.key === KEY || e.key === null) reapply();
        });
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          if (mq.addEventListener) {
            mq.addEventListener('change', function () {
              if (readSiteMode() === 'auto') reapply();
            });
          }
        }
        primeStoredTheme();
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
      })();
    </script>
  </body>
</html>
