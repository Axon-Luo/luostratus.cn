<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="配色工坊 · 生活调色盘：拍一张生活里的图，一键得到能直接用的配色，可预览、可检查、可带走"
    />
    <title>配色工坊 · 生活调色盘</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="配色工坊" />
    <script type="module" crossorigin src="./assets/index-BK5KPPcV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-NfhKYd-B.css">
    <style>
      /* 与 luostratus.cn 站点页脚统一：细分割线、居中、两行、蓝色版本号 */
      footer.footer.cf-site-footer {
        margin-top: 48px;
        padding: 26px 16px 34px;
        border-top: 1px solid #26262D;
        background: transparent;
        color: #A1A1A6;
        text-align: center;
      }
      footer.footer.cf-site-footer .container {
        display: block;
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 0;
      }
      footer.footer.cf-site-footer .cf-footer-line {
        display: block;
        font-size: 13px;
        line-height: 2.1;
      }
      footer.footer.cf-site-footer .cf-footer-meta {
        font-size: 12.5px;
      }
      footer.footer.cf-site-footer a {
        color: #A1A1A6;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color .2s ease, border-color .2s ease;
      }
      footer.footer.cf-site-footer a:hover {
        color: #F5F5F7;
        border-color: rgba(245, 245, 247, .35);
      }
      footer.footer.cf-site-footer .cf-version {
        color: #5B7BFF;
      }
      @media (max-width: 600px) {
        footer.footer.cf-site-footer {
          margin-top: 36px;
          padding: 22px 14px 30px;
        }
        footer.footer.cf-site-footer .cf-footer-line { font-size: 12px; }
        footer.footer.cf-site-footer .cf-footer-meta { font-size: 11.5px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var SITE_VERSION = 'V26.15.0';
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var updated = (function () {
          var raw = document.lastModified;
          var d = raw && !isNaN(Date.parse(raw)) ? new Date(raw) : new Date();
          d = new Date(d.getTime() + 8 * 60 * 60 * 1000);
          return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) +
            ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
        })();
        var render = function () {
          var footer = document.querySelector('footer.footer');
          if (!footer || footer.querySelector('.cf-site-footer-inner')) return;
          footer.classList.add('cf-site-footer');
          footer.innerHTML =
            '<div class="container cf-site-footer-inner">' +
              '<div class="cf-footer-line">© 2026 <a href="/">LuoStratus 的个人站</a> · Powered by ' +
                '<a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a> &amp; ' +
                '<a href="https://github.com/adityatelange/hugo-PaperMod/" target="_blank" rel="noopener">PaperMod</a></div>' +
              '<div class="cf-footer-line cf-footer-meta">Last Updated: ' + updated +
                ' (UTC+8) · <span class="cf-version">Version ' + SITE_VERSION + '</span></div>' +
            '</div>';
        };
        var boot = function () {
          render();
          new MutationObserver(render).observe(document.body, { childList: true, subtree: true });
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
      })();
    </script>
  </body>
</html>
