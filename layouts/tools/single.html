{{ define "main" }}
{{ $tool := .File.BaseFileName }}
{{ if ne $tool "color-palette" }}
<style>
.tool-page-header { max-width: 820px; margin: 12px auto 26px; text-align: left; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.tool-page-header .f-kicker { margin-bottom: 10px; }
.tool-page-header h1 { font-size: clamp(2rem, 4.8vw, 3rem); line-height: 1.1; margin: 0 0 10px; font-weight: 800; letter-spacing: -.035em; }
.tool-page-header p { margin: 0; max-width: 680px; color: var(--secondary); font-size: 0.98rem; line-height: 1.7; }
@media (max-width: 720px) { .tool-page-header h1 { font-size: 1.75rem; } }
</style>
<header class="tool-page-header f-tool-hero">
  <div class="f-kicker">PLAYGROUND · TOOL</div>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
</header>
{{ end }}
{{ partial (printf "tools/%s.html" $tool) . }}
{{ end }}
