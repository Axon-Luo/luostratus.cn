{{ define "main" }}
{{ $tool := .File.BaseFileName }}
{{ if ne $tool "color-palette" }}
<style>
.tool-page-header { max-width: 680px; margin: 0 auto 24px; text-align: center; }
.tool-page-header h1 { font-size: 1.9rem; line-height: 1.3; margin: 0 0 6px; font-weight: 700; }
.tool-page-header p { margin: 0 auto; max-width: 560px; color: var(--secondary); font-size: 0.95rem; line-height: 1.65; }
@media (max-width: 720px) { .tool-page-header h1 { font-size: 1.55rem; } }
</style>
<header class="tool-page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
</header>
{{ end }}
{{ partial (printf "tools/%s.html" $tool) . }}
{{ end }}
