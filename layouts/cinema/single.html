{{ define "main" }}
{{ $cover := .Resources.GetMatch "cover.*" }}
<article class="cinema-detail">
  <header class="deck-header">
    <div class="deck-meta">
      <a href="{{ .Parent.RelPermalink }}">返回放映厅</a>
      <span>{{ .Date.Format "2006-01-02" }} · {{ .Params.slides | default "?" }} 页</span>
    </div>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="deck-summary">{{ . }}</p>{{ end }}
  </header>
  {{ with $cover }}
    <figure class="deck-cover"><img src="{{ .RelPermalink }}" alt="{{ $.Title }}"></figure>
  {{ end }}
  <section class="deck-body">{{ .Content }}</section>
  <footer class="deck-actions">
    <a class="start-show" href="{{ .Params.target | default "/cinema/" }}" target="_blank" rel="noopener">
      <span class="play-icon" aria-hidden="true"></span>
      开始放映
    </a>
  </footer>
</article>

<style>
.main { max-width: min(920px, 82vw); }
.post-content { max-width: min(920px, 82vw); }
.cinema-detail { margin-top: 16px; }
.deck-header { margin-bottom: 28px; }
.deck-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; color: var(--secondary); font-size: .88rem; }
.deck-meta a { color: var(--secondary); text-decoration: none; }
.deck-meta a:hover { color: var(--primary); }
.deck-summary { margin: 12px auto 0; color: var(--secondary); font-size: 1.08rem; line-height: 1.7; }
.deck-cover { margin: 0 0 32px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fafaf8; }
.deck-cover img { display: block; width: 100%; height: auto; }
.deck-body { margin-bottom: 44px; line-height: 1.85; }
.deck-actions { display: flex; justify-content: center; padding: 44px 0 12px; border-top: 1px solid var(--border); }
.start-show { display: inline-flex; align-items: center; gap: 16px; min-height: 64px; padding: 14px 42px 14px 26px; border-radius: 8px; background: linear-gradient(135deg, #2143E0 0%, #4E86FF 100%); color: #fff !important; font-size: 1.18rem; font-weight: 700; letter-spacing: .05em; text-decoration: none !important; box-shadow: 0 8px 28px rgba(66,106,255,.48); transition: transform .25s ease, box-shadow .25s ease; animation: cinema-pulse 2.6s ease-in-out infinite; }
.start-show:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 38px rgba(66,106,255,.72); }
.play-icon { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; flex-shrink: 0; }
.play-icon::before { content: ''; display: block; width: 0; height: 0; margin-left: 4px; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; transition: transform .25s ease; }
.start-show:hover .play-icon::before { transform: translateX(3px); }
.start-show:focus-visible { outline: 3px solid rgba(78,134,255,.55); outline-offset: 3px; }
@keyframes cinema-pulse {
  0%, 100% { box-shadow: 0 8px 28px rgba(66,106,255,.48); }
  50% { box-shadow: 0 8px 36px rgba(66,106,255,.78); }
}
@media (prefers-reduced-motion: reduce) { .start-show { animation: none; } .start-show:hover { transform: none; } }
@media (max-width: 480px) { .main { max-width: calc(100vw - 32px); } .deck-meta { flex-direction: column; align-items: flex-start; } .start-show { width: 100%; min-height: 58px; justify-content: center; font-size: 1.08rem; } .play-icon { width: 36px; height: 36px; } }
</style>
{{ end }}
