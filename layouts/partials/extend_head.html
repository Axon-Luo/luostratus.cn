<!-- 全站交互效果 -->
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
/* === 全局平滑滚动 === */
html { scroll-behavior: smooth; }

/* === 选中文字颜色 === */
::selection { background: var(--primary); color: var(--theme); }

/* === 图片加载淡入 === */
img { transition: opacity 0.4s ease; }
img[loading="lazy"] { opacity: 0; }
img[loading="lazy"].loaded { opacity: 1; }

/* === 链接下划线动画 === */
a:not(.gallery-card-link):not(.gallery-item a) {
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-position: 0% 100%;
  background-repeat: no-repeat;
  background-size: 0% 1px;
  transition: background-size 0.3s ease;
}
a:hover:not(.gallery-card-link) {
  background-size: 100% 1px;
}

/* === 文章卡片悬浮 === */
.post-entry {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.post-entry:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

/* === 导航菜单项 === */
#menu, .nav, .menu {
  display: flex;
  gap: 4px;
}

#menu a, #menu li a,
.nav a, .menu a {
  position: relative;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 8px;
  color: var(--menu-text, var(--primary));
  font-weight: 450;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
}

/* hover 背景浮现 */
#menu a:hover, #menu li a:hover,
.nav a:hover, .menu a:hover {
  background: color-mix(in srgb, var(--menu-text, var(--primary)) 10%, transparent);
  transform: translateY(-1px);
  opacity: 1;
}

/* 当前页：底部指示条 + 加粗 */
#menu a[aria-current="page"],
#menu li a.active,
.nav a.active,
.menu a.active,
#menu a.active {
  font-weight: 600;
}
/* 点击波纹 */
#menu a:active, .nav a:active, .menu a:active {
  transform: scale(0.95);
}

/* === 代码块悬浮 === */
pre {
  transition: box-shadow 0.3s ease;
}
pre:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

/* === 分隔线脉动 === */
.post-content hr {
  transition: opacity 0.3s ease;
}
.post-content hr:hover {
  opacity: 0.6;
}

/* === 滚动渐入动画 === */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* === 回到顶部过渡 === */
#top-link {
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px);
  transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
  pointer-events: none;
}
#top-link:not(.hidden) {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s;
  pointer-events: auto;
}
@media (max-width: 900px) {
  .list #top-link:not(.hidden) {
    transform: translateY(-5rem);
  }
}

/* === 小功能页面布局统一 === */
.main > [class$="-wrap"] {
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}
.main [class$="-wrap"] canvas {
  max-width: 100%;
}
.main [class$="-wrap"] button,
.main [class$="-wrap"] select,
.main [class$="-wrap"] input[type="text"],
.main [class$="-wrap"] input[type="number"],
.main [class$="-wrap"] input[type="date"],
.main [class$="-wrap"] input[type="search"],
.main [class$="-wrap"] textarea {
  min-height: 36px;
  font-size: 0.95rem;
}

/* === 按钮/标签点击反馈 === */
button, .button, .post-tag {
  transition: transform 0.15s ease, opacity 0.2s ease;
}
button:active, .button:active, .post-tag:active {
  transform: scale(0.96);
}

/* === 页面切换（非浏览器导航） === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.main {
  animation: fadeIn 0.4s ease;
}

/* === 暗色模式过渡 === */
body, .main, .post-entry, .gallery-item, a, button, pre, input, select, textarea {
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

/* === 文章悬浮导航栏 === */
#article-toc {
  position: fixed;
  left: max(8px, calc((100vw - 820px) / 2 - 260px));
  top: 120px;
  width: 200px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  z-index: 90;
  padding: 0 14px 16px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 12px;

  line-height: 1.6;
  opacity: 0;
  transform: translateX(-12px);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  scrollbar-width: none;
}
#article-toc::-webkit-scrollbar { display: none; }
#article-toc.visible {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
#article-toc .toc-title {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 10px;
  color: var(--primary);
}
#article-toc .toc-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#article-toc .toc-title {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--entry);
  margin: 0 -14px 10px;
  padding: 16px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.toc-toggle {
  border: 1px solid var(--border);
  background: var(--entry);
  color: var(--secondary);
  font-size: 0.72rem;
  line-height: 1;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.toc-toggle:hover {
  color: var(--primary);
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
.toc-links {
  display: block;
  overflow: hidden;
  max-height: 1200px;
  opacity: 1;
  transform: translateY(0);
  transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.3s ease;
}
#article-toc.collapsed .toc-links {
  max-height: 0;
  opacity: 0;
  transform: translateY(-6px);
}
#article-toc.collapsed { padding-bottom: 10px; }
#article-toc a {
  display: block;
  padding: 3px 8px;
  margin: 1px 0;
  border-radius: 6px;
  color: var(--secondary);
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, background 0.2s, padding-left 0.2s;
  border-right: 2px solid transparent;
}
#article-toc a:hover {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
#article-toc a.active {
  color: var(--primary);
  font-weight: 600;
  background: color-mix(in srgb, var(--primary) 10%, transparent);
  border-right-color: var(--primary);
  padding-right: 12px;
}
#article-toc a.toc-h3 {
  padding-right: 18px;
  font-size: 0.78rem;
}
#article-toc a.toc-h3.active {
  padding-right: 22px;
}
@media (max-width: 1100px) {
  #article-toc { left: 8px; width: 180px; font-size: 0.78rem; }
}
@media (max-width: 768px) {
  #article-toc {
    right: auto; left: 50%; top: auto; bottom: 20px;
    transform: translate(-50%, 100px);
    width: calc(100vw - 32px); max-width: 400px; max-height: 50vh;
    border-radius: 14px; box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
  }
  #article-toc.visible { transform: translate(-50%, 0); }
}

/* === 侧边快捷导航（顶部导航不可见时出现） === */
#side-nav {
  position: fixed;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 89;
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
#side-nav.visible {
  opacity: 1;
  pointer-events: auto;
}
#side-nav a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--entry);
  border: 1px solid var(--border);
  color: var(--secondary);
  font-size: 0.8rem;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
#side-nav a:hover {
  color: var(--menu-text, var(--primary));
  background: var(--entry);
  transform: translateX(-2px);
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}
#side-nav a[aria-current="page"] {
  color: var(--menu-text, var(--primary));
  background: color-mix(in srgb, var(--menu-text, var(--primary)) 12%, transparent);
  border-color: var(--menu-text, var(--primary));
  font-weight: 600;
}
@media (max-width: 768px) {
  #side-nav { right: 8px; gap: 4px; }
  #side-nav a { min-width: 48px; height: 32px; padding: 0 10px; font-size: 0.75rem; }
}

/* === 外观设置面板 === */
.text-color-wrap {
  position: relative;
  display: inline-flex;
  margin-left: 2px;
}
.text-color-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--secondary);
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.text-color-toggle:hover {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 8%, transparent);
}
.text-color-toggle:active {
  transform: scale(0.95);
}
.text-color-pop {
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(-6px);
  z-index: 120;
  width: min(290px, calc(100vw - 32px));
  min-width: 0;
  max-height: min(76vh, 620px);
  overflow: auto;
  overscroll-behavior: contain;
  padding: 14px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.14);
  opacity: 0;
  pointer-events: none;
  line-height: 1.4;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.text-color-pop.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.tcp-title {
  font-size: .94rem;
  font-weight: 700;
  color: var(--secondary);
  margin-bottom: 12px;
}
.tcp-preview {
  height: 72px;
  margin-bottom: 12px;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--theme);
}
.tcp-preview-card {
  height: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--entry);
  overflow: hidden;
}
.tcp-preview-title {
  display: block;
  width: 72px;
  height: 7px;
  border-radius: 4px;
  background: var(--primary);
}
.tcp-preview-line {
  display: block;
  width: 112px;
  height: 5px;
  margin-top: 7px;
  border-radius: 3px;
  background: var(--secondary);
}
.tcp-group-label {
  margin: 0 0 6px;
  font-size: .72rem;
  font-weight: 600;
  color: var(--secondary);
  letter-spacing: .02em;
}
.tcp-mode,
.tcp-tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: 12px;
  padding: 0 0 2px;
}
.tcp-mode button,
.tcp-tab {
  display: grid;
  place-items: center;
  height: 30px;
  line-height: 1;
  padding: 0;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--secondary);
  font-size: .78rem;
  cursor: pointer;
  transition: color .2s ease, background .2s ease;
}
.tcp-mode button.active,
.tcp-tab.active {
  background: transparent;
  color: var(--primary) !important;
  border-bottom-color: var(--primary);
  font-weight: 650;
  box-shadow: none;
}
.tcp-panel {
  display: none;
}
.tcp-panel.active {
  display: block;
}
.tcp-swatches {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.tcp-swatch {
  width: 100%;
  aspect-ratio: 1;
  padding: 0;
  border: 1px solid rgba(127,127,127,.35);
  border-radius: 50%;
  border: 2px solid transparent;
  outline: 2px solid transparent;
  outline-offset: 2px;
  cursor: pointer;
  transition: transform 0.15s ease, outline-color 0.2s ease;
}
.tcp-swatch:hover {
  transform: scale(1.12);
}
.tcp-swatch.active {
  border-color: var(--primary);
  outline-color: var(--secondary);
}
.tcp-swatch.is-default {
  background: linear-gradient(135deg, #ffffff 48%, #1d1e20 52%) !important;
}
.tcp-custom {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.tcp-custom input[type="color"] {
  width: 34px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--code-bg);
  cursor: pointer;
}
.tcp-custom label {
  font-size: .78rem;
  color: var(--secondary);
  cursor: pointer;
}
.tcp-reset {
  width: 100%;
  padding: 8px 0;
  line-height: 1.4;
  font-size: .78rem;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: color-mix(in srgb, var(--primary) 6%, var(--theme));
  color: var(--primary);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.tcp-reset:hover {
  color: var(--primary);
  border-color: var(--primary);
}
@media (max-width: 768px) {
  .text-color-pop {
    position: fixed;
    left: 12px !important;
    right: 12px !important;
    top: calc(var(--header-height) + 20px);
    width: auto;
    transform: none;
  }
  .text-color-pop.open {
    transform: none;
  }
}

/* 文章内宽表格：窄屏可横向滚动，避免右侧列被裁切 */
.post-content.md-content table {
  display: block;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-collapse: collapse;
}
.post-content.md-content table th,
.post-content.md-content table td {
  min-width: 72px;
  word-break: break-word;
}
</style>

{{/* ============================================================
     F 主题（Product Launch / dark modern）
     视觉层覆盖：只改样式与首页 hero 结构，不改任何功能逻辑。
     颜色全部走 CSS 变量，外观设置（文字/背景/卡片改色）仍然生效。
     ============================================================ */}}
<style id="f-theme">
:root{
  --f-accent:#5B7BFF;
  --f-accent-2:#8FA8FF;
  --f-radius:16px;
  --f-radius-lg:22px;
  --f-maxw:1000px;
  --radius:16px;
}
/* 深色（默认 F 基调）：所有颜色仍可被外观设置的内联变量覆盖 */
:root[data-theme="dark"]{
  --theme:#0A0A0B;
  --entry:#141419;
  --primary:#F5F5F7;
  --secondary:#A1A1A6;
  --tertiary:#26262C;
  --content:#D8D8DE;
  --code-block-bg:#101014;
  --code-bg:#17171D;
  --border:#26262D;
}
:root:not([data-theme="dark"]){
  --theme:#FFFFFF;
  --entry:#F6F6F9;
  --primary:#0A0A0B;
  --secondary:#5D5D66;
  --tertiary:#E7E7EC;
  --content:#24242A;
  --code-block-bg:#101014;
  --code-bg:#F1F1F5;
  --border:#E4E4EA;
}
:root:not([data-theme="dark"]) body.list{background:var(--theme)}
html{background:var(--theme)}
body{
  background:var(--theme);
  color:var(--primary);
  font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;

}
body::before{
  content:"";

  background:
    radial-gradient(920px 480px at 86% -10%, color-mix(in srgb, var(--f-accent) 20%, transparent), transparent 62%),
    radial-gradient(680px 420px at 6% 4%, color-mix(in srgb, var(--f-accent) 9%, transparent), transparent 60%);
}
:root:not([data-theme="dark"]) body::before{opacity:.55}
::selection{background:color-mix(in srgb, var(--f-accent) 45%, transparent);color:#fff}

    var content = parseColor(window.__textColorAdjust(toHex(mixColors(primary, bgRgb, 0.1)), bg, 4.0));
    var secondary = parseColor(window.__textColorAdjust(toHex(mixColors(primary, bgRgb, 0.28)), bg, 3.2));
    return { primary: toHex(primary), content: toHex(content), secondary: toHex(secondary) };
  };
  window.__normalizeColor = function (color) {
    var rgb = parseColor(color);
    return rgb ? toHex(rgb) : '';
  };
  window.__surfacePalette = function (background, card) {
    var bgRgb = parseColor(background) || [255, 255, 255];
    var cardRgb = parseColor(card) || bgRgb;
    var bgLum = luminance(bgRgb);
    var balanced = cardRgb;
    for (var i = 0; i <= 20; i++) {
      balanced = mixColors(cardRgb, bgRgb, i / 20);
      if (Math.abs(luminance(balanced) - bgLum) <= 0.18) break;
    }
    var dark = bgLum < 0.25;
    var edge = dark ? [255, 255, 255] : [16, 18, 22];
    return {
      theme: toHex(bgRgb),
      entry: toHex(balanced),
      codeBg: toHex(mixColors(balanced, bgRgb, 0.28)),
      border: toHex(mixColors(balanced, edge, dark ? 0.17 : 0.13))
    };
  };
  window.__appearanceDefault = function (name) {
    var root = document.documentElement;
    var previous = root.style.getPropertyValue(name);
    root.style.removeProperty(name);
    var value = getComputedStyle(root).getPropertyValue(name).trim();
    if (previous) root.style.setProperty(name, previous);
    return value;
  };
  window.__readAppearancePrefs = function () {
    var prefs = {};
    try {
      var raw = JSON.parse(localStorage.getItem('pref-appearance-v2') || 'null');
      if (raw && typeof raw === 'object') {
        ['text', 'background', 'card'].forEach(function (key) {
          if (typeof raw[key] === 'string' && raw[key]) prefs[key] = raw[key];
        });
      }
    } catch (e) {}
    if (!prefs.text) {
      var legacy = localStorage.getItem('pref-text-color') || localStorage.getItem('pref-menu-text');
      if (legacy) prefs.text = legacy;
    }
    return prefs;
  };
  window.__applyAppearance = function (prefs) {
    prefs = prefs || {};
    var root = document.documentElement;
    var theme = prefs.background || window.__appearanceDefault('--theme');
    var entry = prefs.card || window.__appearanceDefault('--entry');
    var surfaces = window.__surfacePalette(theme, entry);
    if (prefs.background || prefs.card) {
      root.style.setProperty('--theme', surfaces.theme);
      root.style.setProperty('--entry', surfaces.entry);
      root.style.setProperty('--code-bg', surfaces.codeBg);
      root.style.setProperty('--border', surfaces.border);
      root.style.setProperty('--tertiary', surfaces.border);
      root.style.colorScheme = luminance(parseColor(surfaces.theme)) < 0.25 ? 'dark' : 'light';
    } else {
      ['--theme', '--entry', '--code-bg', '--border', '--tertiary'].forEach(function (name) {
        root.style.removeProperty(name);
      });
      root.style.removeProperty('color-scheme');
    }
    var textColor = prefs.text || (prefs.background ? (luminance(parseColor(surfaces.theme)) < 0.25 ? '#dadadb' : '#1f2328') : '');
    if (textColor) {
      var palette = window.__textColorPalette(textColor, surfaces.theme);
      if (palette) {
        root.style.setProperty('--primary', palette.primary);
        root.style.setProperty('--secondary', palette.secondary);
        root.style.setProperty('--content', palette.content);
      }
    } else {
      ['--primary', '--secondary', '--content'].forEach(function (name) {
        root.style.removeProperty(name);
      });
    }
  };
  try {
    window.__applyAppearance(window.__readAppearancePrefs());
  } catch (e) {}
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* 图片加载后淡入 */
  document.querySelectorAll('img[loading="lazy"]').forEach(img => {
    if (img.complete) { img.classList.add('loaded'); return; }
    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => img.classList.add('loaded'));
  });

  /* 滚动渐入动画 */
  const revealEls = document.querySelectorAll('.reveal');
  const revealObs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }});
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => revealObs.observe(el));
});
</script>
