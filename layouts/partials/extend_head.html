<!-- 全站交互效果 -->
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
/* === 全局平滑滚动 === */
html { scroll-behavior: smooth; }

/* === 选中文字颜色 === */
::selection { background: var(--primary); color: var(--theme); }

/* === 图片加载淡入 === */
img { transition: opacity 0.4s ease; }
img[loading="lazy"] { opacity: 0; }
img[loading="lazy"].loaded { opacity: 1; }

/* === 链接下划线动画 === */
a:not(.gallery-card-link):not(.gallery-item a) {
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-position: 0% 100%;
  background-repeat: no-repeat;
  background-size: 0% 1px;
  transition: background-size 0.3s ease;
}
a:hover:not(.gallery-card-link) {
  background-size: 100% 1px;
}

/* === 文章卡片悬浮 === */
.post-entry {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.post-entry:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

/* === 导航菜单项 === */
#menu, .nav, .menu {
  display: flex;
  gap: 4px;
}

#menu a, #menu li a,
.nav a, .menu a {
  position: relative;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 8px;
  color: var(--menu-text, var(--primary));
  font-weight: 450;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
}

/* hover 背景浮现 */
#menu a:hover, #menu li a:hover,
.nav a:hover, .menu a:hover {
  background: color-mix(in srgb, var(--menu-text, var(--primary)) 10%, transparent);
  transform: translateY(-1px);
  opacity: 1;
}

/* 当前页：底部指示条 + 加粗 */
#menu a[aria-current="page"],
#menu li a.active,
.nav a.active,
.menu a.active,
#menu a.active {
  font-weight: 600;
}
/* 点击波纹 */
#menu a:active, .nav a:active, .menu a:active {
  transform: scale(0.95);
}

/* === 代码块悬浮 === */
pre {
  transition: box-shadow 0.3s ease;
}
pre:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

/* === 分隔线脉动 === */
.post-content hr {
  transition: opacity 0.3s ease;
}
.post-content hr:hover {
  opacity: 0.6;
}

/* === 滚动渐入动画 === */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* === 回到顶部过渡 === */
#top-link {
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px);
  transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s linear 0.3s;
  pointer-events: none;
}
#top-link:not(.hidden) {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity 0.3s ease, transform 0.3s ease, visibility 0s;
  pointer-events: auto;
}
@media (max-width: 900px) {
  .list #top-link:not(.hidden) {
    transform: translateY(-5rem);
  }
}

/* === 小功能页面布局统一 === */
.main > [class$="-wrap"] {
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}
.main [class$="-wrap"] canvas {
  max-width: 100%;
}
.main [class$="-wrap"] button,
.main [class$="-wrap"] select,
.main [class$="-wrap"] input[type="text"],
.main [class$="-wrap"] input[type="number"],
.main [class$="-wrap"] input[type="date"],
.main [class$="-wrap"] input[type="search"],
.main [class$="-wrap"] textarea {
  min-height: 36px;
  font-size: 0.95rem;
}

/* === 按钮/标签点击反馈 === */
button, .button, .post-tag {
  transition: transform 0.15s ease, opacity 0.2s ease;
}
button:active, .button:active, .post-tag:active {
  transform: scale(0.96);
}

/* === 页面切换（非浏览器导航） === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.main {
  animation: fadeIn 0.4s ease;
}

/* === 暗色模式过渡 === */
body, .main, .post-entry, .gallery-item, a, button, pre, input, select, textarea {
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

/* === 文章悬浮导航栏 === */
#article-toc {
  position: fixed;
  left: max(8px, calc((100vw - 820px) / 2 - 260px));
  top: 120px;
  width: 200px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  z-index: 90;
  padding: 0 14px 16px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 0.82rem;
  line-height: 1.6;
  opacity: 0;
  transform: translateX(-12px);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  scrollbar-width: none;
}
#article-toc::-webkit-scrollbar { display: none; }
#article-toc.visible {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
#article-toc .toc-title {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 10px;
  color: var(--primary);
}
#article-toc .toc-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#article-toc .toc-title {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--entry);
  margin: 0 -14px 10px;
  padding: 16px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.toc-toggle {
  border: 1px solid var(--border);
  background: var(--entry);
  color: var(--secondary);
  font-size: 0.72rem;
  line-height: 1;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.toc-toggle:hover {
  color: var(--primary);
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
.toc-links {
  display: block;
  overflow: hidden;
  max-height: 1200px;
  opacity: 1;
  transform: translateY(0);
  transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.3s ease;
}
#article-toc.collapsed .toc-links {
  max-height: 0;
  opacity: 0;
  transform: translateY(-6px);
}
#article-toc.collapsed { padding-bottom: 10px; }
#article-toc a {
  display: block;
  padding: 3px 8px;
  margin: 1px 0;
  border-radius: 6px;
  color: var(--secondary);
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, background 0.2s, padding-left 0.2s;
  border-right: 2px solid transparent;
}
#article-toc a:hover {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
#article-toc a.active {
  color: var(--primary);
  font-weight: 600;
  background: color-mix(in srgb, var(--primary) 10%, transparent);
  border-right-color: var(--primary);
  padding-right: 12px;
}
#article-toc a.toc-h3 {
  padding-right: 18px;
  font-size: 0.78rem;
}
#article-toc a.toc-h3.active {
  padding-right: 22px;
}
@media (max-width: 1100px) {
  #article-toc { left: 8px; width: 180px; font-size: 0.78rem; }
}
@media (max-width: 768px) {
  #article-toc {
    right: auto; left: 50%; top: auto; bottom: 20px;
    transform: translate(-50%, 100px);
    width: calc(100vw - 32px); max-width: 400px; max-height: 50vh;
    border-radius: 14px; box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
  }
  #article-toc.visible { transform: translate(-50%, 0); }
}

/* === 侧边快捷导航（顶部导航不可见时出现） === */
#side-nav {
  position: fixed;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 89;
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
#side-nav.visible {
  opacity: 1;
  pointer-events: auto;
}
#side-nav a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--entry);
  border: 1px solid var(--border);
  color: var(--secondary);
  font-size: 0.8rem;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
#side-nav a:hover {
  color: var(--menu-text, var(--primary));
  background: var(--entry);
  transform: translateX(-2px);
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}
#side-nav a[aria-current="page"] {
  color: var(--menu-text, var(--primary));
  background: color-mix(in srgb, var(--menu-text, var(--primary)) 12%, transparent);
  border-color: var(--menu-text, var(--primary));
  font-weight: 600;
}
@media (max-width: 768px) {
  #side-nav { right: 8px; gap: 4px; }
  #side-nav a { min-width: 48px; height: 32px; padding: 0 10px; font-size: 0.75rem; }
}

/* === 导航文字颜色选择器 === */
.text-color-wrap {
  position: relative;
  display: inline-flex;
  margin-left: 2px;
}
.text-color-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--secondary);
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.text-color-toggle:hover {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 8%, transparent);
}
.text-color-toggle:active {
  transform: scale(0.95);
}
.text-color-pop {
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(-6px);
  z-index: 120;
  min-width: 188px;
  padding: 14px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.14);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.text-color-pop.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.tcp-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--secondary);
  margin-bottom: 10px;
}
.tcp-swatches {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.tcp-swatch {
  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  outline: 2px solid transparent;
  outline-offset: 2px;
  cursor: pointer;
  transition: transform 0.15s ease, outline-color 0.2s ease;
}
.tcp-swatch:hover {
  transform: scale(1.12);
}
.tcp-swatch.active {
  outline-color: var(--secondary);
}
.tcp-custom {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.tcp-custom input[type="color"] {
  width: 34px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--code-bg);
  cursor: pointer;
}
.tcp-custom label {
  font-size: 0.8rem;
  color: var(--secondary);
  cursor: pointer;
}
.tcp-reset {
  width: 100%;
  padding: 7px 0;
  font-size: 0.8rem;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--code-bg);
  color: var(--secondary);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.tcp-reset:hover {
  color: var(--primary);
  border-color: var(--primary);
}
@media (max-width: 768px) {
  .text-color-pop {
    left: auto;
    right: 0;
    transform: translateY(-6px);
  }
  .text-color-pop.open {
    transform: translateY(0);
  }
}
</style>

<script>
(function () {
  function parseColor(c) {
    c = (c || '').trim();
    if (c[0] === '#') {
      var h = c.slice(1);
      if (h.length === 3) h = h.replace(/./g, '$&$&');
      if (h.length === 8) h = h.slice(0, 6);
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    var m = c.match(/^rgba?\(([^)]+)\)$/);
    if (m) return m[1].split(',').slice(0, 3).map(function (v) { return parseFloat(v); });
    return null;
  }
  function luminance(rgb) {
    function fn(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * fn(rgb[0]) + 0.7152 * fn(rgb[1]) + 0.0722 * fn(rgb[2]);
  }
  function contrast(l1, l2) {
    var hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  function rgbToHsl(rgb) {
    var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), h = 0, s = 0, l = (max + min) / 2, d = max - min;
    if (d) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
    }
    return [h, s, l];
  }
  function hslToRgb(h, s, l) {
    var q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    function t(x) {
      if (x < 0) x += 1; if (x > 1) x -= 1;
      if (x < 1 / 6) return p + (q - p) * 6 * x;
      if (x < 1 / 2) return q;
      if (x < 2 / 3) return p + (q - p) * (2 / 3 - x) * 6;
      return p;
    }
    return [t(h + 1 / 3), t(h), t(h - 1 / 3)].map(function (v) { return Math.round(v * 255); });
  }
  window.__textColorAdjust = function (color, bg) {
    var rgb = parseColor(color);
    if (!rgb) return color;
    var bgRgb = parseColor(bg) || [255, 255, 255];
    var bgLum = luminance(bgRgb);
    if (contrast(luminance(rgb), bgLum) >= 3.2) return color;
    var hsl = rgbToHsl(rgb), step = bgLum < 0.25 ? 0.05 : -0.05, out = rgb;
    for (var i = 0; i < 20; i++) {
      hsl[2] = Math.min(0.96, Math.max(0.04, hsl[2] + step));
      out = hslToRgb(hsl[0], hsl[1], hsl[2]);
      if (contrast(luminance(out), bgLum) >= 3.2) break;
    }
    return '#' + out.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  };
  try {
    var raw = localStorage.getItem('pref-text-color') || localStorage.getItem('pref-menu-text');
    if (raw) {
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--theme');
      var adjusted = window.__textColorAdjust(raw, bg);
      document.documentElement.style.setProperty('--primary', adjusted);
      document.documentElement.style.setProperty('--secondary', adjusted);
      document.documentElement.style.setProperty('--content', adjusted);
    }
  } catch (e) {}
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* 图片加载后淡入 */
  document.querySelectorAll('img[loading="lazy"]').forEach(img => {
    if (img.complete) { img.classList.add('loaded'); return; }
    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => img.classList.add('loaded'));
  });

  /* 滚动渐入动画 */
  const revealEls = document.querySelectorAll('.reveal');
  const revealObs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }});
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => revealObs.observe(el));
});
</script>
