<!-- 全站交互效果 -->
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
/* === 全局平滑滚动 === */
html { scroll-behavior: smooth; }

/* === 选中文字颜色 === */
::selection { background: var(--primary); color: var(--theme); }

/* === 图片加载淡入 === */
img { transition: opacity 0.4s ease; }
img[loading="lazy"] { opacity: 0; }
img[loading="lazy"].loaded { opacity: 1; }

/* === 链接下划线动画 === */
a:not(.gallery-card-link):not(.gallery-item a) {
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-position: 0% 100%;
  background-repeat: no-repeat;
  background-size: 0% 1px;
  transition: background-size 0.3s ease;
}
a:hover:not(.gallery-card-link) {
  background-size: 100% 1px;
}

/* === 文章卡片悬浮 === */
.post-entry {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.post-entry:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

/* === 导航菜单项 === */
#menu, .nav, .menu {
  display: flex;
  gap: 4px;
}

#menu a, #menu li a,
.nav a, .menu a {
  position: relative;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 8px;
  color: var(--primary);
  font-weight: 450;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
}

/* hover 背景浮现 */
#menu a:hover, #menu li a:hover,
.nav a:hover, .menu a:hover {
  background: color-mix(in srgb, var(--primary) 8%, transparent);
  transform: translateY(-1px);
  opacity: 1;
}

/* 当前页：底部指示条 + 加粗 */
#menu a[aria-current="page"],
#menu li a.active,
.nav a.active,
.menu a.active,
#menu a.active {
  font-weight: 600;
}
#menu a[aria-current="page"]::after,
#menu li a.active::after,
.nav a.active::after,
.menu a.active::after,
#menu a.active::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--primary);
  transition: width 0.3s ease;
}
#menu a[aria-current="page"]:hover::after,
.nav a.active:hover::after {
  width: 28px;
}

/* 点击波纹 */
#menu a:active, .nav a:active, .menu a:active {
  transform: scale(0.95);
}

/* === 代码块悬浮 === */
pre {
  transition: box-shadow 0.3s ease;
}
pre:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

/* === 分隔线脉动 === */
.post-content hr {
  transition: opacity 0.3s ease;
}
.post-content hr:hover {
  opacity: 0.6;
}

/* === 滚动渐入动画 === */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* === 返回顶部按钮 === */
#back-to-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--entry);
  border: 1px solid var(--border);
  color: var(--primary);
  font-size: 1.2rem;
  cursor: pointer;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99;
}
#back-to-top.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
#back-to-top:hover {
  background: var(--primary);
  color: var(--theme);
}

/* === 按钮/标签点击反馈 === */
button, .button, .post-tag {
  transition: transform 0.15s ease, opacity 0.2s ease;
}
button:active, .button:active, .post-tag:active {
  transform: scale(0.96);
}

/* === 页面切换（非浏览器导航） === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.main {
  animation: fadeIn 0.4s ease;
}

/* === 暗色模式过渡 === */
body, .main, .post-entry, .gallery-item, a, button, pre, input, select, textarea {
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

/* === 文章悬浮导航栏 === */
#article-toc {
  position: fixed;
  left: max(16px, calc((100vw - 820px) / 2 - 220px));
  top: 120px;
  width: 200px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  z-index: 90;
  padding: 0 14px 16px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 0.82rem;
  line-height: 1.6;
  opacity: 0;
  transform: translateX(-12px);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  scrollbar-width: none;
}
#article-toc::-webkit-scrollbar { display: none; }
#article-toc.visible {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
#article-toc .toc-title {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 10px;
  color: var(--primary);
}
#article-toc .toc-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#article-toc .toc-title {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--entry);
  margin: 0 -14px 10px;
  padding: 16px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.toc-toggle {
  border: 1px solid var(--border);
  background: var(--entry);
  color: var(--secondary);
  font-size: 0.72rem;
  line-height: 1;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.toc-toggle:hover {
  color: var(--primary);
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
.toc-links {
  display: block;
  overflow: hidden;
  max-height: 1200px;
  opacity: 1;
  transform: translateY(0);
  transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.3s ease;
}
#article-toc.collapsed .toc-links {
  max-height: 0;
  opacity: 0;
  transform: translateY(-6px);
}
#article-toc.collapsed { padding-bottom: 10px; }
#article-toc a {
  display: block;
  padding: 3px 8px;
  margin: 1px 0;
  border-radius: 6px;
  color: var(--secondary);
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, background 0.2s, padding-left 0.2s;
  border-right: 2px solid transparent;
}
#article-toc a:hover {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
#article-toc a.active {
  color: var(--primary);
  font-weight: 600;
  background: color-mix(in srgb, var(--primary) 10%, transparent);
  border-right-color: var(--primary);
  padding-right: 12px;
}
#article-toc a.toc-h3 {
  padding-right: 18px;
  font-size: 0.78rem;
}
#article-toc a.toc-h3.active {
  padding-right: 22px;
}
@media (max-width: 1100px) {
  #article-toc { left: 8px; width: 180px; font-size: 0.78rem; }
}
@media (max-width: 768px) {
  #article-toc {
    right: auto; left: 50%; top: auto; bottom: 20px;
    transform: translate(-50%, 100px);
    width: calc(100vw - 32px); max-width: 400px; max-height: 50vh;
    border-radius: 14px; box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
  }
  #article-toc.visible { transform: translate(-50%, 0); }
}

/* === 侧边快捷导航（顶部导航不可见时出现） === */
#side-nav {
  position: fixed;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 89;
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
#side-nav.visible {
  opacity: 1;
  pointer-events: auto;
}
#side-nav a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--entry);
  border: 1px solid var(--border);
  color: var(--secondary);
  font-size: 0.8rem;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none !important;
  background-image: none !important;
  background-size: unset !important;
  transition: color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
#side-nav a:hover {
  color: var(--primary);
  background: var(--entry);
  transform: translateX(-2px);
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}
#side-nav a[aria-current="page"] {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  border-color: var(--primary);
  font-weight: 600;
}
@media (max-width: 768px) {
  #side-nav { right: 8px; gap: 4px; }
  #side-nav a { min-width: 48px; height: 32px; padding: 0 10px; font-size: 0.75rem; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* 图片加载后淡入 */
  document.querySelectorAll('img[loading="lazy"]').forEach(img => {
    if (img.complete) { img.classList.add('loaded'); return; }
    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => img.classList.add('loaded'));
  });

  /* 滚动渐入动画 */
  const revealEls = document.querySelectorAll('.reveal');
  const revealObs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }});
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => revealObs.observe(el));
});
</script>
