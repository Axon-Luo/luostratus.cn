<!-- 文章导航（仅文章页显示） -->
<nav id="article-toc" aria-label="文章目录"></nav>

<!-- 侧边快捷导航（滚动后出现，替代顶部导航） -->
<nav id="side-nav" aria-label="快捷导航"></nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* 当前页导航高亮 */
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('#menu a, .nav a, .menu a').forEach(link => {
    const href = link.getAttribute('href');
    if (!href) return;
    try {
      const u = new URL(href, window.location.origin);
      const linkPath = u.pathname.replace(/\/$/, '') || '/';
      if (linkPath === currentPath) {
        link.setAttribute('aria-current', 'page');
        link.classList.add('active');
      }
    } catch(e) {}
  });

  /* === 文章导航栏 === */
  buildArticleTOC();

  /* === 侧边快捷导航 === */
  buildSideNav();

  /* === 导航文字颜色选择 === */
  buildTextColorPicker();
});
</script>

<script>
function buildArticleTOC() {
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  if (currentPath === '/about') return;

  const content = document.querySelector('.post-content');
  if (!content) return;

  const headings = content.querySelectorAll('h2, h3');
  if (headings.length < 2) return;

  // 创建导航容器
  const toc = document.getElementById('article-toc');
  if (!toc) return;
  toc.innerHTML = '<div class="toc-title">目录 <button type="button" class="toc-toggle" aria-label="收起目录">收起</button></div><div class="toc-links"></div>';
  const tocLinks = toc.querySelector('.toc-links');

  // 给每个标题添加 id
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'section-' + i;
  });

  let activeLink = null;

  // 构建链接
  const links = [];
  headings.forEach(h => {
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.className = h.tagName === 'H3' ? 'toc-h3' : '';
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(h.id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
      }
    });
    tocLinks.appendChild(a);
    links.push({ el: a, heading: h });
  });

  // 收起/展开目录
  const toggle = toc.querySelector('.toc-toggle');
  try {
    if (localStorage.getItem('articleTocCollapsed') === '1') toc.classList.add('collapsed');
  } catch(e) {}
  const syncToggle = () => {
    const collapsed = toc.classList.contains('collapsed');
    toggle.textContent = collapsed ? '展开' : '收起';
    toggle.setAttribute('aria-label', collapsed ? '展开目录' : '收起目录');
    try { localStorage.setItem('articleTocCollapsed', collapsed ? '1' : '0'); } catch(e) {}
  };
  toggle.addEventListener('click', () => {
    toc.classList.toggle('collapsed');
    syncToggle();
  });
  syncToggle();

  // IntersectionObserver 追踪当前章节
  const observer = new IntersectionObserver(entries => {
    // 找到第一个可见的标题
    let firstVisible = null;
    entries.forEach(e => {
      if (e.isIntersecting && !firstVisible) {
        firstVisible = e.target;
      }
    });

    if (firstVisible) {
      const id = firstVisible.id;
      links.forEach(l => {
        if (l.heading.id === id) {
          if (activeLink) activeLink.classList.remove('active');
          l.el.classList.add('active');
          activeLink = l.el;
          // 自动滚动 toc 使当前项可见
          l.el.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' });
        }
      });
    }
  }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

  headings.forEach(h => observer.observe(h));

  // 显示导航
  toc.classList.add('visible');
}

function buildSideNav() {
  // 只在文章页构建
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  if (currentPath === '/about') return;

  const header = document.querySelector('.header, header, #header');
  if (!header) return;

  const sideNav = document.getElementById('side-nav');
  if (!sideNav) return;

  // 从顶部导航复制菜单项
  const menuLinks = document.querySelectorAll('#menu a, .nav a, .menu a');
  if (menuLinks.length === 0) return;

  menuLinks.forEach(link => {
    const a = document.createElement('a');
    a.href = link.href;
    const text = link.textContent.trim();
    a.textContent = text;
    if (link.getAttribute('aria-current') === 'page' || link.classList.contains('active')) {
      a.setAttribute('aria-current', 'page');
    }
    sideNav.appendChild(a);
  });

  // 滚动时切换：顶部导航不可见 → 显示侧边导航
  let sideVisible = false;
  const onScroll = () => {
    const headerBottom = header.getBoundingClientRect().bottom;
    const shouldShow = headerBottom < 0;
    if (shouldShow !== sideVisible) {
      sideVisible = shouldShow;
      sideNav.classList.toggle('visible', shouldShow);
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
}

function buildTextColorPicker() {
  const switches = document.querySelector('.logo-switches');
  if (!switches || document.getElementById('text-color-toggle')) return;

  const STORE_KEY = 'pref-menu-text';
  const PALETTE_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>';
  const PRESETS = [
    ['星蓝', '#4a90d9'],
    ['青碧', '#2aa198'],
    ['暖金', '#d9a441'],
    ['玫粉', '#d9608f'],
    ['紫藤', '#8e7cc3']
  ];

  const wrap = document.createElement('span');
  wrap.className = 'text-color-wrap';

  const toggle = document.createElement('button');
  toggle.id = 'text-color-toggle';
  toggle.className = 'text-color-toggle';
  toggle.type = 'button';
  toggle.title = '文字颜色';
  toggle.setAttribute('aria-label', '文字颜色');
  toggle.setAttribute('aria-expanded', 'false');
  toggle.innerHTML = PALETTE_ICON;

  const pop = document.createElement('div');
  pop.id = 'text-color-pop';
  pop.className = 'text-color-pop';
  pop.innerHTML = '<div class="tcp-title">导航文字颜色</div><div class="tcp-swatches"></div><div class="tcp-custom"><input type="color" id="tcp-custom-input" value="#4a90d9" aria-label="自定义颜色"><label for="tcp-custom-input">自定义</label></div><button type="button" class="tcp-reset">恢复默认</button>';

  wrap.append(toggle, pop);
  switches.appendChild(wrap);

  const swatchBox = pop.querySelector('.tcp-swatches');
  const customInput = pop.querySelector('#tcp-custom-input');
  const resetButton = pop.querySelector('.tcp-reset');

  const closePop = () => {
    pop.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  };
  const applyColor = color => {
    if (!color) return;
    document.documentElement.style.setProperty('--menu-text', color);
    try { localStorage.setItem(STORE_KEY, color); } catch (e) {}
    customInput.value = color;
    swatchBox.querySelectorAll('.tcp-swatch').forEach(b => {
      b.classList.toggle('active', b.dataset.color.toLowerCase() === color.toLowerCase());
    });
  };

  PRESETS.forEach(([name, color]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tcp-swatch';
    b.style.background = color;
    b.dataset.color = color;
    b.title = name;
    b.setAttribute('aria-label', '导航文字颜色：' + name);
    b.addEventListener('click', () => applyColor(color));
    swatchBox.appendChild(b);
  });

  customInput.addEventListener('input', () => applyColor(customInput.value));
  resetButton.addEventListener('click', () => {
    document.documentElement.style.removeProperty('--menu-text');
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    customInput.value = '#4a90d9';
    swatchBox.querySelectorAll('.tcp-swatch').forEach(b => b.classList.remove('active'));
  });

  toggle.addEventListener('click', e => {
    e.stopPropagation();
    const open = pop.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  pop.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', e => {
    if (!wrap.contains(e.target)) closePop();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePop();
  });

  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) {
      customInput.value = saved;
      swatchBox.querySelectorAll('.tcp-swatch').forEach(b => {
        b.classList.toggle('active', b.dataset.color.toLowerCase() === saved.toLowerCase());
      });
    }
  } catch (e) {}
}
</script>
