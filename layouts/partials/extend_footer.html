<!-- 文章导航（仅文章页显示） -->
<nav id="article-toc" aria-label="文章目录"></nav>

<!-- 侧边快捷导航（滚动后出现，替代顶部导航） -->
<nav id="side-nav" aria-label="快捷导航"></nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  /* 当前页导航高亮 */
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('#menu a, .nav a, .menu a').forEach(link => {
    const href = link.getAttribute('href');
    if (!href) return;
    try {
      const u = new URL(href, window.location.origin);
      const linkPath = u.pathname.replace(/\/$/, '') || '/';
      if (linkPath === currentPath) {
        link.setAttribute('aria-current', 'page');
        link.classList.add('active');
      }
    } catch(e) {}
  });

  /* === 文章导航栏 === */
  buildArticleTOC();

  /* === 侧边快捷导航 === */
  buildSideNav();

  /* === 导航文字颜色选择 === */
  buildTextColorPicker();
});
</script>

<script>
function buildArticleTOC() {
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  if (currentPath === '/about') return;

  const content = document.querySelector('.post-content');
  if (!content) return;

  const headings = content.querySelectorAll('h2, h3');
  if (headings.length < 2) return;

  // 创建导航容器
  const toc = document.getElementById('article-toc');
  if (!toc) return;
  toc.innerHTML = '<div class="toc-title">目录 <button type="button" class="toc-toggle" aria-label="收起目录">收起</button></div><div class="toc-links"></div>';
  const tocLinks = toc.querySelector('.toc-links');

  // 给每个标题添加 id
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'section-' + i;
  });

  let activeLink = null;

  // 构建链接
  const links = [];
  headings.forEach(h => {
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.className = h.tagName === 'H3' ? 'toc-h3' : '';
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(h.id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
      }
    });
    tocLinks.appendChild(a);
    links.push({ el: a, heading: h });
  });

  // 收起/展开目录
  const toggle = toc.querySelector('.toc-toggle');
  try {
    if (localStorage.getItem('articleTocCollapsed') === '1') toc.classList.add('collapsed');
  } catch(e) {}
  const syncToggle = () => {
    const collapsed = toc.classList.contains('collapsed');
    toggle.textContent = collapsed ? '展开' : '收起';
    toggle.setAttribute('aria-label', collapsed ? '展开目录' : '收起目录');
    try { localStorage.setItem('articleTocCollapsed', collapsed ? '1' : '0'); } catch(e) {}
  };
  toggle.addEventListener('click', () => {
    toc.classList.toggle('collapsed');
    syncToggle();
  });
  syncToggle();

  // IntersectionObserver 追踪当前章节
  const observer = new IntersectionObserver(entries => {
    // 找到第一个可见的标题
    let firstVisible = null;
    entries.forEach(e => {
      if (e.isIntersecting && !firstVisible) {
        firstVisible = e.target;
      }
    });

    if (firstVisible) {
      const id = firstVisible.id;
      links.forEach(l => {
        if (l.heading.id === id) {
          if (activeLink) activeLink.classList.remove('active');
          l.el.classList.add('active');
          activeLink = l.el;
          // 自动滚动 toc 使当前项可见
          l.el.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' });
        }
      });
    }
  }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

  headings.forEach(h => observer.observe(h));

  // 显示导航
  toc.classList.add('visible');
}

function buildSideNav() {
  // 只在文章页构建
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  if (currentPath === '/about') return;

  const header = document.querySelector('.header, header, #header');
  if (!header) return;

  const sideNav = document.getElementById('side-nav');
  if (!sideNav) return;

  // 从顶部导航复制菜单项
  const menuLinks = document.querySelectorAll('#menu a, .nav a, .menu a');
  if (menuLinks.length === 0) return;

  menuLinks.forEach(link => {
    const a = document.createElement('a');
    a.href = link.href;
    const text = link.textContent.trim();
    a.textContent = text;
    if (link.getAttribute('aria-current') === 'page' || link.classList.contains('active')) {
      a.setAttribute('aria-current', 'page');
    }
    sideNav.appendChild(a);
  });

  // 滚动时切换：顶部导航不可见 → 显示侧边导航
  let sideVisible = false;
  const onScroll = () => {
    const headerBottom = header.getBoundingClientRect().bottom;
    const shouldShow = headerBottom < 0;
    if (shouldShow !== sideVisible) {
      sideVisible = shouldShow;
      sideNav.classList.toggle('visible', shouldShow);
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
}

function buildTextColorPicker() {
  const switches = document.querySelector('.logo-switches');
  if (!switches || document.getElementById('text-color-toggle')) return;

  const STORE_KEY = 'pref-appearance-v2';
  const PALETTE_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>';
  const TEXT_PRESETS = [
    ['星蓝', '#4a90d9'], ['青碧', '#2aa198'], ['暖金', '#d9a441'],
    ['玫粉', '#d9608f'], ['紫藤', '#8e7cc3'], ['墨黑', '#1f2328']
  ];
  const BACKGROUND_PRESETS = [
    ['象牙白', '#f7f4ee'], ['暖砂', '#efe3d2'], ['雾蓝', '#e7edf6'],
    ['青竹', '#e8f2ec'], ['墨岩', '#23262b'], ['碳黑', '#151719']
  ];
  const CARD_PRESETS = [
    ['纯白', '#ffffff'], ['米白', '#fdf9f2'], ['雾蓝', '#f4f7fb'],
    ['暖灰', '#eeeae3'], ['墨灰', '#30343b'], ['碳黑', '#1d2024']
  ];

  const wrap = document.createElement('span');
  wrap.className = 'text-color-wrap';

  const toggle = document.createElement('button');
  toggle.id = 'text-color-toggle';
  toggle.className = 'text-color-toggle';
  toggle.type = 'button';
  toggle.title = '外观设置';
  toggle.setAttribute('aria-label', '外观设置');
  toggle.setAttribute('aria-expanded', 'false');
  toggle.innerHTML = PALETTE_ICON;

  const pop = document.createElement('div');
  pop.id = 'text-color-pop';
  pop.className = 'text-color-pop';
  pop.innerHTML = [
    '<div class="tcp-title">外观设置</div>',
    '<div class="tcp-preview"><div class="tcp-preview-card"><span class="tcp-preview-title"></span><span class="tcp-preview-line"></span></div></div>',
    '<div class="tcp-mode">',
    '<button type="button" data-mode="auto">自动</button>',
    '<button type="button" data-mode="light">浅色</button>',
    '<button type="button" data-mode="dark">深色</button>',
    '</div>',
    '<div class="tcp-tabs">',
    '<button type="button" class="tcp-tab active" data-panel="text">文字</button>',
    '<button type="button" class="tcp-tab" data-panel="background">背景</button>',
    '<button type="button" class="tcp-tab" data-panel="card">卡片</button>',
    '</div>',
    '<section class="tcp-panel active" data-panel="text"><p class="tcp-group-label">文字颜色</p><div class="tcp-swatches" data-kind="text"></div><div class="tcp-custom"><input type="color" data-kind-input="text" value="#4a90d9" aria-label="自定义文字颜色"><label>自定义文字</label></div></section>',
    '<section class="tcp-panel" data-panel="background"><p class="tcp-group-label">网页背景</p><div class="tcp-swatches" data-kind="background"></div><div class="tcp-custom"><input type="color" data-kind-input="background" value="#f7f4ee" aria-label="自定义网页背景"><label>自定义背景</label></div></section>',
    '<section class="tcp-panel" data-panel="card"><p class="tcp-group-label">卡片颜色</p><div class="tcp-swatches" data-kind="card"></div><div class="tcp-custom"><input type="color" data-kind-input="card" value="#ffffff" aria-label="自定义卡片颜色"><label>自定义卡片</label></div></section>',
    '<button type="button" class="tcp-reset">全部恢复默认</button>'
  ].join('');

  wrap.append(toggle, pop);
  switches.appendChild(wrap);

  const swatchBoxes = [...pop.querySelectorAll('.tcp-swatches')];
  const customInputs = [...pop.querySelectorAll('[data-kind-input]')];
  const modeButtons = [...pop.querySelectorAll('[data-mode]')];
  const tabButtons = [...pop.querySelectorAll('.tcp-tab')];
  const panels = [...pop.querySelectorAll('.tcp-panel')];
  const resetButton = pop.querySelector('.tcp-reset');
  const DEFAULT_COLORS = { text: '#4a90d9', background: '#f7f4ee', card: '#ffffff' };
  const PRESET_GROUPS = { text: TEXT_PRESETS, background: BACKGROUND_PRESETS, card: CARD_PRESETS };

  const closePop = () => {
    pop.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  };
  const readPrefs = () => window.__readAppearancePrefs ? window.__readAppearancePrefs() : {};
  const savePrefs = prefs => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(prefs)); } catch (e) {}
  };
  const syncMode = () => {
    let mode;
    try { mode = localStorage.getItem('pref-theme'); } catch (e) {}
    mode = mode === 'light' || mode === 'dark' ? mode : 'auto';
    modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
  };
  const sync = prefs => {
    syncMode();
    swatchBoxes.forEach(box => {
      const kind = box.dataset.kind;
      const value = (prefs[kind] || '').toLowerCase();
      box.querySelectorAll('.tcp-swatch').forEach(button => {
        const active = value
          ? button.dataset.color.toLowerCase() === value
          : button.classList.contains('default-color');
        button.classList.toggle('active', active);
      });
    });
    customInputs.forEach(input => {
      input.value = prefs[input.dataset.kindInput] || DEFAULT_COLORS[input.dataset.kindInput];
    });
  };
  const applyPrefs = (prefs, persist = true) => {
    const clean = {};
    ['text', 'background', 'card'].forEach(kind => {
      const color = window.__normalizeColor ? window.__normalizeColor(prefs[kind]) : prefs[kind];
      if (color) clean[kind] = color;
    });
    if (window.__applyAppearance) window.__applyAppearance(clean);
    if (persist) savePrefs(clean);
    sync(clean);
  };

  Object.entries(PRESET_GROUPS).forEach(([kind, presets]) => {
    const box = pop.querySelector(`.tcp-swatches[data-kind="${kind}"]`);
    const defaultButton = document.createElement('button');
    defaultButton.type = 'button';
    defaultButton.className = 'tcp-swatch is-default default-color';
    defaultButton.dataset.color = '';
    defaultButton.title = '默认';
    defaultButton.setAttribute('aria-label', kind + '使用默认颜色');
    defaultButton.addEventListener('click', () => {
      const prefs = readPrefs();
      delete prefs[kind];
      applyPrefs(prefs);
    });
    box.appendChild(defaultButton);

    presets.forEach(([name, color]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tcp-swatch';
      button.style.background = color;
      button.dataset.color = color;
      button.title = name;
      button.setAttribute('aria-label', kind + '颜色：' + name);
      button.addEventListener('click', () => applyPrefs({ ...readPrefs(), [kind]: color }));
      box.appendChild(button);
    });
  });

  customInputs.forEach(input => {
    input.addEventListener('input', () => applyPrefs({ ...readPrefs(), [input.dataset.kindInput]: input.value }));
  });

  modeButtons.forEach(button => button.addEventListener('click', () => {
    const mode = button.dataset.mode;
    try {
      if (mode === 'auto') localStorage.removeItem('pref-theme');
      else localStorage.setItem('pref-theme', mode);
    } catch (e) {}
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = mode === 'auto' ? (systemDark ? 'dark' : 'light') : mode;
    applyPrefs(readPrefs(), false);
  }));

  tabButtons.forEach(button => button.addEventListener('click', () => {
    tabButtons.forEach(item => item.classList.toggle('active', item === button));
    panels.forEach(panel => panel.classList.toggle('active', panel.dataset.panel === button.dataset.panel));
  }));

  resetButton.addEventListener('click', () => {
    try {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem('pref-text-color');
      localStorage.removeItem('pref-menu-text');
    } catch (e) {}
    applyPrefs({});
  });

  toggle.addEventListener('click', e => {
    e.stopPropagation();
    const open = pop.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  pop.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', e => {
    if (!wrap.contains(e.target)) closePop();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePop();
  });

  new MutationObserver(() => {
    try {
      applyPrefs(readPrefs(), false);
    } catch (e) {}
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
    let mode;
    try { mode = localStorage.getItem('pref-theme'); } catch (e) {}
    if (mode === 'light' || mode === 'dark') return;
    document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
    applyPrefs(readPrefs(), false);
  });
  sync(readPrefs());
}
</script>
