<style>
.snake-wrap { max-width: 700px; margin: 0 auto; }
.snake-controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.snake-controls label { font-size: 0.85rem; color: var(--secondary); display: flex; align-items: center; gap: 6px; }
.snake-controls label[hidden] { display: none; }
.snake-controls select,
.snake-controls input[type="range"] { padding: 5px 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent); background: var(--entry); color: var(--primary); font-size: 0.85rem; }
.snake-controls input[type="range"] { accent-color: var(--primary); }
.snake-controls input[type="checkbox"] { accent-color: var(--primary); }
.snake-btn { padding: 7px 16px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--primary) 24%, transparent); background: color-mix(in srgb, var(--primary) 10%, var(--entry)); color: var(--primary); font-size: 0.88rem; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
.snake-btn:hover { background: color-mix(in srgb, var(--primary) 18%, var(--entry)); border-color: color-mix(in srgb, var(--primary) 38%, transparent); }
.snake-btn.primary { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.snake-btn.primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--entry)); }
.snake-info { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 14px; font-size: 0.95rem; }
.snake-info span { color: var(--secondary); }
.snake-info strong { color: var(--primary); }
.snake-canvas-wrap { display: flex; justify-content: center; }
#snakeCanvas { border: 2px solid color-mix(in srgb, var(--primary) 22%, transparent); border-radius: 8px; background: var(--entry); display: block; max-width: 100%; height: auto; touch-action: none; }
.snake-status { min-height: 20px; margin-top: 10px; font-size: 0.85rem; color: var(--secondary); }
.snake-status.warn { color: #f87171; }
.snake-hint { margin-top: 6px; font-size: 0.78rem; color: var(--secondary); }
</style>

<div class="snake-wrap">
  <div class="snake-controls">
    <label>难度：
      <select id="snakeDiff">
        <option value="easy">简单</option>
        <option value="normal" selected>普通</option>
        <option value="hard">困难</option>
        <option value="custom">自定义</option>
      </select>
    </label>
    <label id="snakeSizeLabel" hidden>网格：<input type="range" id="snakeSize" min="10" max="30" value="20"></label>
    <label id="snakeSpeedLabel" hidden>速度(ms)：<input type="range" id="snakeSpeed" min="30" max="200" value="80"></label>
    <label><input type="checkbox" id="snakeWrap"> 穿墙</label>
    <button id="snakeStart" class="snake-btn primary">开始 / 重新开始</button>
    <button id="snakePause" class="snake-btn">暂停</button>
  </div>
  <div class="snake-info">
    <span>得分：<strong id="snakeScore">0</strong></span>
    <span>最高分：<strong id="snakeBest">0</strong></span>
    <span>长度：<strong id="snakeLen">1</strong></span>
  </div>
  <div class="snake-canvas-wrap">
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
  </div>
  <div class="snake-status" id="snakeStatus"></div>
  <div class="snake-hint">方向键 / WASD 控制方向，空格或按钮暂停；手机可在画面上滑动。</div>
</div>

<script>
(()=>{
  const canvas=document.getElementById('snakeCanvas'),ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('snakeScore'),bestEl=document.getElementById('snakeBest'),lenEl=document.getElementById('snakeLen');
  const diffSel=document.getElementById('snakeDiff'),sizeInp=document.getElementById('snakeSize'),speedInp=document.getElementById('snakeSpeed'),wrapChk=document.getElementById('snakeWrap'),startBtn=document.getElementById('snakeStart'),pauseBtn=document.getElementById('snakePause');
  const sizeLbl=document.getElementById('snakeSizeLabel'),speedLbl=document.getElementById('snakeSpeedLabel'),statusEl=document.getElementById('snakeStatus');

  let grid=20, speed=80, wrapMode=false;
  let snake=[{x:10,y:10}], food={x:15,y:15}, dir={x:1,y:0}, nextDir={x:1,y:0};
  let running=false, paused=false, gameOver=false, score=0, timer=null;
  const CELL=20;

  const colors={bg:'#1e1e2e',snake:'#4ade80',head:'#22c55e',food:'#ef4444',grid:'#2a2a3a'};

  function loadDiff(){
    const v=diffSel.value;
    if(v==='easy'){ grid=15; speed=120; }
    else if(v==='normal'){ grid=20; speed=80; }
    else if(v==='hard'){ grid=25; speed=50; }
    sizeLbl.hidden=v!=='custom'; speedLbl.hidden=v!=='custom';
    if(v==='custom'){ grid=+sizeInp.value; speed=+speedInp.value; }
    canvas.width=canvas.height=grid*CELL;
    resetGame();
  }
  sizeInp.oninput=()=>{ if(diffSel.value==='custom'){ grid=+sizeInp.value; canvas.width=canvas.height=grid*CELL; resetGame(); }};
  speedInp.oninput=()=>{ if(diffSel.value==='custom'){ speed=+speedInp.value; if(running&&!paused){ clearInterval(timer); timer=setInterval(tick,speed); } }};
  diffSel.onchange=loadDiff;
  wrapChk.onchange=()=>{ wrapMode=wrapChk.checked; };

  function setStatus(msg,warn){ statusEl.textContent=msg||''; statusEl.classList.toggle('warn',!!warn); }

  function resetGame(){
    clearInterval(timer); running=false; paused=false; gameOver=false;
    pauseBtn.textContent='暂停';
    const mid=Math.floor(grid/2);
    snake=[{x:mid,y:mid}]; dir={x:1,y:0}; nextDir={x:1,y:0}; score=0;
    placeFood();
    updateUI();
    setStatus('');
    draw();
  }

  function placeFood(){
    const occupied=new Set(snake.map(s=>`${s.x},${s.y}`));
    const free=[]; for(let x=0;x<grid;x++) for(let y=0;y<grid;y++) if(!occupied.has(`${x},${y}`)) free.push({x,y});
    if(free.length) food=free[Math.floor(Math.random()*free.length)];
  }

  function updateUI(){ scoreEl.textContent=score; lenEl.textContent=snake.length;
    const b=localStorage.getItem('snakeBest')||0; if(score>b){ localStorage.setItem('snakeBest',score); bestEl.textContent=score; } else bestEl.textContent=b;
  }
  bestEl.textContent=localStorage.getItem('snakeBest')||0;

  function draw(){
    ctx.fillStyle=colors.bg; ctx.fillRect(0,0,canvas.width,canvas.height);
    // grid lines
    ctx.strokeStyle=colors.grid; ctx.lineWidth=0.5;
    for(let i=0;i<=grid;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
    for(let i=0;i<=grid;i++){ ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke(); }
    // snake
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?colors.head:colors.snake;
      ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    });
    // food
    ctx.fillStyle=colors.food;
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2); ctx.fill();
    if(gameOver||paused){
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font=`${Math.max(18,Math.round(canvas.width/16))}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(gameOver?'游戏结束':'已暂停',canvas.width/2,canvas.height/2);
      ctx.font=`${Math.max(12,Math.round(canvas.width/28))}px sans-serif`;
      ctx.fillText(gameOver?`得分 ${score} · 点击「开始 / 重新开始」再来一局`:'点击「继续」恢复',canvas.width/2,canvas.height/2+Math.round(canvas.width/24));
    }
  }

  function tick(){
    if(!running||paused||gameOver) return;
    dir={...nextDir};
    const head=snake[0];
    let nx=head.x+dir.x, ny=head.y+dir.y;
    if(wrapMode){ nx=(nx+grid)%grid; ny=(ny+grid)%grid; }
    const newHead={x:nx,y:ny};
    // collision
    if(!wrapMode&&(nx<0||nx>=grid||ny<0||ny>=grid)){ endGame(); return; }
    if(snake.some(s=>s.x===nx&&s.y===ny)){ endGame(); return; }
    snake.unshift(newHead);
    if(nx===food.x&&ny===food.y){ score+=10; placeFood(); }
    else snake.pop();
    updateUI(); draw();
    clearInterval(timer); timer=setInterval(tick,speed);
  }

  function endGame(){ gameOver=true; running=false; clearInterval(timer); pauseBtn.textContent='暂停'; setStatus(`游戏结束 · 得分 ${score}`,true); updateUI(); draw(); }

  function togglePause(){
    if(!running||gameOver) return;
    paused=!paused;
    if(paused){ clearInterval(timer); pauseBtn.textContent='继续'; setStatus('已暂停'); }
    else { pauseBtn.textContent='暂停'; setStatus(''); timer=setInterval(tick,speed); }
    draw();
  }

  function turn(d){
    if(!running||paused||gameOver) return;
    if(d.x!==0 && dir.x===-d.x) return;
    if(d.y!==0 && dir.y===-d.y) return;
    nextDir=d;
  }

  startBtn.onclick=()=>{
    if(diffSel.value==='custom'){ grid=+sizeInp.value; speed=+speedInp.value; canvas.width=canvas.height=grid*CELL; }
    resetGame(); running=true; pauseBtn.textContent='暂停'; setStatus('');
    draw();
    clearInterval(timer); timer=setInterval(tick,speed);
  };

  pauseBtn.onclick=togglePause;

  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k===' '&&(running||paused)){ e.preventDefault(); togglePause(); return; }
    if(!running||paused||gameOver) return;
    const handled=(k==='w'||k==='arrowup'||k==='s'||k==='arrowdown'||k==='a'||k==='arrowleft'||k==='d'||k==='arrowright');
    if(handled) e.preventDefault();
    if(k==='w'||k==='arrowup') turn({x:0,y:-1});
    else if(k==='s'||k==='arrowdown') turn({x:0,y:1});
    else if(k==='a'||k==='arrowleft') turn({x:-1,y:0});
    else if(k==='d'||k==='arrowright') turn({x:1,y:0});
  });

  // 手机滑动控制
  let touchStart=null;
  canvas.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY}; },{passive:true});
  canvas.addEventListener('touchmove',e=>{ if(touchStart) e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(!touchStart) return;
    const t=e.changedTouches[0], dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    touchStart=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?{x:1,y:0}:{x:-1,y:0});
    else turn(dy>0?{x:0,y:1}:{x:0,y:-1});
    e.preventDefault();
  },{passive:false});

  loadDiff(); draw();
})();
</script>
