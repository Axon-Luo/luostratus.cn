<style>
.uc-wrap { max-width: 650px; margin: 0 auto; --uc-line: color-mix(in srgb, var(--primary) 20%, transparent); }
.uc-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 14px; }
.uc-tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--uc-line); background: var(--entry); color: var(--secondary); font-size: 0.85rem; cursor: pointer; }
.uc-tab.active { background: var(--primary); color: var(--theme); border-color: var(--primary); font-weight: 600; }
.uc-card { background: var(--entry); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.uc-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 12px; }
.uc-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.uc-field label { font-size: 0.82rem; color: var(--secondary); letter-spacing: 0.02em; }
.uc-line { display: flex; gap: 6px; min-width: 0; }
.uc-line input { flex: 1 1 90px; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid var(--uc-line); background: var(--entry); color: var(--primary); font-size: 1.15rem; text-align: center; font-variant-numeric: tabular-nums; }
.uc-line select { flex: 0 0 44%; min-width: 0; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--uc-line); background: var(--entry); color: var(--primary); font-size: 0.88rem; }
.uc-output { font-weight: 600; }
.uc-swap { display: flex; align-items: flex-end; padding-bottom: 2px; }
.uc-swap button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--uc-line); background: var(--entry); color: var(--primary); font-size: 1rem; cursor: pointer; line-height: 1; }
.uc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--uc-line); }
.uc-prec { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--secondary); }
.uc-prec input { width: 56px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--uc-line); background: var(--entry); color: var(--primary); text-align: center; }
.uc-hint { font-size: 0.8rem; color: var(--secondary); }
.uc-hint.is-error { color: color-mix(in srgb, #f59e0b 60%, var(--primary)); }
@media (max-width: 560px) {
  .uc-grid { grid-template-columns: 1fr; align-items: stretch; }
  .uc-swap { justify-content: center; }
  .uc-swap button { transform: rotate(90deg); }
}
</style>

<div class="uc-wrap">
  <div class="uc-tabs" id="ucTabs" role="tablist" aria-label="换算类别"></div>
  <div class="uc-card">
    <div class="uc-grid">
      <div class="uc-field">
        <label for="ucInput">数值</label>
        <div class="uc-line">
          <input type="number" id="ucInput" value="1" step="any" inputmode="decimal">
          <select id="ucFrom" aria-label="源单位"></select>
        </div>
      </div>
      <div class="uc-swap">
        <button type="button" id="ucSwap" title="交换单位" aria-label="交换单位">⇄</button>
      </div>
      <div class="uc-field">
        <label for="ucOutput">结果</label>
        <div class="uc-line">
          <input type="number" id="ucOutput" class="uc-output" readonly aria-label="换算结果">
          <select id="ucTo" aria-label="目标单位"></select>
        </div>
      </div>
    </div>
    <div class="uc-foot">
      <label class="uc-prec">小数位数 <input type="number" id="ucPrec" value="4" min="0" max="10" step="1" inputmode="numeric"></label>
      <span class="uc-hint" id="ucHint" aria-live="polite"></span>
    </div>
  </div>
</div>

<script>
(()=>{
  const DATA={
    speed:{name:'速度',units:{'m/s':1,'km/h':1/3.6,'mph':0.44704,'节(kn)':0.514444,'ft/s':0.3048,'马赫':340.3}},
    weight:{name:'重量',units:{'千克(kg)':1,'克(g)':0.001,'毫克(mg)':1e-6,'吨(t)':1000,'磅(lb)':0.45359237,'盎司(oz)':0.028349523125,'斤':0.5}},
    time:{name:'时间',units:{'秒(s)':1,'分钟(min)':60,'小时(h)':3600,'天(d)':86400,'周':604800,'月(30天)':2592000,'年(365天)':31536000}},
    length:{name:'长度',units:{'米(m)':1,'千米(km)':1000,'厘米(cm)':0.01,'毫米(mm)':0.001,'英里(mi)':1609.344,'英尺(ft)':0.3048,'英寸(in)':0.0254,'码(yd)':0.9144,'海里':1852}},
    area:{name:'面积',units:{'平方米(m²)':1,'平方千米(km²)':1e6,'公顷(ha)':10000,'亩':666.6666666667,'平方英尺(ft²)':0.09290304,'英亩':4046.8564224}},
    volume:{name:'体积',units:{'立方米(m³)':1,'升(L)':0.001,'毫升(mL)':1e-6,'加仑(gal)':0.003785411784,'立方英尺(ft³)':0.028316846592,'桶(石油)':0.158987294928}},
    temperature:{name:'温度',units:{'摄氏度(°C)':'c','华氏度(°F)':'f','开尔文(K)':'k'},special:true}
  };

  let current='speed';
  const tabsEl=document.getElementById('ucTabs'),fromSel=document.getElementById('ucFrom'),toSel=document.getElementById('ucTo');
  const inputEl=document.getElementById('ucInput'),outputEl=document.getElementById('ucOutput');
  const precEl=document.getElementById('ucPrec'),hintEl=document.getElementById('ucHint'),swapBtn=document.getElementById('ucSwap');

  function precision(){
    let p=parseInt(precEl.value,10);
    if(!isFinite(p)) p=4;
    return Math.max(0,Math.min(10,p));
  }

  function toCelsius(v,from){
    if(from==='c') return v;
    if(from==='f') return (v-32)*5/9;
    return v-273.15;
  }
  function fromCelsius(v,to){
    if(to==='c') return v;
    if(to==='f') return v*9/5+32;
    return v+273.15;
  }

  function convertValue(val,from,to){
    if(from===to) return val;
    const units=DATA[current].units;
    if(DATA[current].special) return fromCelsius(toCelsius(val,units[from]),units[to]);
    return val*units[from]/units[to];
  }

  function format(v,p){
    if(!isFinite(v)) return '';
    if(Math.abs(v)<0.5*Math.pow(10,-p)) v=0;
    return v.toFixed(p);
  }

  function renderTabs(){
    tabsEl.innerHTML=Object.entries(DATA).map(([k,v])=>
      `<button type="button" role="tab" class="uc-tab${k===current?' active':''}" aria-selected="${k===current}" data-key="${k}">${v.name}</button>`
    ).join('');
  }

  function populateSelects(){
    const units=Object.keys(DATA[current].units);
    fromSel.innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join('');
    toSel.innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join('');
    toSel.selectedIndex=Math.min(1,units.length-1);
  }

  function convert(){
    const p=precision();
    const raw=inputEl.value.trim();
    if(raw===''){
      outputEl.value='';
      hintEl.textContent='请输入数值';
      hintEl.classList.remove('is-error');
      return;
    }
    const val=parseFloat(raw);
    if(!isFinite(val)){
      outputEl.value='';
      hintEl.textContent='请输入有效的数字';
      hintEl.classList.add('is-error');
      return;
    }
    const from=fromSel.value,to=toSel.value;
    if(!(from in DATA[current].units)||!(to in DATA[current].units)){
      outputEl.value='';
      hintEl.textContent='单位数据异常，请切换分类重试';
      hintEl.classList.add('is-error');
      return;
    }
    const result=convertValue(val,from,to);
    outputEl.value=format(result,p);
    const one=convertValue(1,from,to);
    hintEl.textContent='1 '+from+' = '+format(one,p)+' '+to;
    hintEl.classList.remove('is-error');
  }

  tabsEl.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-key]');
    if(!btn||btn.dataset.key===current) return;
    current=btn.dataset.key;
    renderTabs();
    populateSelects();
    convert();
  });
  fromSel.onchange=convert;
  toSel.onchange=convert;
  inputEl.oninput=convert;
  precEl.oninput=convert;
  precEl.onchange=()=>{ precEl.value=precision(); convert(); };
  swapBtn.onclick=()=>{
    const a=fromSel.value;
    fromSel.value=toSel.value;
    toSel.value=a;
    convert();
  };

  renderTabs();
  populateSelects();
  convert();
})();
</script>
