<style>
.sk-wrap { max-width: 520px; margin: 0 auto; text-align: center; }
.sk-info { display: flex; justify-content: center; gap: 16px; color: var(--secondary); font-size: 0.9rem; margin-bottom: 10px; flex-wrap: wrap; }
.sk-btns button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; margin: 0 4px 8px; }
.sk-grid { display: inline-grid; gap: 2px; background: var(--entry); border: 2px solid var(--border); border-radius: 8px; padding: 8px; }
.sk-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border-radius: 4px; }
.sk-wall { background: #5d6d7e; color: transparent; }
.sk-goal { background: rgba(255,255,0,0.15); }
.sk-player { background: rgba(52,152,219,0.25); }
.sk-dpad { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.sk-dpad button { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); font-size: 1.1rem; cursor: pointer; }
</style>

<div class="sk-wrap">
  <div class="sk-info"><span>关卡 <strong id="skLevel">1</strong></span><span>步数 <strong id="skSteps">0</strong></span><span>推动 <strong id="skPushes">0</strong></span></div>
  <div class="sk-btns">
    <button id="skReset">🔄 重置</button>
    <button id="skUndo">↩️ 撤销</button>
  </div>
  <div class="sk-grid" id="skGrid"></div>
  <div class="sk-dpad">
    <button data-d="up">↑</button><button data-d="left">←</button><button data-d="down">↓</button><button data-d="right">→</button>
  </div>
  <p id="skStatus" style="color:var(--secondary);font-size:0.85rem">方向键或按钮移动</p>
</div>

<script>
(()=>{
  const LEVELS=[
    ['#####','#   #','# $ #','# . #','# @ #','#####'],
    ['######','#    #','# $$ #','# .. #','# @  #','######'],
    ['#######','#     #','# $ $ #','# . . #','#  @  #','#######']
  ];
  const gridEl=document.getElementById('skGrid');
  const statusEl=document.getElementById('skStatus');
  let level=0, grid=[], player={r:0,c:0}, steps=0, pushes=0, undo=[]; 

  function parse(){
    grid=LEVELS[level].map(row=>row.split(''));
    for(let r=0;r<grid.length;r++) for(let c=0;c<grid[r].length;c++){
      if(grid[r][c]==='@'||grid[r][c]==='+'){ player={r,c}; grid[r][c]=grid[r][c]==='+'?'.':' '; }
    }
    steps=0; pushes=0; undo=[];
    document.getElementById('skLevel').textContent=level+1;
    document.getElementById('skSteps').textContent=0;
    document.getElementById('skPushes').textContent=0;
    render();
  }

  function render(){
    const rows=grid.length, cols=Math.max(...grid.map(r=>r.length));
    gridEl.style.gridTemplateColumns='repeat('+cols+',40px)';
    gridEl.innerHTML='';
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const d=document.createElement('div');
      d.className='sk-cell';
      const ch=r===player.r&&c===player.c?'@':grid[r][c];
      if(ch==='#') d.classList.add('sk-wall');
      if(ch==='.'){ d.classList.add('sk-goal'); d.textContent='⭐'; }
      if(ch==='$'||ch==='*') d.textContent='📦';
      if(ch==='@'){ d.classList.add('sk-player'); d.textContent='🧍'; }
      if(ch==='*') d.classList.add('sk-goal');
      gridEl.appendChild(d);
    }
    const done=grid.every(row=>row.every(ch=>ch!=='$'));
    if(done){
      statusEl.textContent='关卡完成！'+(level<LEVELS.length-1?' 点击重置进入下一关':' 全部通关 🎉');
      if(level<LEVELS.length-1) document.getElementById('skReset').textContent='下一关';
    }
  }

  function move(dr,dc){
    const r=player.r+dr, c=player.c+dc;
    if(r<0||c<0||r>=grid.length||c>=grid[r].length||grid[r][c]==='#') return;
    const snap={grid:grid.map(row=>row.slice()),player:{...player},steps,pushes};
    if(grid[r][c]==='$'||grid[r][c]==='*'){
      const r2=r+dr, c2=c+dc;
      if(r2<0||c2<0||r2>=grid.length||c2>=grid[r2].length||grid[r2][c2]==='#'||grid[r2][c2]==='$'||grid[r2][c2]==='*') return;
      const onGoal=grid[r2][c2]==='.';
      grid[r2][c2]=onGoal?'*':'$';
      pushes++;
    }
    const wasGoal=grid[r][c]==='.';
    player={r,c};
    grid[r][c]=wasGoal?'.':' ';
    steps++;
    undo.push(snap);
    document.getElementById('skSteps').textContent=steps;
    document.getElementById('skPushes').textContent=pushes;
    render();
  }

  function reset(){
    if(level<LEVELS.length-1&&grid.every(row=>row.every(ch=>ch!=='$'))){
      level++;
      document.getElementById('skReset').textContent='🔄 重置';
    }
    parse();
    statusEl.textContent='方向键或按钮移动';
  }

  document.getElementById('skReset').onclick=reset;
  document.getElementById('skUndo').onclick=()=>{
    const s=undo.pop();
    if(!s) return;
    grid=s.grid; player=s.player; steps=s.steps; pushes=s.pushes;
    document.getElementById('skSteps').textContent=steps;
    document.getElementById('skPushes').textContent=pushes;
    render();
  };
  document.querySelectorAll('.sk-dpad button').forEach(b=>b.onclick=()=>{
    const d=b.dataset.d;
    if(d==='up') move(-1,0); else if(d==='down') move(1,0); else if(d==='left') move(0,-1); else move(0,1);
  });
  document.addEventListener('keydown',e=>{
    if(!document.querySelector('.sk-wrap')) return;
    if(e.key==='ArrowUp'){ e.preventDefault(); move(-1,0); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); move(1,0); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); move(0,-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); move(0,1); }
  });
  parse();
})();
</script>
