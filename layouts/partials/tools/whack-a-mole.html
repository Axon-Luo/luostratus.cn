<style>
.wm-wrap { --wm-line: color-mix(in srgb, var(--primary) 18%, transparent); max-width: 480px; margin: 0 auto; text-align: center; }
.wm-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; margin-bottom: 16px; color: var(--secondary); font-size: 0.9rem; }
.wm-bar strong { color: var(--primary); }
.wm-bar select, .wm-bar button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--wm-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.wm-bar select:hover, .wm-bar button:hover { border-color: var(--primary); }
.wm-bar button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.wm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; margin: 0 auto; }
.wm-hole { aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid var(--wm-line); background: var(--code-bg); color: var(--primary); font-size: 2.8rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.1s, border-color 0.1s, transform 0.08s; }
.wm-hole:hover { border-color: var(--primary); }
.wm-hole.active { background: var(--entry); border-color: var(--primary); transform: scale(1.04); }
.wm-status { color: var(--secondary); font-size: 0.85rem; min-height: 1.5em; margin: 14px 0 0; }
@media (max-width: 420px) { .wm-grid { gap: 8px; } .wm-hole { font-size: 2.2rem; } }
</style>

<div class="wm-wrap">
  <div class="wm-bar">
    <label>难度 <select id="wmDiff">
      <option value="900">普通</option>
      <option value="650">困难</option>
      <option value="450">地狱</option>
    </select></label>
    <span>得分 <strong id="wmScore">0</strong></span>
    <span>时间 <strong id="wmTime">30</strong></span>
    <button id="wmStart" type="button">▶ 开始</button>
  </div>
  <div class="wm-grid" id="wmGrid"></div>
  <p class="wm-status" id="wmStatus">在地鼠出现时点击它</p>
</div>

<script>
(()=>{
  const HOLES=9, TOTAL=30;
  const gridEl=document.getElementById('wmGrid');
  const statusEl=document.getElementById('wmStatus');
  const scoreEl=document.getElementById('wmScore');
  const timeEl=document.getElementById('wmTime');
  const startBtn=document.getElementById('wmStart');
  const diffEl=document.getElementById('wmDiff');
  let score=0, timeLeft=TOTAL, mole=-1, running=false, countTimer=null, spawnTimer=null, hideTimer=null;

  function render(){
    gridEl.innerHTML='';
    for(let i=0;i<HOLES;i++){
      const b=document.createElement('button');
      b.type='button';
      b.className='wm-hole'+(i===mole?' active':'');
      b.textContent=i===mole?'🐹':'';
      b.setAttribute('aria-label',i===mole?'地鼠':'空洞');
      b.onclick=()=>hit(i);
      gridEl.appendChild(b);
    }
  }

  function intervalMs(){ return Math.max(320,parseInt(diffEl.value,10)||900); }

  function clearTimers(){
    clearInterval(countTimer); countTimer=null;
    clearTimeout(spawnTimer); spawnTimer=null;
    clearTimeout(hideTimer); hideTimer=null;
  }

  function scheduleSpawn(delay){
    clearTimeout(spawnTimer);
    spawnTimer=setTimeout(spawn,delay);
  }

  function spawn(){
    if(!running) return;
    const iv=intervalMs();
    mole=Math.floor(Math.random()*HOLES);
    render();
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{
      if(!running) return;
      mole=-1;
      render();
    },Math.round(iv*0.78));
    scheduleSpawn(Math.round(iv*(0.85+Math.random()*0.4)));
  }

  function hit(i){
    if(!running||i!==mole) return;
    score++;
    scoreEl.textContent=score;
    mole=-1;
    clearTimeout(hideTimer);
    hideTimer=null;
    render();
    scheduleSpawn(Math.max(200,Math.round(intervalMs()*0.5)));
  }

  function end(){
    clearTimers();
    running=false;
    mole=-1;
    startBtn.textContent='▶ 再来一局';
    statusEl.textContent='时间到！本局得分 '+score+' 分';
    render();
  }

  function start(){
    if(running) return;
    clearTimers();
    running=true; score=0; timeLeft=TOTAL; mole=-1;
    scoreEl.textContent=0;
    timeEl.textContent=TOTAL;
    startBtn.textContent='⏸ 进行中';
    statusEl.textContent='快打地鼠！';
    render();
    spawn();
    countTimer=setInterval(()=>{
      timeLeft--;
      timeEl.textContent=Math.max(0,timeLeft);
      if(timeLeft<=0) end();
    },1000);
  }

  startBtn.addEventListener('click',start);
  diffEl.addEventListener('change',()=>{
    if(!running) statusEl.textContent='难度已切换到「'+diffEl.options[diffEl.selectedIndex].text+'」，点击开始';
  });
  render();
})();
</script>
