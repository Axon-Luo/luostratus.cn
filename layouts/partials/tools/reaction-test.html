<style>
.rt-wrap { --rt-line: color-mix(in srgb, var(--primary) 18%, transparent); max-width: 520px; margin: 0 auto; text-align: center; }
.rt-box { height: 260px; border-radius: 12px; border: 2px solid var(--rt-line); background: color-mix(in srgb, var(--primary) 8%, var(--entry)); display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--primary); font-size: 1.1rem; line-height: 1.6; cursor: pointer; user-select: none; margin-bottom: 14px; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.rt-box:hover { border-color: var(--primary); }
.rt-box:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
.rt-box.soon { background: #d97706; border-color: #d97706; color: #fff; }
.rt-box.ready { background: #16a34a; border-color: #16a34a; color: #fff; }
.rt-box.false { background: #b91c1c; border-color: #b91c1c; color: #fff; }
.rt-box.done { background: color-mix(in srgb, var(--primary) 12%, var(--entry)); border-color: var(--primary); }
.rt-info { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 18px; color: var(--secondary); font-size: 0.9rem; }
.rt-info strong { color: var(--primary); }
.rt-info button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--rt-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.rt-info button:hover { border-color: var(--primary); }
.rt-info button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (max-width: 420px) { .rt-box { height: 210px; font-size: 1rem; } }
</style>

<div class="rt-wrap">
  <div class="rt-box idle" id="rtBox" role="button" tabindex="0" aria-live="polite">点击开始，等变绿后立即点击</div>
  <div class="rt-info">
    <span>第 <strong id="rtRound">0</strong>/5 次</span>
    <span>最快 <strong id="rtBest">-</strong> ms</span>
    <button id="rtStart" type="button">▶ 开始测试</button>
  </div>
</div>

<script>
(()=>{
  const TOTAL=5;
  const box=document.getElementById('rtBox');
  const roundEl=document.getElementById('rtRound');
  const bestEl=document.getElementById('rtBest');
  const startBtn=document.getElementById('rtStart');
  let state='idle', timer=null, readyAt=0, round=0, best=null, times=[];

  function setState(s){
    state=s;
    box.className='rt-box'+(s==='idle'?'':' '+s);
  }

  function startRound(increment){
    clearTimeout(timer);
    timer=null;
    if(increment!==false) round++;
    roundEl.textContent=round;
    setState('soon');
    box.textContent='等待变绿…';
    timer=setTimeout(()=>{
      timer=null;
      readyAt=performance.now();
      setState('ready');
      box.textContent='快点击！';
    },1000+Math.random()*2500);
  }

  function start(){
    clearTimeout(timer);
    timer=null;
    round=0; best=null; times=[];
    roundEl.textContent=0;
    bestEl.textContent='-';
    startBtn.textContent='▶ 开始测试';
    startRound(true);
  }

  function finish(){
    const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
    setState('done');
    box.textContent='测试完成！最快 '+best+' ms，平均 '+avg+' ms（共 '+TOTAL+' 次）';
    startBtn.textContent='🔄 再测一次';
  }

  function onBoxClick(){
    if(state==='idle'||state==='done'){ start(); return; }
    if(state==='soon'){
      clearTimeout(timer);
      timer=null;
      setState('false');
      box.textContent='太早了！点击一下重新开始本轮';
      return;
    }
    if(state==='false'){ startRound(false); return; }
    if(state==='ready'){
      const ms=Math.round(performance.now()-readyAt);
      times.push(ms);
      if(best===null||ms<best) best=ms;
      bestEl.textContent=best;
      if(round>=TOTAL) finish();
      else startRound(true);
    }
  }

  box.addEventListener('click',onBoxClick);
  box.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); onBoxClick(); }
  });
  startBtn.addEventListener('click',start);
})();
</script>
