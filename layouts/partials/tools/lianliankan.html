<style>
.llk-wrap { --llk-line: color-mix(in srgb, var(--primary) 18%, transparent); max-width: 520px; margin: 0 auto; text-align: center; }
.llk-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; margin-bottom: 14px; color: var(--secondary); font-size: 0.9rem; }
.llk-bar strong { color: var(--primary); }
.llk-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--llk-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.llk-bar button:hover { border-color: var(--primary); }
.llk-bar button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.llk-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-width: 420px; margin: 0 auto; }
.llk-cell { aspect-ratio: 1; padding: 0; font-size: 1.7rem; line-height: 1; border-radius: 8px; border: 1px solid var(--llk-line); background: var(--entry); color: var(--primary); cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }
.llk-cell:hover:not(.empty) { border-color: var(--primary); }
.llk-cell.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.llk-cell.hint { border-color: #f39c12; box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.45); }
.llk-cell.empty { background: transparent; border-color: transparent; cursor: default; }
.llk-status { color: var(--secondary); font-size: 0.85rem; min-height: 1.5em; margin: 12px 0 0; }
@media (max-width: 420px) { .llk-cell { font-size: 1.3rem; border-radius: 6px; } .llk-grid { gap: 4px; } }
</style>

<div class="llk-wrap">
  <div class="llk-bar">
    <span>得分 <strong id="llkScore">0</strong></span>
    <span>剩余 <strong id="llkLeft">18</strong></span>
    <button id="llkHint" type="button">💡 提示</button>
    <button id="llkNew" type="button">🔄 重新开始</button>
  </div>
  <div class="llk-grid" id="llkGrid"></div>
  <p class="llk-status" id="llkStatus">选择两个相同图案，路径最多拐两次弯</p>
</div>

<script>
(()=>{
  const ROWS=6, COLS=6;
  const EMOJIS=['🍎','🍇','🍊','🍋','🍉','🍓','🍒','🍑','🥝','🍍','🥥','🥑','🌽','🥕','🍄','🫐','🥦','🍆'];
  const gridEl=document.getElementById('llkGrid');
  const statusEl=document.getElementById('llkStatus');
  const scoreEl=document.getElementById('llkScore');
  const leftEl=document.getElementById('llkLeft');
  let board=[], selected=null, score=0, left=18, hintTimer=null;

  function render(){
    gridEl.innerHTML='';
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const b=document.createElement('button');
      b.type='button';
      b.className='llk-cell'+(board[r][c]===''?' empty':'');
      b.textContent=board[r][c];
      if(board[r][c]==='') b.disabled=true;
      if(selected&&selected.r===r&&selected.c===c) b.classList.add('selected');
      b.onclick=()=>clickCell(r,c);
      gridEl.appendChild(b);
    }
  }

  function clearH(x1,x2,y,grid){
    for(let x=Math.min(x1,x2)+1;x<Math.max(x1,x2);x++) if(grid[y][x]!=='') return false;
    return true;
  }
  function clearV(y1,y2,x,grid){
    for(let y=Math.min(y1,y2)+1;y<Math.max(y1,y2);y++) if(grid[y][x]!=='') return false;
    return true;
  }

  // 允许路径走出棋盘外圈（经典连连看规则），大幅降低开局/中途死局
  function canConnect(a,b){
    if(a.r===b.r&&a.c===b.c) return false;
    const grid=[];
    grid.push(Array(COLS+2).fill(''));
    for(let r=0;r<ROWS;r++) grid.push(['',...board[r],'']);
    grid.push(Array(COLS+2).fill(''));
    const x1=a.c+1,y1=a.r+1,x2=b.c+1,y2=b.r+1;
    if(x1===x2) return clearV(y1,y2,x1,grid);
    if(y1===y2) return clearH(x1,x2,y1,grid);
    if(grid[y1][x2]===''&&clearH(x1,x2,y1,grid)&&clearV(y1,y2,x2,grid)) return true;
    if(grid[y2][x1]===''&&clearV(y1,y2,x1,grid)&&clearH(x1,x2,y2,grid)) return true;
    for(let x=0;x<=COLS+1;x++){
      if(x===x1||x===x2) continue;
      if(grid[y1][x]===''&&grid[y2][x]===''&&clearH(x1,x,y1,grid)&&clearV(y1,y2,x,grid)&&clearH(x,x2,y2,grid)) return true;
    }
    for(let y=0;y<=ROWS+1;y++){
      if(y===y1||y===y2) continue;
      if(grid[y][x1]===''&&grid[y][x2]===''&&clearV(y1,y,x1,grid)&&clearH(x1,x2,y,grid)&&clearV(y,y2,x2,grid)) return true;
    }
    return false;
  }

  function tiles(){
    const out=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c]!=='') out.push({r,c,v:board[r][c]});
    return out;
  }

  function findMove(){
    const ts=tiles();
    for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++){
      if(ts[i].v!==ts[j].v) continue;
      if(canConnect(ts[i],ts[j])) return [ts[i],ts[j]];
    }
    return null;
  }

  function shuffleRemaining(msg){
    const slots=[], vals=[];
    tiles().forEach(t=>{ slots.push({r:t.r,c:t.c}); vals.push(t.v); });
    if(vals.length>1){
      let guard=0;
      do{
        for(let i=vals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }
        slots.forEach((s,idx)=>{ board[s.r][s.c]=vals[idx]; });
        guard++;
      } while(!findMove()&&guard<80);
    }
    selected=null;
    render();
    if(msg) statusEl.textContent=msg;
  }

  function clearHint(){
    clearTimeout(hintTimer);
    Array.prototype.forEach.call(gridEl.querySelectorAll('.llk-cell.hint'),el=>el.classList.remove('hint'));
  }

  function showHint(){
    if(left===0) return;
    const pair=findMove();
    if(!pair){ shuffleRemaining('没有可连接的配对了，已自动重排'); return; }
    clearHint();
    const cellsEl=gridEl.children;
    [pair[0],pair[1]].forEach(p=>{ const el=cellsEl[p.r*COLS+p.c]; if(el) el.classList.add('hint'); });
    statusEl.textContent='提示：高亮的两个图案可以连接';
    hintTimer=setTimeout(()=>{
      Array.prototype.forEach.call(gridEl.querySelectorAll('.llk-cell.hint'),el=>el.classList.remove('hint'));
    },1400);
  }

  function init(){
    let guard=0;
    do{
      const pairs=[...EMOJIS,...EMOJIS];
      for(let i=pairs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pairs[i],pairs[j]]=[pairs[j],pairs[i]]; }
      board=[]; for(let r=0;r<ROWS;r++) board.push(pairs.slice(r*COLS,(r+1)*COLS));
      guard++;
    } while(guard<40&&!findMove());
    selected=null; score=0; left=18;
    scoreEl.textContent=0;
    leftEl.textContent=18;
    statusEl.textContent='选择两个相同图案，路径最多拐两次弯';
    render();
  }

  function clickCell(r,c){
    if(board[r][c]==='') return;
    clearHint();
    if(!selected){ selected={r,c}; statusEl.textContent='已选中 '+board[r][c]+'，再点一个相同的图案'; render(); return; }
    if(selected.r===r&&selected.c===c){ selected=null; statusEl.textContent='已取消选择'; render(); return; }
    if(board[selected.r][selected.c]===board[r][c]&&canConnect(selected,{r,c})){
      board[selected.r][selected.c]=''; board[r][c]='';
      score+=10; left--;
      scoreEl.textContent=score;
      leftEl.textContent=left;
      selected=null;
      render();
      if(left===0){
        statusEl.textContent='全部消除 🎉 最终得分 '+score;
      } else if(!findMove()){
        shuffleRemaining('没有可连接的配对了，已自动重排');
      } else {
        statusEl.textContent='消除成功 +10 分';
      }
    } else {
      statusEl.textContent=board[selected.r][selected.c]===board[r][c]
        ? '这两个图案连不上，换一对试试'
        : '图案不同，已切换选中';
      selected={r,c};
      render();
    }
  }

  document.getElementById('llkNew').addEventListener('click',init);
  document.getElementById('llkHint').addEventListener('click',showHint);
  init();
})();
</script>
