<style>
.ttt-wrap { max-width: 440px; margin: 0 auto; text-align: center; --ttt-line: color-mix(in srgb, var(--primary) 18%, transparent); }
.ttt-bar { display: flex; gap: 12px; justify-content: center; align-items: center; margin-bottom: 14px; flex-wrap: wrap; font-size: 0.9rem; color: var(--secondary); }
.ttt-wrap .ttt-bar select, .ttt-wrap .ttt-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ttt-line); background: color-mix(in srgb, var(--primary) 7%, var(--entry)); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.ttt-wrap .ttt-bar button:hover { background: color-mix(in srgb, var(--primary) 13%, var(--entry)); border-color: color-mix(in srgb, var(--primary) 34%, transparent); }
.ttt-card { background: var(--entry); border: 1px solid var(--ttt-line); border-radius: 12px; padding: 18px; max-width: 420px; margin: 0 auto; }
.ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
.ttt-wrap .ttt-board .ttt-cell { aspect-ratio: 1; font-size: 2.4rem; font-weight: 700; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--primary) 22%, transparent); background: color-mix(in srgb, var(--primary) 4%, var(--entry)); color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
.ttt-wrap .ttt-board .ttt-cell:hover:not(.disabled) { border-color: color-mix(in srgb, var(--primary) 45%, transparent); background: color-mix(in srgb, var(--primary) 10%, var(--entry)); }
.ttt-wrap .ttt-board .ttt-cell.x { color: #3b82f6; }
.ttt-wrap .ttt-board .ttt-cell.o { color: #e11d48; }
.ttt-wrap .ttt-board .ttt-cell.disabled { cursor: default; }
.ttt-wrap .ttt-board .ttt-cell.win { border-color: #22c55e; background: color-mix(in srgb, #22c55e 18%, var(--entry)); }
.ttt-status { margin: 12px 0 0; color: var(--secondary); font-size: 0.9rem; min-height: 22px; }
.ttt-status.win { color: #22c55e; font-weight: 600; }
.ttt-status.lose { color: #ef4444; font-weight: 600; }
.ttt-score { display: flex; justify-content: center; gap: 24px; margin-top: 12px; color: var(--secondary); font-size: 0.9rem; }
.ttt-score strong { color: var(--primary); }
</style>

<div class="ttt-wrap">
  <div class="ttt-bar">
    <label>难度 <select id="tttDiff"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></label>
    <button id="tttNew">🔄 重新开始</button>
  </div>
  <div class="ttt-card">
    <div class="ttt-board" id="tttBoard"></div>
    <p class="ttt-status" id="tttStatus">你先手（X）</p>
    <div class="ttt-score"><span>你 <strong id="tttYou">0</strong></span><span>电脑 <strong id="tttAi">0</strong></span><span>平局 <strong id="tttDraw">0</strong></span></div>
  </div>
</div>

<script>
(()=>{
  const boardEl=document.getElementById('tttBoard');
  const status=document.getElementById('tttStatus');
  let board=Array(9).fill(''), over=false, busy=false, winLine=null;
  const scores={you:0,ai:0,draw:0};

  function winningLine(b){
    const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const line of lines){
      const [a,c,d]=line;
      if(b[a]&&b[a]===b[c]&&b[a]===b[d]) return line;
    }
    return null;
  }

  function render(){
    boardEl.innerHTML='';
    for(let i=0;i<9;i++){
      const b=document.createElement('button');
      b.className='ttt-cell'+(board[i]?' '+board[i].toLowerCase():'');
      if(over||board[i]||busy) b.classList.add('disabled');
      if(winLine&&winLine.includes(i)) b.classList.add('win');
      b.textContent=board[i];
      b.onclick=()=>humanMove(i);
      boardEl.appendChild(b);
    }
  }

  function setStatus(msg,cls){
    status.textContent=msg;
    status.className='ttt-status'+(cls?' '+cls:'');
  }

  function winner(b){
    const line=winningLine(b);
    if(line) return b[line[0]];
    return b.every(v=>v)?'draw':'';
  }

  function minimax(b,isMax){
    const w=winner(b);
    if(w==='O') return 10;
    if(w==='X') return -10;
    if(w==='draw') return 0;
    const moves=[];
    for(let i=0;i<9;i++) if(!b[i]){
      b[i]=isMax?'O':'X';
      moves.push(minimax(b,!isMax));
      b[i]='';
    }
    return isMax?Math.max(...moves):Math.min(...moves);
  }

  function aiMove(){
    const diff=document.getElementById('tttDiff').value;
    const empty=board.map((v,i)=>v?'':i).filter(v=>v!=='');
    if(!empty.length) return;
    if(diff==='easy'||(diff==='medium'&&Math.random()<0.5)){
      return empty[Math.floor(Math.random()*empty.length)];
    }
    let best=-Infinity, pick=empty[0];
    for(const i of empty){
      board[i]='O';
      const v=minimax(board,false);
      board[i]='';
      if(v>best){ best=v; pick=i; }
    }
    return pick;
  }

  function checkEnd(){
    const line=winningLine(board);
    const w=winner(board);
    if(w==='X'){ scores.you++; winLine=line; setStatus('你赢了 🎉','win'); over=true; }
    else if(w==='O'){ scores.ai++; winLine=line; setStatus('电脑获胜','lose'); over=true; }
    else if(w==='draw'){ scores.draw++; setStatus('平局'); over=true; }
    document.getElementById('tttYou').textContent=scores.you;
    document.getElementById('tttAi').textContent=scores.ai;
    document.getElementById('tttDraw').textContent=scores.draw;
    if(over) busy=false;
    render();
  }

  function humanMove(i){
    if(over||busy||board[i]) return;
    board[i]='X';
    render();
    checkEnd();
    if(over) return;
    /* 锁住棋盘，避免电脑落子前连点导致连下两手 */
    busy=true;
    setStatus('电脑思考中…');
    render();
    setTimeout(()=>{
      const m=aiMove();
      busy=false;
      if(m!==undefined&&!over){ board[m]='O'; checkEnd(); if(!over){ setStatus('轮到你落子（X）'); render(); } }
      else render();
    },160);
  }

  document.getElementById('tttNew').onclick=()=>{
    board=Array(9).fill(''); over=false; busy=false; winLine=null;
    setStatus('你先手（X）');
    render();
  };
  document.getElementById('tttDiff').onchange=()=>{
    board=Array(9).fill(''); over=false; busy=false; winLine=null;
    setStatus('你先手（X）');
    render();
  };
  render();
})();
</script>
