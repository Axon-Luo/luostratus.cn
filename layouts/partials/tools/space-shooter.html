<style>
.ss-wrap { max-width: 640px; margin: 0 auto; text-align: center; }
.ss-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; color: var(--secondary); font-size: 0.9rem; }
.ss-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; }
#ssCanvas { border: 2px solid var(--border); border-radius: 8px; background: #0b1320; max-width: 100%; }
.ss-tip { color: var(--secondary); font-size: 0.8rem; margin-top: 8px; }
</style>

<div class="ss-wrap">
  <div class="ss-bar"><span>得分 <strong id="ssScore">0</strong></span><span>生命 <strong id="ssLives">3</strong></span><button id="ssStart">▶ 开始</button></div>
  <canvas id="ssCanvas" width="640" height="520"></canvas>
  <p class="ss-tip">← → 移动 · 空格射击</p>
</div>

<script>
(()=>{
  const canvas=document.getElementById('ssCanvas');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('ssScore');
  const livesEl=document.getElementById('ssLives');
  const keys={};
  let player, bullets, enemies, score, lives, running, lastShot=0, spawnTimer=0, raf=null, over=false;

  function reset(){
    player={x:290,y:460,w:60,h:40};
    bullets=[]; enemies=[];
    score=0; lives=3; running=false; over=false; spawnTimer=0;
    scoreEl.textContent=0; livesEl.textContent=3;
    document.getElementById('ssStart').textContent='▶ 开始';
  }

  function spawn(){
    enemies.push({x:30+Math.random()*540,y:-36,w:40,h:36,speed:1+Math.random()*1.6});
  }

  function update(now){
    if(!running||over) return;
    if(keys['ArrowLeft']) player.x=Math.max(0,player.x-6);
    if(keys['ArrowRight']) player.x=Math.min(canvas.width-player.w,player.x+6);
    if(keys[' ']&&now-lastShot>260){ lastShot=now; bullets.push({x:player.x+player.w/2-2,y:player.y-10,w:4,h:12}); }
    spawnTimer+=16;
    if(spawnTimer>900){ spawnTimer=0; spawn(); }
    bullets=bullets.filter(b=>b.y>-20);
    bullets.forEach(b=>b.y-=8);
    enemies.forEach(e=>e.y+=e.speed);
    enemies=enemies.filter(e=>e.y<canvas.height+40);
    bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(!e.dead&&b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){ e.dead=true; b.dead=true; score+=100; scoreEl.textContent=score; }
      });
    });
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);
    enemies.forEach(e=>{
      if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y){
        e.dead=true; lives--; livesEl.textContent=lives;
        if(lives<=0){ over=true; running=false; document.getElementById('ssStart').textContent='▶ 再来一局'; }
      }
    });
    enemies=enemies.filter(e=>!e.dead);
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    for(let i=0;i<12;i++){ ctx.beginPath(); ctx.moveTo((i*60)%640,0); ctx.lineTo((i*60+120)%640,520); ctx.stroke(); }
    bullets.forEach(b=>{ ctx.fillStyle='#f1c40f'; ctx.fillRect(b.x,b.y,b.w,b.h); });
    enemies.forEach(e=>{
      ctx.fillStyle='#e74c3c';
      ctx.beginPath(); ctx.moveTo(e.x+e.w/2,e.y); ctx.lineTo(e.x,e.y+e.h); ctx.lineTo(e.x+e.w,e.y+e.h); ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle='#3498db';
    ctx.beginPath(); ctx.moveTo(player.x+player.w/2,player.y); ctx.lineTo(player.x,player.y+player.h); ctx.lineTo(player.x+player.w,player.y+player.h); ctx.closePath(); ctx.fill();
    if(over){
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
      ctx.fillText('游戏结束 · 得分 '+score,canvas.width/2,canvas.height/2);
    }
  }

  function loop(now){
    update(now); draw();
    if(running||over) raf=requestAnimationFrame(loop);
  }

  document.getElementById('ssStart').onclick=()=>{
    reset(); running=true;
    if(raf) cancelAnimationFrame(raf);
    loop(performance.now());
  };
  document.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' ') e.preventDefault(); });
  document.addEventListener('keyup',e=>{ keys[e.key]=false; });
  reset();
})();
</script>
