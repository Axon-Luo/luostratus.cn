<style>
.ss-wrap { max-width: 640px; margin: 0 auto; text-align: center; --ss-line: color-mix(in srgb, var(--primary) 20%, transparent); }
.ss-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 14px; margin-bottom: 12px; color: var(--secondary); font-size: 0.9rem; }
.ss-stat { background: var(--entry); border: 1px solid var(--ss-line); border-radius: 999px; padding: 5px 14px; }
.ss-stat strong { color: var(--primary); font-variant-numeric: tabular-nums; }
.ss-actions { display: flex; gap: 8px; }
.ss-wrap button { padding: 7px 15px; border-radius: 8px; border: 1px solid var(--ss-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.88rem; }
.ss-wrap button.primary { background: var(--primary); color: var(--theme); border-color: var(--primary); font-weight: 600; }
.ss-wrap button:disabled { opacity: 0.45; cursor: not-allowed; }
#ssCanvas { display: block; box-sizing: border-box; margin: 0 auto; width: 100%; max-width: 640px; height: auto; border: 2px solid var(--ss-line); border-radius: 10px; background: #0b1320; touch-action: none; }
.ss-pad { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
.ss-pad button { min-width: 62px; padding: 10px 16px; font-size: 1rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.ss-pad button[data-ss-fire] { min-width: 96px; }
.ss-tip { color: var(--secondary); font-size: 0.8rem; margin-top: 10px; line-height: 1.6; }
</style>

<div class="ss-wrap">
  <div class="ss-bar">
    <span class="ss-stat">得分 <strong id="ssScore">0</strong></span>
    <span class="ss-stat">生命 <strong id="ssLives">3</strong></span>
    <span class="ss-actions">
      <button type="button" id="ssStart" class="primary">▶ 开始</button>
      <button type="button" id="ssPause" disabled>⏸ 暂停</button>
    </span>
  </div>
  <canvas id="ssCanvas" width="640" height="520" aria-label="太空射击游戏画面"></canvas>
  <div class="ss-pad" role="group" aria-label="触屏操作">
    <button type="button" data-ss-move="left" aria-label="向左移动">◀</button>
    <button type="button" data-ss-move="right" aria-label="向右移动">▶</button>
    <button type="button" data-ss-fire aria-label="发射">🔥 发射</button>
  </div>
  <p class="ss-tip">← → 移动 · 空格射击 · 也可用下方按钮操作（P 键暂停）</p>
</div>

<script>
(()=>{
  const canvas=document.getElementById('ssCanvas');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('ssScore');
  const livesEl=document.getElementById('ssLives');
  const startBtn=document.getElementById('ssStart');
  const pauseBtn=document.getElementById('ssPause');
  const W=canvas.width, H=canvas.height;
  const keys={};
  let player, bullets, enemies, score, lives, running, paused, over, lastShot=0, spawnTimer=0, raf=null, lastTs=0;

  function reset(){
    player={x:290,y:460,w:60,h:40};
    bullets=[]; enemies=[];
    score=0; lives=3; running=false; paused=false; over=false; spawnTimer=0; lastShot=0;
    scoreEl.textContent=0; livesEl.textContent=3;
    startBtn.textContent='▶ 开始';
    pauseBtn.textContent='⏸ 暂停'; pauseBtn.disabled=true;
  }

  function spawn(){
    enemies.push({x:30+Math.random()*540,y:-36,w:40,h:36,speed:1+Math.random()*1.6});
  }

  function update(now,dt){
    const k=Math.min(dt,48)/16.667;
    if(keys['ArrowLeft']) player.x=Math.max(0,player.x-6*k);
    if(keys['ArrowRight']) player.x=Math.min(W-player.w,player.x+6*k);
    if((keys[' ']||keys.fire)&&now-lastShot>260){ lastShot=now; bullets.push({x:player.x+player.w/2-2,y:player.y-10,w:4,h:12}); }

    spawnTimer+=dt;
    if(spawnTimer>900){ spawnTimer=0; spawn(); }

    bullets=bullets.filter(b=>b.y>-20);
    bullets.forEach(b=>b.y-=8*k);
    enemies.forEach(e=>e.y+=e.speed*k);
    enemies=enemies.filter(e=>e.y<H+40);

    bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(!e.dead&&!b.dead&&b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){ e.dead=true; b.dead=true; score+=100; scoreEl.textContent=score; }
      });
    });
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);

    enemies.forEach(e=>{
      if(e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y){
        e.dead=true; lives--; livesEl.textContent=Math.max(lives,0);
        if(lives<=0) endGame();
      }
    });
    enemies=enemies.filter(e=>!e.dead);
  }

  function endGame(){
    over=true; running=false; paused=false;
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    startBtn.textContent='↺ 再来一局';
    pauseBtn.disabled=true;
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    if(!player) return;
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    for(let i=0;i<12;i++){ ctx.beginPath(); ctx.moveTo((i*60)%W,0); ctx.lineTo((i*60+120)%W,H); ctx.stroke(); }
    bullets.forEach(b=>{ ctx.fillStyle='#f1c40f'; ctx.fillRect(b.x,b.y,b.w,b.h); });
    enemies.forEach(e=>{
      ctx.fillStyle='#e74c3c';
      ctx.beginPath(); ctx.moveTo(e.x+e.w/2,e.y); ctx.lineTo(e.x,e.y+e.h); ctx.lineTo(e.x+e.w,e.y+e.h); ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle='#3498db';
    ctx.beginPath(); ctx.moveTo(player.x+player.w/2,player.y); ctx.lineTo(player.x,player.y+player.h); ctx.lineTo(player.x+player.w,player.y+player.h); ctx.closePath(); ctx.fill();
    if(over){
      ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
      ctx.fillText('游戏结束 · 得分 '+score,W/2,H/2);
      ctx.font='15px sans-serif'; ctx.fillStyle='#d5d8dc';
      ctx.fillText('点击「再来一局」重新开始',W/2,H/2+32);
    }else if(paused){
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
      ctx.fillText('已暂停',W/2,H/2);
    }else if(!running){
      ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
      ctx.fillText('太空射击',W/2,H/2-14);
      ctx.font='15px sans-serif'; ctx.fillStyle='#d5d8dc';
      ctx.fillText('点击「开始」进入游戏',W/2,H/2+22);
    }
  }

  function loop(ts){
    const dt=lastTs?ts-lastTs:16.7;
    lastTs=ts;
    if(running&&!paused) update(ts,dt);
    draw();
    if(running&&!paused) raf=requestAnimationFrame(loop);
    else { raf=null; lastTs=0; }
  }

  function start(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    reset();
    running=true;
    pauseBtn.disabled=false;
    lastTs=0;
    raf=requestAnimationFrame(loop);
  }

  function togglePause(){
    if(!running) return;
    paused=!paused;
    pauseBtn.textContent=paused?'▶ 继续':'⏸ 暂停';
    if(paused){
      if(raf){ cancelAnimationFrame(raf); raf=null; }
      lastTs=0;
      draw();
    }else{
      lastTs=0;
      raf=requestAnimationFrame(loop);
    }
  }

  startBtn.onclick=start;
  pauseBtn.onclick=togglePause;

  document.addEventListener('keydown',e=>{
    const k=e.key;
    keys[k]=true;
    if(k===' '||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
      if(running&&!paused) e.preventDefault();
    }
    if((k==='p'||k==='P')&&!e.repeat) togglePause();
  });
  document.addEventListener('keyup',e=>{ keys[e.key]=false; });
  window.addEventListener('blur',()=>{ keys[' ']=false; keys.fire=false; keys.ArrowLeft=false; keys.ArrowRight=false; });

  function hold(btn,on,off){
    if(!btn) return;
    btn.addEventListener('pointerdown',e=>{ e.preventDefault(); if(btn.setPointerCapture&&e.pointerId!==undefined){ try{ btn.setPointerCapture(e.pointerId); }catch(err){} } on(); });
    btn.addEventListener('pointerup',e=>{ e.preventDefault(); off(); });
    btn.addEventListener('pointercancel',off);
    btn.addEventListener('pointerleave',off);
    btn.addEventListener('contextmenu',e=>e.preventDefault());
  }
  hold(document.querySelector('[data-ss-move="left"]'),()=>keys.ArrowLeft=true,()=>keys.ArrowLeft=false);
  hold(document.querySelector('[data-ss-move="right"]'),()=>keys.ArrowRight=true,()=>keys.ArrowRight=false);
  hold(document.querySelector('[data-ss-fire]'),()=>keys.fire=true,()=>keys.fire=false);

  reset();
  draw();
})();
</script>
