<style>
.tp-wrap { --tp-line: color-mix(in srgb, var(--primary) 18%, transparent); max-width: 680px; margin: 0 auto; }
.tp-sample { background: var(--code-bg); border: 1px solid var(--tp-line); border-radius: 10px; padding: 16px; line-height: 2; font-size: 1.02rem; margin-bottom: 12px; color: var(--secondary); }
.tp-sample .done { color: var(--primary); }
.tp-sample .error { color: #e74c3c; text-decoration: underline; text-underline-offset: 2px; }
.tp-sample .cur { color: var(--primary); background: color-mix(in srgb, var(--primary) 20%, transparent); border-radius: 3px; }
.tp-input { box-sizing: border-box; width: 100%; min-height: 120px; padding: 12px; border-radius: 10px; border: 1px solid var(--tp-line); background: var(--entry); color: var(--primary); font-size: 1rem; line-height: 1.7; resize: vertical; }
.tp-input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.tp-input:read-only { opacity: 0.85; }
.tp-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 18px; margin-top: 12px; color: var(--secondary); font-size: 0.9rem; }
.tp-bar strong { color: var(--primary); }
.tp-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--tp-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.tp-bar button:hover { border-color: var(--primary); }
.tp-bar button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>

<div class="tp-wrap">
  <div class="tp-sample" id="tpSample"></div>
  <textarea class="tp-input" id="tpInput" placeholder="在这里开始打字…" spellcheck="false" aria-label="打字输入区"></textarea>
  <div class="tp-bar">
    <span>用时 <strong id="tpTime">0</strong>s</span>
    <span>速度 <strong id="tpSpeed">0</strong> 字/分</span>
    <span>正确率 <strong id="tpAcc">100</strong>%</span>
    <span>进度 <strong id="tpProg">0/0</strong></span>
    <button id="tpRestart" type="button">🔄 重新开始</button>
  </div>
</div>

<script>
(()=>{
  const SAMPLE='欢迎来到洛云的博客，这里记录代码、游戏与生活。保持好奇，持续学习，认真生活，慢慢成长。';
  const sampleEl=document.getElementById('tpSample');
  const input=document.getElementById('tpInput');
  const timeEl=document.getElementById('tpTime');
  const speedEl=document.getElementById('tpSpeed');
  const accEl=document.getElementById('tpAcc');
  const progEl=document.getElementById('tpProg');
  let startTime=null, finished=false;

  progEl.textContent='0/'+SAMPLE.length;

  function render(){
    const typed=input.value;
    const typedLen=Math.min(typed.length,SAMPLE.length);
    let html='';
    for(let i=0;i<SAMPLE.length;i++){
      const ch=SAMPLE[i];
      if(i<typed.length){
        html+=typed[i]===ch?'<span class="done">'+ch+'</span>':'<span class="error">'+ch+'</span>';
      } else if(i===typed.length&&!finished){
        html+='<span class="cur">'+ch+'</span>';
      } else {
        html+=ch;
      }
    }
    sampleEl.innerHTML=html;
    if(startTime===null||finished) return;
    const sec=Math.max(0.05,(Date.now()-startTime)/1000);
    let correct=0;
    for(let i=0;i<typedLen;i++) if(typed[i]===SAMPLE[i]) correct++;
    timeEl.textContent=sec.toFixed(1);
    speedEl.textContent=Math.round(correct/sec*60);
    accEl.textContent=typedLen?Math.round(correct/typedLen*100):100;
    progEl.textContent=typedLen+'/'+SAMPLE.length;
    if(typedLen>=SAMPLE.length){
      finished=true;
      input.readOnly=true;
      sampleEl.innerHTML=html;
    }
  }

  input.addEventListener('input',()=>{
    if(finished) return;
    if(startTime===null&&input.value){ startTime=Date.now(); }
    render();
  });

  document.getElementById('tpRestart').addEventListener('click',()=>{
    input.value='';
    input.readOnly=false;
    startTime=null; finished=false;
    timeEl.textContent=0; speedEl.textContent=0; accEl.textContent=100;
    progEl.textContent='0/'+SAMPLE.length;
    render();
    input.focus();
  });

  render();
})();
</script>
