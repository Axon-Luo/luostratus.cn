<style>
.pg-wrap { max-width: 520px; margin: 0 auto; }
.pg-card { background: var(--entry); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
.pg-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; font-size: 0.9rem; color: var(--secondary); }
.pg-row input[type="range"] { flex: 1; min-width: 160px; }
.pg-out { background: var(--code-bg); border-radius: 8px; padding: 14px; font-family: monospace; font-size: 1.05rem; word-break: break-all; color: var(--primary); margin-bottom: 10px; }
.pg-btns { display: flex; gap: 8px; }
.pg-btns button { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; font-weight: 600; }
.pg-btns .main { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.pg-meter { height: 8px; border-radius: 4px; background: var(--code-bg); margin-top: 12px; overflow: hidden; }
.pg-meter i { display: block; height: 100%; width: 0; background: #e74c3c; transition: width 0.2s, background 0.2s; }
</style>

<div class="pg-wrap">
  <div class="pg-card">
    <div class="pg-row"><span id="pgLenLabel">长度：16</span><input type="range" id="pgLen" min="4" max="64" value="16"></div>
    <div class="pg-row">
      <label><input type="checkbox" id="pgUpper" checked> 大写</label>
      <label><input type="checkbox" id="pgLower" checked> 小写</label>
      <label><input type="checkbox" id="pgDigit" checked> 数字</label>
      <label><input type="checkbox" id="pgSym" checked> 符号</label>
      <label><input type="checkbox" id="pgAmb"> 排除易混淆</label>
    </div>
    <div class="pg-out" id="pgOut">点击生成</div>
    <div class="pg-btns">
      <button class="main" id="pgGen">🎲 生成</button>
      <button id="pgCopy">📋 复制</button>
    </div>
    <div class="pg-meter"><i id="pgMeter"></i></div>
  </div>
</div>

<script>
(()=>{
  const upper='ABCDEFGHJKLMNPQRSTUVWXYZ', lower='abcdefghijkmnpqrstuvwxyz', digit='23456789', sym='!@#$%^&*()-_=+[]{};:,.?';
  const fullUpper='ABCDEFGHIJKLMNOPQRSTUVWXYZ', fullLower='abcdefghijklmnopqrstuvwxyz', fullDigit='0123456789';
  const out=document.getElementById('pgOut');
  const meter=document.getElementById('pgMeter');
  const lenEl=document.getElementById('pgLen');

  lenEl.oninput=()=>document.getElementById('pgLenLabel').textContent='长度：'+lenEl.value;

  function generate(){
    const len=+lenEl.value;
    const amb=document.getElementById('pgAmb').checked;
    let pool='';
    if(document.getElementById('pgUpper').checked) pool+=(amb?upper:fullUpper);
    if(document.getElementById('pgLower').checked) pool+=(amb?lower:fullLower);
    if(document.getElementById('pgDigit').checked) pool+=(amb?digit:fullDigit);
    if(document.getElementById('pgSym').checked) pool+=sym;
    if(!pool){ out.textContent='至少选择一种字符类型'; meter.style.width='0'; return; }
    const buf=new Uint32Array(len);
    crypto.getRandomValues(buf);
    let pwd='';
    for(let i=0;i<len;i++) pwd+=pool[buf[i]%pool.length];
    out.textContent=pwd;
    updateMeter(len,pool);
  }

  function updateMeter(len,pool){
    const types=[document.getElementById('pgUpper').checked,document.getElementById('pgLower').checked,document.getElementById('pgDigit').checked,document.getElementById('pgSym').checked].filter(Boolean).length;
    let score=0;
    if(len>=8) score++;
    if(len>=12) score++;
    if(types>=3) score++;
    if(len>=16&&types===4) score++;
    meter.style.width=(score/4*100)+'%';
    meter.style.background=score>=3?'#27ae60':score===2?'#f39c12':'#e74c3c';
  }

  document.getElementById('pgGen').onclick=generate;
  document.getElementById('pgCopy').onclick=()=>navigator.clipboard.writeText(out.textContent);
  generate();
})();
</script>
