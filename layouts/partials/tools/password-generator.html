<style>
.pg-wrap { max-width: 520px; margin: 0 auto; --pg-line: color-mix(in srgb, var(--primary) 20%, transparent); }
.pg-card { background: var(--entry); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
.pg-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; font-size: 0.88rem; color: var(--secondary); }
.pg-len { gap: 10px; }
.pg-len span { min-width: 76px; font-variant-numeric: tabular-nums; }
.pg-len input[type="range"] { flex: 1; min-width: 140px; accent-color: var(--primary); }
.pg-types { gap: 8px 18px; }
.pg-types label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.pg-types input { accent-color: var(--primary); }
.pg-out { background: var(--code-bg); border: 1px solid var(--pg-line); border-radius: 8px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 1.05rem; line-height: 1.6; word-break: break-all; color: var(--primary); margin-bottom: 10px; min-height: 54px; }
.pg-out.is-empty { color: var(--secondary); font-size: 0.9rem; }
.pg-btns { display: flex; gap: 8px; }
.pg-btns button { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--pg-line); background: var(--entry); color: var(--primary); cursor: pointer; font-weight: 600; font-size: 0.92rem; }
.pg-btns button.pg-primary { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.pg-meter { height: 8px; border-radius: 4px; background: var(--code-bg); margin-top: 12px; overflow: hidden; border: 1px solid var(--pg-line); }
.pg-meter i { display: block; height: 100%; width: 0; background: #e74c3c; transition: width 0.2s, background 0.2s; }
.pg-strength { margin-top: 8px; font-size: 0.78rem; color: var(--secondary); min-height: 1.2em; }
.pg-hint { min-height: 1.2em; margin: 6px 0 0; font-size: 0.78rem; color: var(--secondary); }
.pg-hint.is-error { color: color-mix(in srgb, #f59e0b 60%, var(--primary)); }
@media (max-width: 360px) {
  .pg-btns { flex-direction: column; }
}
</style>

<div class="pg-wrap">
  <div class="pg-card">
    <div class="pg-row pg-len">
      <span id="pgLenLabel">长度：16</span>
      <input type="range" id="pgLen" min="4" max="64" value="16" aria-label="密码长度">
    </div>
    <div class="pg-row pg-types">
      <label><input type="checkbox" id="pgUpper" checked> 大写</label>
      <label><input type="checkbox" id="pgLower" checked> 小写</label>
      <label><input type="checkbox" id="pgDigit" checked> 数字</label>
      <label><input type="checkbox" id="pgSym" checked> 符号</label>
      <label><input type="checkbox" id="pgAmb"> 排除易混淆</label>
    </div>
    <div class="pg-out" id="pgOut" aria-live="polite">点击生成</div>
    <div class="pg-meter"><i id="pgMeter"></i></div>
    <div class="pg-strength" id="pgStrength"></div>
    <div class="pg-btns">
      <button class="pg-primary" id="pgGen" type="button">🎲 生成</button>
      <button id="pgCopy" type="button">📋 复制</button>
    </div>
    <p class="pg-hint" id="pgHint" aria-live="polite"></p>
  </div>
</div>

<script>
(()=>{
  const POOL={
    upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower:'abcdefghijklmnopqrstuvwxyz',
    digit:'0123456789',
    sym:'!@#$%^&*()-_=+[]{};:,.?'
  };
  const AMB={
    upper:'ABCDEFGHJKLMNPQRSTUVWXYZ',
    lower:'abcdefghijkmnpqrstuvwxyz',
    digit:'23456789'
  };
  const KEY={upper:'pgUpper',lower:'pgLower',digit:'pgDigit',sym:'pgSym'};
  const out=document.getElementById('pgOut');
  const meter=document.getElementById('pgMeter');
  const strengthEl=document.getElementById('pgStrength');
  const hintEl=document.getElementById('pgHint');
  const lenEl=document.getElementById('pgLen');
  const lenLabel=document.getElementById('pgLenLabel');

  function setHint(msg,isError){
    hintEl.textContent=msg||'';
    hintEl.classList.toggle('is-error',!!isError);
  }

  function randInt(n){
    if(n<=0) return 0;
    if(n===1) return 0;
    const limit=Math.floor(0xFFFFFFFF/n)*n;
    const buf=new Uint32Array(1);
    let v=0;
    do{ crypto.getRandomValues(buf); v=buf[0]; }while(v>=limit);
    return v%n;
  }

  function selectedTypes(){
    return ['upper','lower','digit','sym'].filter(k=>document.getElementById(KEY[k]).checked);
  }

  function currentPools(){
    const amb=document.getElementById('pgAmb').checked;
    return selectedTypes().map(k=>(amb&&AMB[k])?AMB[k]:POOL[k]);
  }

  function length(){
    let v=parseInt(lenEl.value,10);
    if(!isFinite(v)) v=16;
    return Math.max(4,Math.min(64,v));
  }

  function updateMeter(pools){
    const len=length();
    const types=pools.length;
    let score=0;
    if(len>=8) score++;
    if(len>=12) score++;
    if(types>=3) score++;
    if(len>=16&&types===4) score++;
    meter.style.width=(score/4*100)+'%';
    meter.style.background=score>=3?'#27ae60':score===2?'#f39c12':'#e74c3c';
    if(!types){ strengthEl.textContent='未选择字符类型'; return; }
    const labels=['很弱','较弱','中等','较强','很强'];
    const poolSize=pools.join('').length;
    strengthEl.textContent=labels[score]+' · 字符池 '+poolSize+' 个 · 长度 '+len+' 位 · 约 '+Math.round(len*Math.log2(poolSize))+' bit 熵';
  }

  function generate(){
    setHint('');
    lenLabel.textContent='长度：'+length();
    const pools=currentPools();
    const len=length();
    if(!pools.length){
      out.textContent='至少选择一种字符类型';
      out.classList.add('is-empty');
      meter.style.width='0';
      strengthEl.textContent='未选择字符类型';
      return;
    }
    out.classList.remove('is-empty');
    const all=pools.join('');
    const chars=[];
    const guaranteed=Math.min(pools.length,len);
    for(let i=0;i<guaranteed;i++) chars.push(pools[i][randInt(pools[i].length)]);
    while(chars.length<len) chars.push(all[randInt(all.length)]);
    for(let i=chars.length-1;i>0;i--){ const j=randInt(i+1); const t=chars[i]; chars[i]=chars[j]; chars[j]=t; }
    out.textContent=chars.join('');
    updateMeter(pools);
  }

  async function copyText(t){
    if(!t) return false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; }
    }catch(e){}
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();
      const ok=document.execCommand('copy');
      ta.remove();
      return ok;
    }catch(e){ return false; }
  }

  document.getElementById('pgGen').addEventListener('click',generate);
  document.getElementById('pgCopy').addEventListener('click',async()=>{
    if(out.classList.contains('is-empty')||!out.textContent.trim()){
      setHint('请先生成密码',true);
      return;
    }
    const ok=await copyText(out.textContent.trim());
    setHint(ok?'已复制到剪贴板':'复制失败，请手动选择复制',!ok);
  });
  lenEl.addEventListener('input',generate);
  ['pgUpper','pgLower','pgDigit','pgSym','pgAmb'].forEach(id=>{
    document.getElementById(id).addEventListener('change',generate);
  });

  generate();
})();
</script>
