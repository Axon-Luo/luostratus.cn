<style>
.p24-wrap { max-width: 440px; margin: 0 auto; text-align: center; --p24-line: color-mix(in srgb, var(--primary) 18%, transparent); }
.p24-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
.p24-wrap .p24-bar select, .p24-wrap .p24-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--p24-line); background: color-mix(in srgb, var(--primary) 7%, var(--entry)); color: var(--primary); font-size: 0.86rem; cursor: pointer; }
.p24-wrap .p24-bar button:hover, .p24-wrap .p24-bar select:hover { background: color-mix(in srgb, var(--primary) 13%, var(--entry)); border-color: color-mix(in srgb, var(--primary) 34%, transparent); }
.p24-card { background: var(--entry); border: 1px solid var(--p24-line); border-radius: 12px; padding: 18px 16px; max-width: 440px; margin: 0 auto; }
.p24-cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
.p24-num { width: 68px; height: 92px; border-radius: 12px; background: color-mix(in srgb, var(--primary) 8%, var(--entry)); border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent); display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 700; color: var(--primary); }
.p24-input-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
.p24-wrap .p24-input-wrap input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--p24-line); background: var(--theme); color: var(--primary); font-size: 1rem; text-align: center; }
.p24-wrap .p24-input-wrap input:focus { outline: none; border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
.p24-wrap .p24-input-wrap input::placeholder { color: var(--secondary); font-size: 0.86rem; }
.p24-wrap .p24-input-wrap button { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: var(--theme); font-size: 0.95rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
.p24-result { font-size: 0.9rem; min-height: 24px; color: var(--secondary); word-break: break-all; line-height: 1.5; }
.p24-info { display: flex; justify-content: center; gap: 20px; margin-top: 14px; font-size: 0.86rem; color: var(--secondary); flex-wrap: wrap; }
.p24-info strong { color: var(--primary); }
.p24-tip { margin-top: 12px; font-size: 0.8rem; color: var(--secondary); }
@media (max-width: 380px) { .p24-num { width: 58px; height: 80px; font-size: 1.6rem; } }
</style>

<div class="p24-wrap">
  <div class="p24-bar">
    <select id="p24Diff" aria-label="难度"><option value="easy">简单 (1-9)</option><option value="normal" selected>普通 (1-13)</option><option value="hard">困难 (含负数)</option></select>
    <button id="p24New">新题目</button>
    <button id="p24Solve">💡 查看解法</button>
  </div>
  <div class="p24-card">
    <div class="p24-cards" id="p24Cards"></div>
    <div class="p24-input-wrap">
      <input id="p24Input" placeholder="例如 (3+5)×(8-5)" autocomplete="off" spellcheck="false">
      <button id="p24Submit">验证</button>
    </div>
    <div class="p24-result" id="p24Result"></div>
  </div>
  <div class="p24-info">
    <span>⏱ <strong id="p24Timer">00:00</strong></span>
    <span>正确：<strong id="p24Correct">0</strong></span>
    <span>总计：<strong id="p24Total">0</strong></span>
  </div>
  <div class="p24-tip">用给出的 4 个数（每个用一次）算出 24，支持 + - × ÷ 与括号</div>
</div>

<script>
(()=>{
  let nums=[], timerSec=0, timerId=null, correct=0, total=0, solved=false;
  const cardsEl=document.getElementById('p24Cards'),resultEl=document.getElementById('p24Result'),inputEl=document.getElementById('p24Input');
  const timerEl=document.getElementById('p24Timer'),correctEl=document.getElementById('p24Correct'),totalEl=document.getElementById('p24Total');

  function fmt(sec){ const m=Math.floor(sec/60),s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
  function startTimer(){
    if(timerId) return;
    timerId=setInterval(()=>{ timerSec++; timerEl.textContent=fmt(timerSec); },1000);
  }
  function stopTimer(){ clearInterval(timerId); timerId=null; }

  function newPuzzle(){
    const d=document.getElementById('p24Diff').value; solved=false;
    const max=d==='easy'?9:13; const min=d==='hard'?-6:1;
    let guard=0;
    do{ nums=Array.from({length:4},()=>Math.floor(Math.random()*(max-min+1))+min); } while(!hasSolution(nums)&&guard++<400);
    cardsEl.innerHTML=nums.map(n=>`<div class="p24-num">${n}</div>`).join('');
    inputEl.value=''; resultEl.textContent=''; resultEl.style.color='var(--secondary)';
    stopTimer(); timerSec=0; timerEl.textContent='00:00';
  }

  function hasSolution(arr){ return solve(arr,24)!=null; }

  /* 用 {v,expr} 节点递归合并，避免字符串替换把解法拼错 */
  function solveNodes(nodes,target){
    if(nodes.length===1) return Math.abs(nodes[0].v-target)<1e-9?nodes[0]:null;
    for(let i=0;i<nodes.length;i++){
      for(let j=0;j<nodes.length;j++){
        if(i===j) continue;
        const a=nodes[i], b=nodes[j];
        const rest=nodes.filter((_,k)=>k!==i&&k!==j);
        const cands=[];
        if(i<j) cands.push({v:a.v+b.v, expr:'('+a.expr+'+'+b.expr+')'});
        cands.push({v:a.v-b.v, expr:'('+a.expr+'-'+b.expr+')'});
        if(i<j) cands.push({v:a.v*b.v, expr:'('+a.expr+'×'+b.expr+')'});
        if(Math.abs(b.v)>1e-9) cands.push({v:a.v/b.v, expr:'('+a.expr+'÷'+b.expr+')'});
        for(const c of cands){
          const r=solveNodes([c,...rest],target);
          if(r) return r;
        }
      }
    }
    return null;
  }

  /* 负数牌要包一层括号，否则会出现 6--6 这类在 JS 里非法的表达式 */
  function solve(arr,target){ return solveNodes(arr.map(n=>({v:n,expr:n<0?'('+n+')':String(n)})),target); }

  /* 解析算式里的有符号数（支持 -6 这类负数字牌：仅在开头或运算符/左括号后视为负号） */
  function parseNumbers(expr){
    const out=[]; let i=0, expectValue=true;
    while(i<expr.length){
      const ch=expr[i];
      if(/\s/.test(ch)){ i++; continue; }
      if(ch==='-'&&expectValue){
        let j=i+1; while(j<expr.length&&/\s/.test(expr[j])) j++;
        if(/\d/.test(expr[j])){
          let k=j; while(k<expr.length&&/\d/.test(expr[k])) k++;
          out.push(-Number(expr.slice(j,k))); i=k; expectValue=false; continue;
        }
        i++; continue;
      }
      if(/\d/.test(ch)){
        let k=i; while(k<expr.length&&/\d/.test(expr[k])) k++;
        out.push(Number(expr.slice(i,k))); i=k; expectValue=false; continue;
      }
      if(ch==='('){ expectValue=true; i++; continue; }
      if(ch===')'){ expectValue=false; i++; continue; }
      if('+-*/'.includes(ch)){ expectValue=true; i++; continue; }
      i++;
    }
    return out;
  }

  function checkAnswer(){
    const raw=inputEl.value.trim(); if(!raw) return;
    startTimer();
    total++; totalEl.textContent=total;
    const clean=raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/x/gi,'*').replace(/[^0-9+\-*/().\s]/g,'');
    let result;
    try{ result=Function('"use strict"; return ('+clean+')')(); }
    catch(e){ resultEl.textContent='算式格式错误，请检查括号与运算符'; resultEl.style.color='#ef4444'; return; }
    if(typeof result!=='number'||!isFinite(result)){ resultEl.textContent='算式无法计算（可能除以 0）'; resultEl.style.color='#ef4444'; return; }
    const used=parseNumbers(clean).sort((a,b)=>a-b);
    const need=[...nums].sort((a,b)=>a-b);
    if(JSON.stringify(used)!==JSON.stringify(need)){
      resultEl.textContent='必须把给出的 4 个数字各用一次';
      resultEl.style.color='#ef4444'; return;
    }
    if(Math.abs(result-24)<1e-9){
      if(!solved){ correct++; correctEl.textContent=correct; solved=true; }
      stopTimer();
      resultEl.textContent='✅ 正确！用时 '+fmt(timerSec);
      resultEl.style.color='#22c55e';
    }else{
      resultEl.textContent='❌ 结果是 '+Number(result.toFixed(6))+'，不是 24';
      resultEl.style.color='#ef4444';
    }
  }

  document.getElementById('p24Submit').onclick=checkAnswer;
  inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter') checkAnswer(); });
  document.getElementById('p24New').onclick=newPuzzle;
  document.getElementById('p24Solve').onclick=()=>{
    const sol=solve(nums,24);
    resultEl.textContent=sol?('解法：'+sol.expr.replace(/^\((.*)\)$/,'$1')+' = 24'):'此题暂无解，请换一题';
    resultEl.style.color='var(--primary)';
  };
  document.getElementById('p24Diff').onchange=newPuzzle;

  newPuzzle();
})();
</script>
