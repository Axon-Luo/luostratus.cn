<style>
.sp-wrap { max-width: 560px; margin: 0 auto; text-align: center; }
.sp-text { width: 100%; min-height: 110px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); font-size: 0.9rem; resize: vertical; margin-bottom: 10px; }
.sp-area { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
#spCanvas { max-width: 100%; }
.sp-result { font-size: 1.2rem; color: var(--primary); margin: 10px 0; min-height: 28px; }
.sp-btns button { padding: 9px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; font-weight: 600; margin: 4px; }
</style>

<div class="sp-wrap">
  <textarea class="sp-text" id="spOpts" placeholder="每行一个选项，例如：&#10;吃饭&#10;睡觉&#10;写代码"></textarea>
  <div class="sp-area">
    <canvas id="spCanvas" width="360" height="360"></canvas>
    <div>
      <div class="sp-result" id="spResult">点击转动</div>
      <div class="sp-btns"><button id="spSpin">🎡 转动</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
  const canvas=document.getElementById('spCanvas');
  const ctx=canvas.getContext('2d');
  const resultEl=document.getElementById('spResult');
  const COLORS=['#e74c3c','#3498db','#27ae60','#f1c40f','#8e44ad','#e67e22','#16a085','#c0392b','#2980b9','#2ecc71'];
  let rotation=0, spinning=false, options=[];

  function getOptions(){
    const list=document.getElementById('spOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);
    return list.length>=2?list:['选项A','选项B'];
  }

  function draw(){
    options=getOptions();
    const n=options.length, cx=180, cy=180, r=170;
    ctx.clearRect(0,0,360,360);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rotation);
    for(let i=0;i<n;i++){
      const start=i/n*Math.PI*2-Math.PI/2;
      const end=(i+1)/n*Math.PI*2-Math.PI/2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,start,end); ctx.closePath();
      ctx.fillStyle=COLORS[i%COLORS.length]; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      ctx.save(); ctx.rotate(start+(end-start)/2);
      ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.textAlign='right';
      ctx.fillText(options[i].length>6?options[i].slice(0,6)+'…':options[i],r-10,5);
      ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.strokeStyle='var(--border)';
    ctx.beginPath(); ctx.moveTo(cx,20); ctx.lineTo(cx-12,50); ctx.lineTo(cx+12,50); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }

  function spin(){
    if(spinning) return;
    spinning=true;
    const n=options.length, slice=Math.PI*2/n;
    const target=rotation+Math.PI*2*(6+Math.floor(Math.random()*4));
    const start=rotation, duration=4000, t0=performance.now();
    function frame(t){
      const p=Math.min(1,(t-t0)/duration);
      const ease=1-Math.pow(1-p,3);
      rotation=start+(target-start)*ease;
      draw();
      if(p<1) requestAnimationFrame(frame);
      else {
        spinning=false;
        const norm=((2*Math.PI-(rotation%(2*Math.PI)))%(2*Math.PI));
        const idx=Math.floor(norm/slice)%n;
        resultEl.textContent='🎉 '+options[idx];
      }
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('spSpin').onclick=spin;
  document.getElementById('spOpts').addEventListener('input',()=>{ if(!spinning) draw(); });
  draw();
})();
</script>
