<style>
.rng-wrap { max-width: 500px; margin: 0 auto; }
.rng-card { padding: 20px; border-radius: 12px; background: var(--entry); border: 1px solid var(--border); margin-bottom: 16px; }
.rng-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.rng-row label { font-size: 0.85rem; color: var(--secondary); min-width: 60px; }
.rng-row input { padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); font-size: 0.9rem; width: 100px; }
.rng-row input[type="checkbox"] { width: auto; }
.rng-result { background: var(--code-bg); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 1.1rem; word-break: break-all; min-height: 50px; color: var(--primary); }
.rng-btns { display: flex; gap: 8px; margin-top: 10px; }
.rng-btns button { padding: 10px 20px; border-radius: 8px; border: none; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
.rng-gen { background: var(--primary); color: var(--theme); }
.rng-copy { border: 1px solid var(--border)!important; background: var(--entry); color: var(--primary); }
.rng-history { font-size: 0.82rem; color: var(--secondary); }
.rng-history div { padding: 3px 0; }
</style>

<div class="rng-wrap">
  <div class="rng-card">
    <div class="rng-row">
      <label>最小值</label><input type="number" id="rngMin" value="1" step="any">
      <label>最大值</label><input type="number" id="rngMax" value="100" step="any">
    </div>
    <div class="rng-row">
      <label>生成数量</label><input type="number" id="rngCount" value="5" min="1" max="1000">
      <label>小数位</label><input type="number" id="rngDec" value="0" min="0" max="10">
    </div>
    <div class="rng-row">
      <label><input type="checkbox" id="rngUnique"> 不允许重复</label>
      <label><input type="checkbox" id="rngSort"> 排序输出</label>
    </div>
    <div class="rng-btns">
      <button class="rng-gen" id="rngGenerate">🎲 生成</button>
      <button class="rng-copy" id="rngCopy">📋 复制</button>
    </div>
    <div class="rng-result" id="rngResult">点击生成</div>
  </div>
  <div class="rng-card">
    <h4 style="margin-bottom:8px">📋 历史</h4>
    <div class="rng-history" id="rngHistory"></div>
  </div>
</div>

<script>
(()=>{
  function generate(){
    const min=+document.getElementById('rngMin').value||0;
    const max=+document.getElementById('rngMax').value||100;
    const count=+document.getElementById('rngCount').value||5;
    const dec=+document.getElementById('rngDec').value||0;
    const unique=document.getElementById('rngUnique').checked;
    const sort=document.getElementById('rngSort').checked;
    const mult=Math.pow(10,dec);

    if(unique&&(max-min+1)*mult<count){ document.getElementById('rngResult').textContent='范围不足以生成不重复的随机数'; return; }

    const results=[]; const seen=new Set();
    while(results.length<count){
      const raw=Math.random()*(max-min)+min;
      const val=Math.round(raw*mult)/mult;
      const key=val.toFixed(dec);
      if(unique&&seen.has(key)) continue;
      seen.add(key); results.push(val);
    }
    if(sort) results.sort((a,b)=>a-b);
    const out=results.map(v=>v.toFixed(dec)).join(', ');
    document.getElementById('rngResult').textContent=out;

    // save history
    const h=JSON.parse(localStorage.getItem('rngHistory')||'[]');
    h.unshift({time:new Date().toLocaleTimeString('zh-CN'),out});
    if(h.length>10) h.length=10;
    localStorage.setItem('rngHistory',JSON.stringify(h));
    renderHistory();
  }

  function renderHistory(){
    const h=JSON.parse(localStorage.getItem('rngHistory')||'[]');
    document.getElementById('rngHistory').innerHTML=h.map(e=>`<div><strong>${e.time}</strong> ${e.out}</div>`).join('')||'暂无记录';
  }

  document.getElementById('rngGenerate').onclick=generate;
  document.getElementById('rngCopy').onclick=()=>{
    navigator.clipboard.writeText(document.getElementById('rngResult').textContent);
  };
  renderHistory();
})();
</script>
