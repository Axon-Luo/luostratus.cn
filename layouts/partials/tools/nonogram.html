<style>
.ng-wrap { --ng-line: color-mix(in srgb, var(--primary) 18%, transparent); --ng-cell: 42px; max-width: 520px; margin: 0 auto; text-align: center; }
.ng-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 14px; }
.ng-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ng-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.ng-bar button:hover { border-color: var(--primary); }
.ng-bar button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ng-status { color: var(--secondary); font-size: 0.88rem; min-height: 1.5em; margin: 0 0 14px; }
.ng-status.win { color: var(--primary); font-weight: 600; }
.ng-board { display: inline-grid; grid-template-columns: 46px repeat(5, var(--ng-cell)); gap: 3px; background: var(--entry); padding: 10px; border: 1px solid var(--ng-line); border-radius: 10px; }
.ng-clue { display: flex; align-items: center; justify-content: center; color: var(--secondary); font-size: 0.8rem; line-height: 1.2; }
.ng-clue.col { align-items: flex-end; padding-bottom: 3px; white-space: pre-line; text-align: center; }
.ng-clue.row { justify-content: flex-end; padding-right: 6px; }
.ng-cell { width: var(--ng-cell); height: var(--ng-cell); padding: 0; border-radius: 4px; border: 1px solid var(--ng-line); background: var(--code-bg); color: var(--secondary); font-size: 0.8rem; line-height: 1; cursor: pointer; transition: background 0.1s, border-color 0.1s; }
.ng-cell:hover { border-color: var(--primary); }
.ng-cell:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.ng-cell.filled { background: var(--primary); border-color: var(--primary); }
.ng-cell.marked { color: var(--secondary); }
.ng-board.done { border-color: var(--primary); }
@media (max-width: 400px) { .ng-wrap { --ng-cell: 36px; } .ng-board { padding: 8px; gap: 2px; } }
</style>

<div class="ng-wrap">
  <div class="ng-bar">
    <button id="ngNew" type="button">🔄 新谜题</button>
    <button id="ngCheck" type="button">✔ 检查</button>
  </div>
  <p class="ng-status" id="ngStatus">左键填色，右键标记 ✕，填满后点「检查」</p>
  <div class="ng-board" id="ngBoard"></div>
</div>

<script>
(()=>{
  const SIZE=5;
  const PATTERNS=[
    ['01110','10001','10001','10001','01110'],
    ['11111','10000','11110','10000','11111'],
    ['00100','01110','11111','01110','00100'],
    ['11011','11011','00000','11011','11011']
  ];
  const boardEl=document.getElementById('ngBoard');
  const statusEl=document.getElementById('ngStatus');
  let pattern=[], board=[], colClues=[], over=false;

  function clues(row){
    const out=[]; let run=0;
    for(const ch of row){ if(ch==='1') run++; else { if(run) out.push(run); run=0; } }
    if(run) out.push(run);
    return out.length?out.join(' '):'0';
  }

  function setStatus(msg, cls){
    statusEl.textContent=msg;
    statusEl.className='ng-status'+(cls?' '+cls:'');
  }

  function newPuzzle(){
    pattern=PATTERNS[Math.floor(Math.random()*PATTERNS.length)].map(s=>s.split(''));
    board=Array.from({length:SIZE},()=>Array(SIZE).fill(''));
    over=false;
    boardEl.classList.remove('done');
    colClues=[];
    for(let c=0;c<SIZE;c++) colClues.push(clues(pattern.map(r=>r[c]).join('')));
    setStatus('左键填色，右键标记 ✕，填满后点「检查」');
    render();
  }

  function render(){
    boardEl.innerHTML='';
    const corner=document.createElement('div');
    corner.className='ng-clue';
    boardEl.appendChild(corner);
    for(let c=0;c<SIZE;c++){
      const h=document.createElement('div');
      h.className='ng-clue col';
      h.textContent=colClues[c].split(' ').join('\n');
      boardEl.appendChild(h);
    }
    for(let r=0;r<SIZE;r++){
      const rh=document.createElement('div');
      rh.className='ng-clue row';
      rh.textContent=clues(pattern[r].join(''));
      boardEl.appendChild(rh);
      for(let c=0;c<SIZE;c++){
        const b=document.createElement('button');
        b.type='button';
        b.className='ng-cell';
        if(board[r][c]==='1') b.classList.add('filled');
        if(board[r][c]==='x'){ b.classList.add('marked'); b.textContent='✕'; }
        b.setAttribute('aria-label','第 '+(r+1)+' 行第 '+(c+1)+' 列');
        b.onclick=()=>{ if(over) return; board[r][c]=board[r][c]==='1'?'':'1'; render(); };
        b.oncontextmenu=e=>{ e.preventDefault(); if(over) return; board[r][c]=board[r][c]==='x'?'':'x'; render(); };
        boardEl.appendChild(b);
      }
    }
  }

  function check(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if((board[r][c]==='1')!==(pattern[r][c]==='1')){ setStatus('还有地方不对，继续试试'); return; }
    }
    over=true;
    boardEl.classList.add('done');
    setStatus('拼图完成 🎉 点「新谜题」再来一局','win');
  }

  document.getElementById('ngNew').addEventListener('click',newPuzzle);
  document.getElementById('ngCheck').addEventListener('click',check);
  newPuzzle();
})();
</script>
