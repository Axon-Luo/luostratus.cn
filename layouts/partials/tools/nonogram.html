<style>
.ng-wrap { max-width: 520px; margin: 0 auto; text-align: center; }
.ng-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
.ng-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; }
.ng-status { color: var(--secondary); font-size: 0.9rem; margin-bottom: 12px; }
.ng-board { display: inline-grid; grid-template-columns: repeat(5, 44px); gap: 3px; background: var(--entry); padding: 8px; border: 2px solid var(--border); border-radius: 8px; }
.ng-cell { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border); background: var(--code-bg); cursor: pointer; font-size: 0.8rem; color: var(--secondary); }
.ng-cell.filled { background: var(--primary); border-color: var(--primary); }
.ng-cell.marked { color: var(--secondary); }
.ng-hint { display: flex; justify-content: center; gap: 14px; margin-bottom: 6px; font-size: 0.8rem; color: var(--secondary); }
</style>

<div class="ng-wrap">
  <div class="ng-bar">
    <button id="ngNew">🔄 新谜题</button>
    <button id="ngCheck">✔ 检查</button>
  </div>
  <p class="ng-status" id="ngStatus">左键填色，右键标记 ✕</p>
  <div class="ng-hint"><span id="ngColHint"></span></div>
  <div class="ng-board" id="ngBoard"></div>
</div>

<script>
(()=>{
  const SIZE=5;
  const PATTERNS=[
    ['01110','10001','10001','10001','01110'],
    ['11111','10000','11110','10000','11111'],
    ['00100','01110','11111','01110','00100'],
    ['11011','11011','00000','11011','11011']
  ];
  const boardEl=document.getElementById('ngBoard');
  const statusEl=document.getElementById('ngStatus');
  const colHintEl=document.getElementById('ngColHint');
  let pattern=[], board=[], over=false;

  function clues(row){
    const out=[]; let run=0;
    for(const ch of row){ if(ch==='1') run++; else { if(run) out.push(run); run=0; } }
    if(run) out.push(run);
    return out.length?out.join(' '):'0';
  }

  function newPuzzle(){
    pattern=PATTERNS[Math.floor(Math.random()*PATTERNS.length)].map(s=>s.split(''));
    board=Array.from({length:SIZE},()=>Array(SIZE).fill(''));
    over=false;
    statusEl.textContent='左键填色，右键标记 ✕';
    const colClues=[];
    for(let c=0;c<SIZE;c++) colClues.push(clues(pattern.map(r=>r[c]).join('')));
    colHintEl.textContent='列：'+colClues.join('  ');
    render();
  }

  function render(){
    boardEl.innerHTML='';
    for(let r=0;r<SIZE;r++){
      const hint=document.createElement('div');
      hint.style.cssText='grid-column:1/-1;text-align:left;font-size:0.75rem;color:var(--secondary)';
      hint.textContent='行 '+r+': '+clues(pattern[r].join(''));
      boardEl.appendChild(hint);
      for(let c=0;c<SIZE;c++){
        const b=document.createElement('button');
        b.className='ng-cell';
        if(board[r][c]==='1') b.classList.add('filled');
        if(board[r][c]==='x') b.textContent='✕';
        b.onclick=()=>{ if(over)return; board[r][c]=board[r][c]==='1'?'':'1'; render(); };
        b.oncontextmenu=e=>{ e.preventDefault(); if(over)return; board[r][c]=board[r][c]==='x'?'':'x'; render(); };
        boardEl.appendChild(b);
      }
    }
  }

  function check(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if((board[r][c]==='1')!==(pattern[r][c]==='1')){ statusEl.textContent='还有地方不对，继续试试'; return; }
    }
    over=true;
    statusEl.textContent='拼图完成 🎉';
  }

  document.getElementById('ngNew').onclick=newPuzzle;
  document.getElementById('ngCheck').onclick=check;
  newPuzzle();
})();
</script>
