<style>
.g2048-wrap { max-width: 500px; margin: 0 auto; }
.g2048-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.g2048-bar select,
.g2048-bar button { padding: 6px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--primary) 24%, transparent); background: color-mix(in srgb, var(--primary) 10%, var(--entry)); color: var(--primary); font-size: 0.85rem; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
.g2048-bar select { background: var(--entry); }
.g2048-bar button:hover { background: color-mix(in srgb, var(--primary) 18%, var(--entry)); border-color: color-mix(in srgb, var(--primary) 38%, transparent); }
.g2048-bar button.primary { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.g2048-bar button.primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--entry)); }
.g2048-info { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.9rem; color: var(--secondary); }
.g2048-info strong { color: var(--primary); }
.g2048-board { display: grid; gap: 8px; background: color-mix(in srgb, var(--primary) 14%, transparent); border-radius: 10px; padding: 8px; margin: 0 auto; width: 100%; box-sizing: border-box; touch-action: none; }
.g2048-cell { border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; transition: background 0.12s ease, color 0.12s ease; background: var(--theme); }
.g2048-msg { text-align: center; padding: 6px 12px 10px; font-weight: 600; color: var(--secondary); min-height: 1.4em; }
.g2048-msg.warn { color: #f87171; }
.g2048-hint { margin-top: 10px; font-size: 0.78rem; color: var(--secondary); text-align: center; }
</style>

<div class="g2048-wrap">
  <div class="g2048-bar">
    <select id="g2048Size"><option value="3">3×3</option><option value="4" selected>4×4</option><option value="5">5×5</option><option value="6">6×6</option></select>
    <button id="g2048Restart" class="primary">重新开始</button>
    <button id="g2048Undo">撤回</button>
  </div>
  <div class="g2048-info">
    <span>分数：<strong id="g2048Score">0</strong></span>
    <span>最高分：<strong id="g2048Best">0</strong></span>
  </div>
  <div class="g2048-msg" id="g2048Msg"></div>
  <div class="g2048-board" id="g2048Board"></div>
  <div class="g2048-hint">方向键 / WASD 移动方块；手机可在棋盘上滑动。</div>
</div>

<script>
(()=>{
  let size=4, grid=[], score=0, history=[], bestKey='g2048best';

  const boardEl=document.getElementById('g2048Board'),scoreEl=document.getElementById('g2048Score'),bestEl=document.getElementById('g2048Best'),msgEl=document.getElementById('g2048Msg');
  const sizeSel=document.getElementById('g2048Size');

  function setMsg(t,warn){ msgEl.textContent=t||''; msgEl.classList.toggle('warn',!!warn); }

  function init(){
    size=+sizeSel.value; grid=Array.from({length:size},()=>Array(size).fill(0)); score=0; history=[];
    boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;
    // 宽度沿用经典比例（每格 90px），但不超过容器宽度，窄屏自动缩小
    boardEl.style.width='100%';
    boardEl.style.maxWidth=`${size*90}px`;
    const b=localStorage.getItem(bestKey+size)||0; bestEl.textContent=b;
    setMsg('');
    addTile(); addTile(); render();
  }

  function addTile(){
    const empty=[]; for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) empty.push({r,c});
    if(empty.length){ const {r,c}=empty[Math.floor(Math.random()*empty.length)]; grid[r][c]=Math.random()<0.9?2:4; }
  }

  function save(){ history.push({grid:grid.map(r=>[...r]),score}); if(history.length>10) history.shift(); }

  function undo(){
    if(!history.length) return;
    const prev=history.pop();
    grid=prev.grid.map(r=>[...r]); score=prev.score;
    setMsg('');
    render();
  }

  function slide(row){
    let arr=row.filter(v=>v), res=[];
    for(let i=0;i<arr.length;i++){
      if(i+1<arr.length&&arr[i]===arr[i+1]){ res.push(arr[i]*2); score+=arr[i]*2; i++; }
      else res.push(arr[i]);
    }
    while(res.length<size) res.push(0);
    return res;
  }

  function move(dr,dc){
    save(); let moved=false;
    if(dr){
      for(let c=0;c<size;c++){
        let col=[]; for(let r=0;r<size;r++) col.push(grid[r][c]);
        if(dr===1) col.reverse();
        const slid=slide(col); if(dr===1) slid.reverse();
        for(let r=0;r<size;r++){ if(grid[r][c]!==slid[r]) moved=true; grid[r][c]=slid[r]; }
      }
    }else{
      for(let r=0;r<size;r++){
        let row=[...grid[r]]; if(dc===1) row.reverse();
        const slid=slide(row); if(dc===1) slid.reverse();
        for(let c=0;c<size;c++){ if(grid[r][c]!==slid[c]) moved=true; grid[r][c]=slid[c]; }
      }
    }
    if(!moved){ history.pop(); return; }
    addTile(); render();
    if(isGameOver()) setMsg('游戏结束！点击「重新开始」再来一局',true);
  }

  function isGameOver(){
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      if(!grid[r][c]) return false;
      if(r+1<size&&grid[r][c]===grid[r+1][c]) return false;
      if(c+1<size&&grid[r][c]===grid[r][c+1]) return false;
    }
    return true;
  }

  function render(){
    scoreEl.textContent=score; const b=+bestEl.textContent; if(score>b){ localStorage.setItem(bestKey+size,score); bestEl.textContent=score; }
    const colors={0:'',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e',4096:'#3c3a32',8192:'#3c3a32'};
    boardEl.innerHTML=grid.flat().map(v=>{
      const c=colors[v]||'#3c3a32'; const fc=v>4?'#fff':'#776e65'; const fs=v>1000?(v>10000?'1.1rem':'1.3rem'):'1.6rem';
      return `<div class="g2048-cell" style="background:${v?c:''};color:${v?fc:''};font-size:${fs};aspect-ratio:1">${v||''}</div>`;
    }).join('');
  }

  sizeSel.onchange=init;
  document.getElementById('g2048Restart').onclick=init;
  document.getElementById('g2048Undo').onclick=undo;

  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toUpperCase();
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
    const k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w'){ e.preventDefault(); move(-1,0); }
    else if(k==='arrowdown'||k==='s'){ e.preventDefault(); move(1,0); }
    else if(k==='arrowleft'||k==='a'){ e.preventDefault(); move(0,-1); }
    else if(k==='arrowright'||k==='d'){ e.preventDefault(); move(0,1); }
  });

  // 手机滑动
  let ts=null;
  boardEl.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; ts={x:t.clientX,y:t.clientY}; },{passive:true});
  boardEl.addEventListener('touchmove',e=>{ if(ts) e.preventDefault(); },{passive:false});
  boardEl.addEventListener('touchend',e=>{
    if(!ts) return;
    const t=e.changedTouches[0], dx=t.clientX-ts.x, dy=t.clientY-ts.y; ts=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    if(Math.abs(dx)>Math.abs(dy)) move(0,dx>0?1:-1); else move(dy>0?1:-1,0);
    e.preventDefault();
  },{passive:false});

  init();
})();
</script>
