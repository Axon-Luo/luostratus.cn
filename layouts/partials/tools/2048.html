<style>
.g2048-wrap { max-width: 500px; margin: 0 auto; }
.g2048-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.g2048-bar select, .g2048-bar button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); font-size: 0.85rem; cursor: pointer; }
.g2048-info { display: flex; gap: 20px; margin-bottom: 10px; font-size: 0.9rem; color: var(--secondary); }
.g2048-info strong { color: var(--primary); }
.g2048-board { display: grid; gap: 8px; background: var(--border); border-radius: 8px; padding: 8px; margin: 0 auto; }
.g2048-cell { border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; transition: all 0.12s ease; background: var(--entry); }
.g2048-msg { text-align: center; padding: 12px; font-weight: 600; }
</style>

<div class="g2048-wrap">
  <div class="g2048-bar">
    <select id="g2048Size"><option value="3">3×3</option><option value="4" selected>4×4</option><option value="5">5×5</option><option value="6">6×6</option></select>
    <button id="g2048Restart">重新开始</button>
    <button id="g2048Undo">撤回</button>
  </div>
  <div class="g2048-info">
    <span>分数：<strong id="g2048Score">0</strong></span>
    <span>最高分：<strong id="g2048Best">0</strong></span>
  </div>
  <div class="g2048-msg" id="g2048Msg"></div>
  <div class="g2048-board" id="g2048Board"></div>
</div>

<script>
(()=>{
  let size=4, grid=[], score=0, history=[], bestKey='g2048best';

  const boardEl=document.getElementById('g2048Board'),scoreEl=document.getElementById('g2048Score'),bestEl=document.getElementById('g2048Best'),msgEl=document.getElementById('g2048Msg');
  const sizeSel=document.getElementById('g2048Size');

  function init(){
    size=+sizeSel.value; grid=Array.from({length:size},()=>Array(size).fill(0)); score=0; history=[];
    boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;
    boardEl.style.width=boardEl.style.maxWidth=`${size*90}px`;
    const b=localStorage.getItem(bestKey+size)||0; bestEl.textContent=b;
    addTile(); addTile(); render();
  }

  function addTile(){
    const empty=[]; for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) empty.push({r,c});
    if(empty.length){ const {r,c}=empty[Math.floor(Math.random()*empty.length)]; grid[r][c]=Math.random()<0.9?2:4; }
  }

  function save(){ history.push({grid:grid.map(r=>[...r]),score}); if(history.length>10) history.shift(); }

  window.undo2048=function(){
    if(history.length<2) return;
    history.pop(); const prev=history[history.length-1]; grid=prev.grid.map(r=>[...r]); score=prev.score; render();
  };

  function slide(row){
    let arr=row.filter(v=>v), res=[];
    for(let i=0;i<arr.length;i++){
      if(i+1<arr.length&&arr[i]===arr[i+1]){ res.push(arr[i]*2); score+=arr[i]*2; i++; }
      else res.push(arr[i]);
    }
    while(res.length<size) res.push(0);
    return res;
  }

  function move(dr,dc){
    save(); let moved=false;
    if(dr){
      for(let c=0;c<size;c++){
        let col=[]; for(let r=0;r<size;r++) col.push(grid[r][c]);
        if(dr===1) col.reverse();
        const slid=slide(col); if(dr===1) slid.reverse();
        for(let r=0;r<size;r++){ if(grid[r][c]!==slid[r]) moved=true; grid[r][c]=slid[r]; }
      }
    }else{
      for(let r=0;r<size;r++){
        let row=[...grid[r]]; if(dc===1) row.reverse();
        const slid=slide(row); if(dc===1) slid.reverse();
        for(let c=0;c<size;c++){ if(grid[r][c]!==slid[c]) moved=true; grid[r][c]=slid[c]; }
      }
    }
    if(moved){ addTile(); render(); if(isGameOver()) msgEl.textContent='游戏结束！'; }
  }

  function isGameOver(){
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      if(!grid[r][c]) return false;
      if(r+1<size&&grid[r][c]===grid[r+1][c]) return false;
      if(c+1<size&&grid[r][c]===grid[r][c+1]) return false;
    }
    return true;
  }

  function render(){
    scoreEl.textContent=score; const b=+bestEl.textContent; if(score>b){ localStorage.setItem(bestKey+size,score); bestEl.textContent=score; }
    const colors={0:'',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e',4096:'#3c3a32',8192:'#3c3a32'};
    boardEl.innerHTML=grid.flat().map(v=>{
      const c=colors[v]||'#3c3a32'; const fc=v>4?'#fff':'#776e65'; const fs=v>1000?(v>10000?'1.2rem':'1.4rem'):'1.6rem';
      return `<div class="g2048-cell" style="background:${c};color:${fc};font-size:${fs};aspect-ratio:1">${v||''}</div>`;
    }).join('');
  }

  sizeSel.onchange=init;
  document.getElementById('g2048Restart').onclick=init;
  document.getElementById('g2048Undo').onclick=()=>undo2048();

  document.addEventListener('keydown',e=>{
    const k=e.key; msgEl.textContent='';
    if(k==='ArrowUp'){ e.preventDefault(); move(-1,0); }
    else if(k==='ArrowDown'){ e.preventDefault(); move(1,0); }
    else if(k==='ArrowLeft'){ e.preventDefault(); move(0,-1); }
    else if(k==='ArrowRight'){ e.preventDefault(); move(0,1); }
  });

  init();
})();
</script>
