<style>
.mine-wrap { max-width: 680px; margin: 0 auto; }
.mine-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.mine-bar select,
.mine-bar button,
.mine-bar input { padding: 5px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent); background: var(--entry); color: var(--primary); font-size: 0.82rem; }
.mine-bar button { cursor: pointer; }
.mine-bar button:hover { background: color-mix(in srgb, var(--primary) 16%, var(--entry)); }
.mine-bar button.primary { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.mine-bar button.active { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.mine-bar input[type="number"] { width: 58px; }
.mine-info { display: flex; gap: 20px; margin-bottom: 8px; font-size: 0.9rem; color: var(--secondary); }
.mine-info strong { color: var(--primary); }
.mine-grid { display: grid; gap: 1px; background: color-mix(in srgb, var(--primary) 18%, transparent); border-radius: 6px; padding: 2px; margin: 0 auto; width: max-content; max-width: 100%; overflow-x: auto; user-select: none; touch-action: manipulation; }
.mine-cell { width: var(--mc, 28px); height: var(--mc, 28px); border-radius: 3px; background: color-mix(in srgb, var(--primary) 14%, var(--entry)); display: flex; align-items: center; justify-content: center; font-size: clamp(10px, calc(var(--mc, 28px) * 0.48), 15px); font-weight: 700; line-height: 1; cursor: pointer; transition: background 0.1s; }
.mine-cell:hover:not(.revealed) { background: color-mix(in srgb, var(--primary) 32%, transparent); }
.mine-cell.revealed { background: color-mix(in srgb, var(--primary) 5%, var(--theme)); cursor: default; }
.mine-cell.flagged { color: #f87171; }
.mine-cell.exploded { background: #b91c1c; }
.mine-cell.n1{color:#2563eb}.mine-cell.n2{color:#16a34a}.mine-cell.n3{color:#dc2626}.mine-cell.n4{color:#7c3aed}.mine-cell.n5{color:#b91c1c}.mine-cell.n6{color:#0891b2}.mine-cell.n7{color:#1f2937}.mine-cell.n8{color:#6b7280}
html[data-theme="dark"] .mine-cell.n1{color:#93c5fd}
html[data-theme="dark"] .mine-cell.n2{color:#86efac}
html[data-theme="dark"] .mine-cell.n3{color:#fca5a5}
html[data-theme="dark"] .mine-cell.n4{color:#c4b5fd}
html[data-theme="dark"] .mine-cell.n5{color:#f87171}
html[data-theme="dark"] .mine-cell.n6{color:#67e8f9}
html[data-theme="dark"] .mine-cell.n7{color:#e5e7eb}
html[data-theme="dark"] .mine-cell.n8{color:#d1d5db}
.mine-status { min-height: 1.5em; margin-top: 10px; font-size: 0.86rem; color: var(--secondary); }
.mine-status.win { color: #22c55e; }
.mine-status.lose { color: #ef4444; }
.mine-hint { margin-top: 4px; font-size: 0.78rem; color: var(--secondary); }
</style>

<div class="mine-wrap">
  <div class="mine-bar">
    <select id="mineDiff"><option value="easy">初级 9×9</option><option value="medium" selected>中级 16×16</option><option value="hard">高级 30×16</option><option value="custom">自定义</option></select>
    <span id="mineCustom" hidden>宽<input type="number" id="mineW" value="9" min="5" max="30"> 高<input type="number" id="mineH" value="9" min="5" max="24"> 雷<input type="number" id="mineM" value="10" min="1" max="200"></span>
    <button id="mineFlagMode" title="开启后点击格子即插旗">🚩 标记</button>
    <button id="mineRestart" class="primary">新游戏</button>
  </div>
  <div class="mine-info">
    <span>💣 <strong id="mineLeft">10</strong></span>
    <span>⏱ <strong id="mineTimer">0</strong>s</span>
  </div>
  <div class="mine-grid" id="mineGrid"></div>
  <div class="mine-status" id="mineStatus">点击任意格子开始</div>
  <div class="mine-hint">左键翻开；右键或「标记」模式插旗；数字格上再点一次可批量翻开周围；触屏长按插旗。</div>
</div>

<script>
(()=>{
  let w=16,h=16,mines=40,board=[],revealed=[],flagged=[],timerSec=0,timerId=null,started=false,gameOver=false,flagMode=false,longPressCell=null,explodedAt=null;

  const wrap=document.querySelector('.mine-wrap');
  const gridEl=document.getElementById('mineGrid'),mineLeftEl=document.getElementById('mineLeft'),timerEl=document.getElementById('mineTimer');
  const diffSel=document.getElementById('mineDiff'),customSpan=document.getElementById('mineCustom');
  const statusEl=document.getElementById('mineStatus'),flagBtn=document.getElementById('mineFlagMode');
  const wInp=document.getElementById('mineW'),hInp=document.getElementById('mineH'),mInp=document.getElementById('mineM');

  function clampInt(v,min,max,def){ v=parseInt(v,10); if(isNaN(v)) return def; return Math.min(max,Math.max(min,v)); }
  function setStatus(msg,cls){ statusEl.textContent=msg; statusEl.className='mine-status'+(cls?' '+cls:''); }

  function updateCellSize(){
    const avail=wrap.clientWidth-6-(w-1);
    let cell=Math.floor(avail/w);
    cell=Math.max(14,Math.min(28,cell));
    gridEl.style.setProperty('--mc',cell+'px');
  }

  function init(){
    const d=diffSel.value; gameOver=false; started=false; flagMode=false; longPressCell=null; explodedAt=null;
    flagBtn.classList.remove('active');
    if(d==='easy'){ w=9;h=9;mines=10; }
    else if(d==='medium'){ w=16;h=16;mines=40; }
    else if(d==='hard'){ w=30;h=16;mines=99; }
    else{
      w=clampInt(wInp.value,5,30,9); h=clampInt(hInp.value,5,24,9);
      const maxMines=Math.max(1,w*h-9);
      mines=clampInt(mInp.value,1,maxMines,10);
      wInp.value=w; hInp.value=h; mInp.value=mines; mInp.max=maxMines;
    }
    customSpan.hidden=d!=='custom';
    board=Array.from({length:h},()=>Array(w).fill(0)); revealed=Array.from({length:h},()=>Array(w).fill(false)); flagged=Array.from({length:h},()=>Array(w).fill(false));
    clearInterval(timerId); timerId=null; timerSec=0; timerEl.textContent='0'; mineLeftEl.textContent=mines;
    gridEl.style.gridTemplateColumns=`repeat(${w}, var(--mc))`;
    updateCellSize();
    setStatus('点击任意格子开始');
    render();
  }

  function placeMines(sx,sy){
    const positions=[]; for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(Math.abs(x-sx)>1||Math.abs(y-sy)>1) positions.push({x,y});
    for(let i=positions.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]; }
    positions.slice(0,mines).forEach(({x,y})=>{ board[y][x]=-1; });
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(board[y][x]!==-1){ let c=0; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const ny=y+dy,nx=x+dx; if(ny>=0&&ny<h&&nx>=0&&nx<w&&board[ny][nx]===-1) c++; } board[y][x]=c; }
  }

  function startGame(x,y){
    if(started) return;
    started=true; placeMines(x,y);
    clearInterval(timerId);
    timerId=setInterval(()=>{ timerSec++; timerEl.textContent=timerSec; },1000);
    setStatus('进行中');
  }

  function reveal(x,y){
    if(gameOver) return;
    if(x<0||x>=w||y<0||y>=h||revealed[y][x]||flagged[y][x]) return;
    revealed[y][x]=true;
    if(board[y][x]===-1){ lose(x,y); return; }
    if(board[y][x]===0){ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(dx||dy) reveal(x+dx,y+dy); }
    if(!gameOver && revealed.flat().filter(v=>v).length===w*h-mines) win();
  }

  function lose(x,y){
    gameOver=true; explodedAt={x,y}; clearInterval(timerId);
    for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) if(board[yy][xx]===-1) revealed[yy][xx]=true;
    setStatus('踩到雷了，游戏结束。点击「新游戏」再来一局', 'lose');
  }

  function win(){
    gameOver=true; clearInterval(timerId);
    for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) if(board[yy][xx]===-1) flagged[yy][xx]=true;
    setStatus(`全部排除！用时 ${timerSec} 秒`, 'win');
  }

  function chord(x,y){
    if(!revealed[y][x]||board[y][x]<=0) return;
    let fc=0; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const nx=x+dx,ny=y+dy; if(ny>=0&&ny<h&&nx>=0&&nx<w&&flagged[ny][nx]) fc++; }
    if(fc===board[y][x]){ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(x+dx>=0&&x+dx<w&&y+dy>=0&&y+dy<h&&!flagged[y+dy][x+dx]) reveal(x+dx,y+dy); }
  }

  function toggleFlag(x,y){
    if(gameOver||revealed[y][x]) return;
    if(!started) startGame(x,y);
    flagged[y][x]=!flagged[y][x];
    render();
  }

  function render(){
    const flags=flagged.flat().filter(v=>v).length;
    mineLeftEl.textContent=Math.max(0,mines-flags);
    gridEl.innerHTML='';
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const cell=document.createElement('div'); cell.className='mine-cell';
      if(revealed[y][x]){
        cell.classList.add('revealed');
        if(explodedAt&&explodedAt.x===x&&explodedAt.y===y) cell.classList.add('exploded');
        if(board[y][x]===-1){ cell.textContent='💣'; }
        else if(board[y][x]>0){ cell.textContent=board[y][x]; cell.classList.add('n'+board[y][x]); }
      }else if(flagged[y][x]){ cell.textContent='🚩'; cell.classList.add('flagged'); }
      cell.addEventListener('click',()=>{
        if(gameOver) return;
        // 长按插旗后浏览器可能补发一次 click，只屏蔽同一格且紧随其后的那一次
        if(longPressCell&&longPressCell.x===x&&longPressCell.y===y&&Date.now()-longPressCell.t<600){ longPressCell=null; return; }
        if(!started) startGame(x,y);
        if(flagMode){ toggleFlag(x,y); return; }
        if(revealed[y][x]){ chord(x,y); render(); return; }
        reveal(x,y); render();
      });
      cell.addEventListener('contextmenu',e=>{ e.preventDefault(); if(gameOver) return; if(revealed[y][x]) return; if(!started) startGame(x,y); flagged[y][x]=!flagged[y][x]; render(); });
      cell.addEventListener('dblclick',()=>{ if(gameOver||!started||flagMode) return; chord(x,y); render(); });
      let pressTimer=null;
      cell.addEventListener('touchstart',()=>{ pressTimer=setTimeout(()=>{ pressTimer=null; longPressCell={x,y,t:Date.now()}; toggleFlag(x,y); },450); },{passive:true});
      cell.addEventListener('touchmove',()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } },{passive:true});
      cell.addEventListener('touchend',e=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } if(longPressCell&&longPressCell.x===x&&longPressCell.y===y&&Date.now()-longPressCell.t<600){ e.preventDefault(); } },{passive:false});
      gridEl.appendChild(cell);
    }
  }

  diffSel.onchange=init; document.getElementById('mineRestart').onclick=init;
  wInp.onchange=init; hInp.onchange=init; mInp.onchange=init;
  flagBtn.onclick=()=>{ flagMode=!flagMode; flagBtn.classList.toggle('active',flagMode); };
  window.addEventListener('resize',updateCellSize);
  init();
})();
</script>
