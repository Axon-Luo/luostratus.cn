<style>
.nc-wrap { max-width: 560px; margin: 0 auto; --nc-line: color-mix(in srgb, var(--primary) 20%, transparent); }
.nc-section { margin-bottom: 18px; padding: 20px; border-radius: 12px; background: var(--entry); border: 1px solid var(--border); }
.nc-section h3 { margin: 0 0 14px; font-size: 1rem; }
.nc-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) 40px; align-items: center; gap: 10px; margin-bottom: 10px; }
.nc-row:last-of-type { margin-bottom: 0; }
.nc-row label { font-size: 0.85rem; color: var(--secondary); }
.nc-row input, .nc-pair input { width: 100%; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--nc-line); background: var(--entry); color: var(--primary); font-size: 0.92rem; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.nc-tag { font-size: 0.72rem; color: var(--secondary); text-align: right; letter-spacing: 0.08em; }
.nc-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; }
.nc-pair-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nc-pair-field label { font-size: 0.78rem; color: var(--secondary); }
.nc-mid { color: var(--secondary); font-size: 0.95rem; padding-bottom: 10px; }
.nc-hint { min-height: 1.2em; margin: 8px 0 0; font-size: 0.78rem; color: var(--secondary); }
.nc-hint.is-error { color: color-mix(in srgb, #f59e0b 60%, var(--primary)); }
@media (max-width: 520px) {
  .nc-row { grid-template-columns: 64px minmax(0, 1fr); }
  .nc-row label { white-space: nowrap; }
  .nc-tag { display: none; }
  .nc-pair { grid-template-columns: 1fr; gap: 8px; }
  .nc-mid { padding: 0; text-align: center; transform: rotate(90deg); }
}
</style>

<div class="nc-wrap">
  <div class="nc-section">
    <h3>🔢 进制转换</h3>
    <div class="nc-row"><label for="ncDec">十进制</label><input type="text" id="ncDec" placeholder="例如 255" autocomplete="off" spellcheck="false"><span class="nc-tag">DEC</span></div>
    <div class="nc-row"><label for="ncBin">二进制</label><input type="text" id="ncBin" placeholder="例如 11111111" autocomplete="off" spellcheck="false"><span class="nc-tag">BIN</span></div>
    <div class="nc-row"><label for="ncOct">八进制</label><input type="text" id="ncOct" placeholder="例如 377" autocomplete="off" spellcheck="false"><span class="nc-tag">OCT</span></div>
    <div class="nc-row"><label for="ncHex">十六进制</label><input type="text" id="ncHex" placeholder="例如 FF" autocomplete="off" spellcheck="false"><span class="nc-tag">HEX</span></div>
    <p class="nc-hint" id="ncBaseHint" aria-live="polite"></p>
  </div>

  <div class="nc-section">
    <h3>🈶 中文大写数字 ↔ 阿拉伯数字</h3>
    <div class="nc-pair">
      <div class="nc-pair-field"><label for="ncArabic">阿拉伯数字</label><input type="text" id="ncArabic" placeholder="例如 123" inputmode="numeric" autocomplete="off" spellcheck="false"></div>
      <div class="nc-mid">↔</div>
      <div class="nc-pair-field"><label for="ncChinese">中文大写</label><input type="text" id="ncChinese" placeholder="例如 壹佰贰拾叁" autocomplete="off" spellcheck="false"></div>
    </div>
    <p class="nc-hint" id="ncCnHint" aria-live="polite"></p>
  </div>

  <div class="nc-section">
    <h3>🏛️ 罗马数字 ↔ 阿拉伯数字</h3>
    <div class="nc-pair">
      <div class="nc-pair-field"><label for="ncRomArabic">阿拉伯数字</label><input type="text" id="ncRomArabic" placeholder="1 ~ 3999" inputmode="numeric" autocomplete="off" spellcheck="false"></div>
      <div class="nc-mid">↔</div>
      <div class="nc-pair-field"><label for="ncRoman">罗马数字</label><input type="text" id="ncRoman" placeholder="例如 MCMXCIV" autocomplete="off" spellcheck="false"></div>
    </div>
    <p class="nc-hint" id="ncRomanHint" aria-live="polite"></p>
  </div>
</div>

<script>
(()=>{
  /* ---------------- 进制转换 ---------------- */
  const BASE={dec:10,bin:2,oct:8,hex:16};
  const BASE_NAME={dec:'十进制',bin:'二进制',oct:'八进制',hex:'十六进制'};
  const baseEls={
    dec:document.getElementById('ncDec'),bin:document.getElementById('ncBin'),
    oct:document.getElementById('ncOct'),hex:document.getElementById('ncHex')
  };
  const baseHint=document.getElementById('ncBaseHint');

  function setHint(el,msg,isError){
    el.textContent=msg||'';
    el.classList.toggle('is-error',!!isError);
  }

  function parseBase(text,base){
    let s=String(text).trim().replace(/[\s_]/g,'').toLowerCase();
    if(!s) return {empty:true};
    let neg=false;
    if(s[0]==='-'){ neg=true; s=s.slice(1); }
    else if(s[0]==='+'){ s=s.slice(1); }
    if(!s) throw new Error('bad');
    let val=0n;
    const b=BigInt(base);
    for(const ch of s){
      let d;
      if(ch>='0'&&ch<='9') d=ch.charCodeAt(0)-48;
      else if(ch>='a'&&ch<='f') d=ch.charCodeAt(0)-87;
      else throw new Error('bad');
      if(d>=base) throw new Error('bad');
      val=val*b+BigInt(d);
    }
    return {value:neg?-val:val};
  }

  function toBase(val,base){
    const neg=val<0n;
    let s=(neg?-val:val).toString(base);
    if(base===16) s=s.toUpperCase();
    return (neg?'-':'')+s;
  }

  function convertBase(from){
    const el=baseEls[from];
    const raw=el.value;
    if(!raw.trim()){
      Object.keys(baseEls).forEach(k=>{ if(k!==from) baseEls[k].value=''; });
      setHint(baseHint,'');
      return;
    }
    let parsed;
    try{ parsed=parseBase(raw,BASE[from]); }
    catch(e){
      setHint(baseHint,'无法解析「'+raw.trim()+'」为'+BASE_NAME[from]+'数字',true);
      return;
    }
    if(parsed.empty) return;
    setHint(baseHint,'十进制 '+toBase(parsed.value,10)+' · 支持负数与大整数');
    Object.keys(baseEls).forEach(k=>{
      if(k!==from) baseEls[k].value=toBase(parsed.value,BASE[k]);
    });
  }

  Object.keys(baseEls).forEach(k=>{
    baseEls[k].addEventListener('input',()=>convertBase(k));
  });

  /* ---------------- 中文大写数字 ---------------- */
  const CN_DIGITS=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
  const CN_UNITS=['','拾','佰','仟','万','拾','佰','仟','亿','拾','佰','仟'];
  const cnArabicEl=document.getElementById('ncArabic');
  const cnChineseEl=document.getElementById('ncChinese');
  const cnHint=document.getElementById('ncCnHint');

  function arabicToChinese(numStr){
    const neg=numStr.startsWith('-');
    const digits=neg?numStr.slice(1):numStr;
    if(!/^\d+$/.test(digits)) return {error:'请输入整数'};
    if(digits.length>12) return {error:'数字过大，最多支持 12 位（9999 亿以内）'};
    if(/^0+$/.test(digits)) return {value:'零'};
    let out='';
    let zero=false;
    const len=digits.length;
    for(let i=0;i<len;i++){
      const d=+digits[i];
      const pos=len-1-i;
      if(d===0){
        zero=true;
        if((pos===4||pos===8)&&out&&!/[万亿]$/.test(out)){
          out+=CN_UNITS[pos];
          zero=false;
        }
        continue;
      }
      if(zero&&out) out+='零';
      zero=false;
      out+=CN_DIGITS[d]+CN_UNITS[pos];
    }
    out=out.replace(/零+/g,'零').replace(/零$/,'')||'零';
    return {value:(neg?'负':'')+out};
  }

  const CN_DIGIT_MAP={'零':0,'〇':0,'壹':1,'贰':2,'叁':3,'肆':4,'伍':5,'陆':6,'柒':7,'捌':8,'玖':9,
                      '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'两':2};
  const CN_UNIT_MAP={'拾':10,'佰':100,'仟':1000,'十':10,'百':100,'千':1000};

  function chineseToArabic(str){
    let s=String(str).trim().replace(/\s+/g,'');
    if(!s) return {empty:true};
    let neg=false;
    if(s[0]==='负'){ neg=true; s=s.slice(1); }
    const valid=new RegExp('['+Object.keys(CN_DIGIT_MAP).join('')+Object.keys(CN_UNIT_MAP).join('')+'万亿]');
    for(const ch of s){ if(!valid.test(ch)) return {error:'包含无法识别的字符「'+ch+'」'}; }
    let total=0,section=0,num=0,seen=false;
    for(const ch of s){
      if(CN_DIGIT_MAP[ch]!==undefined){ num=CN_DIGIT_MAP[ch]; seen=true; }
      else if(CN_UNIT_MAP[ch]){ if(num===0) num=1; section+=num*CN_UNIT_MAP[ch]; num=0; seen=true; }
      else if(ch==='万'){ section=(section+num)*10000; total+=section; section=0; num=0; seen=true; }
      else if(ch==='亿'){
        if(num===0&&section===0&&total>0) total*=100000000;
        else { section=(section+num)*100000000; total+=section; section=0; num=0; }
        seen=true;
      }
    }
    if(!seen) return {error:'请输入中文数字'};
    total+=section+num;
    if(total>999999999999) return {error:'数字过大，最多支持 9999 亿'};
    return {value:(neg?'-':'')+String(total)};
  }

  cnArabicEl.addEventListener('input',()=>{
    const raw=cnArabicEl.value.trim();
    if(!raw){ cnChineseEl.value=''; setHint(cnHint,''); return; }
    if(!/^-?\d+$/.test(raw)){
      setHint(cnHint,'请输入整数（不支持小数与符号）',true);
      cnChineseEl.value='';
      return;
    }
    const r=arabicToChinese(raw);
    if(r.error){ setHint(cnHint,r.error,true); cnChineseEl.value=''; return; }
    cnChineseEl.value=r.value;
    setHint(cnHint,'');
  });

  cnChineseEl.addEventListener('input',()=>{
    const raw=cnChineseEl.value.trim();
    if(!raw){ cnArabicEl.value=''; setHint(cnHint,''); return; }
    const r=chineseToArabic(raw);
    if(r.error){ setHint(cnHint,r.error,true); cnArabicEl.value=''; return; }
    if(r.empty) return;
    cnArabicEl.value=r.value;
    setHint(cnHint,'');
  });

  /* ---------------- 罗马数字 ---------------- */
  const ROMAN=[['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
  const ROMAN_VALUE={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  const romArabicEl=document.getElementById('ncRomArabic');
  const romanEl=document.getElementById('ncRoman');
  const romanHint=document.getElementById('ncRomanHint');

  romArabicEl.addEventListener('input',()=>{
    const raw=romArabicEl.value.trim();
    if(!raw){ romanEl.value=''; setHint(romanHint,''); return; }
    if(!/^\d+$/.test(raw)){
      romanEl.value='';
      setHint(romanHint,'请输入 1 ~ 3999 的整数',true);
      return;
    }
    const n=Number(raw);
    if(n<1||n>3999){
      romanEl.value='';
      setHint(romanHint,'仅支持 1 ~ 3999 的整数',true);
      return;
    }
    let rest=n,out='';
    for(const [sym,val] of ROMAN){ while(rest>=val){ out+=sym; rest-=val; } }
    romanEl.value=out;
    setHint(romanHint,'');
  });

  romanEl.addEventListener('input',()=>{
    const raw=romanEl.value.trim().toUpperCase();
    if(!raw){ romArabicEl.value=''; setHint(romanHint,''); return; }
    if(!/^[IVXLCDM]+$/.test(raw)){
      romArabicEl.value='';
      setHint(romanHint,'只能输入 I、V、X、L、C、D、M',true);
      return;
    }
    let result=0,prev=0;
    for(let i=raw.length-1;i>=0;i--){
      const v=ROMAN_VALUE[raw[i]];
      if(v<prev) result-=v; else { result+=v; prev=v; }
    }
    if(result<1||result>3999){
      romArabicEl.value='';
      setHint(romanHint,'罗马数字超出 1 ~ 3999 范围',true);
      return;
    }
    romArabicEl.value=String(result);
    setHint(romanHint,'');
  });
})();
</script>
