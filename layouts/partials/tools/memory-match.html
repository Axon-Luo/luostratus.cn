<style>
.mem-wrap { max-width: 560px; margin: 0 auto; }
.mem-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.mem-bar select,
.mem-bar button { padding: 6px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--primary) 24%, transparent); background: color-mix(in srgb, var(--primary) 10%, var(--entry)); color: var(--primary); font-size: 0.85rem; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
.mem-bar select { background: var(--entry); }
.mem-bar button:hover { background: color-mix(in srgb, var(--primary) 18%, var(--entry)); border-color: color-mix(in srgb, var(--primary) 38%, transparent); }
.mem-bar button.primary { background: var(--primary); color: var(--theme); border-color: var(--primary); }
.mem-info { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.9rem; color: var(--secondary); }
.mem-info strong { color: var(--primary); }
.mem-grid { display: grid; gap: 8px; justify-content: center; margin: 0 auto; touch-action: manipulation; }
.mem-card { aspect-ratio: 1; border-radius: 10px; background: color-mix(in srgb, var(--primary) 17%, var(--entry)); border: 2px solid color-mix(in srgb, var(--primary) 22%, transparent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; transition: transform 0.35s, background 0.35s, border-color 0.35s; transform-style: preserve-3d; user-select: none; }
.mem-card:hover { border-color: color-mix(in srgb, var(--primary) 40%, transparent); }
.mem-card.flipped { background: var(--theme); border-color: color-mix(in srgb, var(--primary) 40%, transparent); transform: rotateY(180deg); }
.mem-card.matched { background: color-mix(in srgb, #22c55e 18%, var(--entry)); border-color: #22c55e; cursor: default; opacity: 0.85; }
.mem-card .mem-face { display: inline-block; transition: transform 0.35s; }
.mem-card.flipped .mem-face { transform: rotateY(180deg); }
.mem-status { min-height: 1.5em; margin-top: 12px; font-size: 0.88rem; color: var(--secondary); }
.mem-status.win { color: #22c55e; font-weight: 600; }
.mem-hint { margin-top: 4px; font-size: 0.78rem; color: var(--secondary); }
</style>

<div class="mem-wrap">
  <div class="mem-bar">
    <select id="memDiff"><option value="6">4×3 (6对)</option><option value="8" selected>4×4 (8对)</option><option value="12">6×4 (12对)</option><option value="18">6×6 (18对)</option></select>
    <button id="memRestart" class="primary">重新开始</button>
  </div>
  <div class="mem-info">
    <span>步数：<strong id="memMoves">0</strong></span>
    <span>时间：<strong id="memTimer">0</strong>s</span>
    <span>最高：<strong id="memBest">—</strong></span>
  </div>
  <div class="mem-grid" id="memGrid"></div>
  <div class="mem-status" id="memStatus">翻开两张卡片找相同图案</div>
  <div class="mem-hint">步数越少越好，全部配对完成后自动记录最好成绩。</div>
</div>

<script>
(()=>{
  const EMOJIS=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦅'];
  let pairs=8, cards=[], flipped=[], matched=[], moves=0, lock=false, timer=0, timerId=null, started=false;
  let cols=4;

  const gridEl=document.getElementById('memGrid'),movesEl=document.getElementById('memMoves'),timerEl=document.getElementById('memTimer'),bestEl=document.getElementById('memBest'),statusEl=document.getElementById('memStatus');

  function setStatus(msg,win){ statusEl.textContent=msg; statusEl.classList.toggle('win',!!win); }

  function init(){
    pairs=+document.getElementById('memDiff').value; cols=pairs<=8?4:6;
    const emojis=EMOJIS.slice(0,pairs);
    cards=shuffle([...emojis,...emojis]); flipped=[]; matched=Array(pairs*2).fill(false); moves=0; lock=false; started=false;
    clearInterval(timerId); timer=0; timerEl.textContent='0'; movesEl.textContent='0';
    const b=localStorage.getItem('memBest'+pairs); bestEl.textContent=b?`${b}步`:'—';
    gridEl.style.gridTemplateColumns=`repeat(${cols},minmax(52px,1fr))`;
    gridEl.style.maxWidth=`${cols*88}px`;
    setStatus('翻开两张卡片找相同图案');
    render();
  }

  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  function render(){
    gridEl.innerHTML=cards.map((emoji,i)=>{
      const flipped_=flipped.includes(i), matched_=matched[i];
      const show=flipped_||matched_;
      return `<div class="mem-card${show?' flipped':''}${matched_?' matched':''}" data-idx="${i}">${show?`<span class="mem-face">${emoji}</span>`:''}</div>`;
    }).join('');
  }

  gridEl.addEventListener('click',e=>{
    const card=e.target.closest('.mem-card'); if(!card||lock) return;
    const idx=+card.dataset.idx; if(flipped.includes(idx)||matched[idx]) return;
    if(!started){ started=true; timerId=setInterval(()=>{ timer++; timerEl.textContent=timer; },1000); }
    flipped.push(idx);
    if(flipped.length===2){
      moves++; movesEl.textContent=moves; lock=true;
      const [a,b]=flipped;
      if(cards[a]===cards[b]){ matched[a]=matched[b]=true; flipped=[]; lock=false; render(); checkWin(); }
      else{ render(); setTimeout(()=>{ flipped=[]; lock=false; render(); },600); }
    }else render();
  });

  function checkWin(){
    if(matched.every(v=>v)){
      clearInterval(timerId);
      const b=localStorage.getItem('memBest'+pairs);
      if(!b||moves<+b){ localStorage.setItem('memBest'+pairs,moves); bestEl.textContent=`${moves}步`; }
      setStatus(`全部配对完成！用时 ${timer} 秒 · ${moves} 步`,true);
    }
  }

  document.getElementById('memRestart').onclick=init;
  document.getElementById('memDiff').onchange=init;
  init();
})();
</script>
