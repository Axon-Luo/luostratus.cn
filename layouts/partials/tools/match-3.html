<style>
.m3-wrap { --m3-line: color-mix(in srgb, var(--primary) 18%, transparent); max-width: 520px; margin: 0 auto; text-align: center; }
.m3-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px; margin-bottom: 14px; color: var(--secondary); font-size: 0.9rem; }
.m3-bar strong { color: var(--primary); }
.m3-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--m3-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.m3-bar button:hover { border-color: var(--primary); }
.m3-bar button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.m3-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-width: 440px; margin: 0 auto; }
.m3-cell { aspect-ratio: 1; padding: 0; font-size: 1.3rem; line-height: 1; border-radius: 6px; border: 1px solid var(--m3-line); background: var(--entry); color: var(--primary); cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s, transform 0.08s; }
.m3-cell:hover { border-color: var(--primary); }
.m3-cell.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.m3-status { color: var(--secondary); font-size: 0.85rem; min-height: 1.5em; margin: 12px 0 0; }
@media (max-width: 420px) { .m3-cell { font-size: 1rem; border-radius: 4px; } .m3-grid { gap: 3px; } }
</style>

<div class="m3-wrap">
  <div class="m3-bar">
    <span>得分 <strong id="m3Score">0</strong></span>
    <button id="m3New" type="button">🔄 重新开始</button>
  </div>
  <div class="m3-grid" id="m3Grid"></div>
  <p class="m3-status" id="m3Status">点击相邻两个图案交换，凑成三个以上即可消除</p>
</div>

<script>
(()=>{
  const SIZE=8, TYPES=['🍎','🍇','🍊','🍋','🍉','🫐'];
  const gridEl=document.getElementById('m3Grid');
  const statusEl=document.getElementById('m3Status');
  const scoreEl=document.getElementById('m3Score');
  let grid=[], selected=null, score=0, locked=false;

  function randomType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function randomBoard(){
    const g=[];
    for(let r=0;r<SIZE;r++){
      const row=[];
      for(let c=0;c<SIZE;c++){
        let t,n=0;
        do{
          t=randomType(); n++;
        } while(n<40&&((c>1&&row[c-1]===t&&row[c-2]===t)||(r>1&&g[r-1][c]===t&&g[r-2][c]===t)));
        row.push(t);
      }
      g.push(row);
    }
    return g;
  }

  function render(){
    gridEl.innerHTML='';
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      const b=document.createElement('button');
      b.type='button';
      b.className='m3-cell'; b.textContent=grid[r][c];
      if(selected&&selected.r===r&&selected.c===c) b.classList.add('selected');
      b.onclick=()=>clickCell(r,c);
      gridEl.appendChild(b);
    }
  }

  function scan(){
    const hit=new Set();
    for(let r=0;r<SIZE;r++){
      let run=1;
      for(let c=1;c<=SIZE;c++){
        if(c<SIZE&&grid[r][c]===grid[r][c-1]) run++;
        else { if(run>=3) for(let k=c-run;k<c;k++) hit.add(r+','+k); run=1; }
      }
    }
    for(let c=0;c<SIZE;c++){
      let run=1;
      for(let r=1;r<=SIZE;r++){
        if(r<SIZE&&grid[r][c]===grid[r-1][c]) run++;
        else { if(run>=3) for(let k=r-run;k<r;k++) hit.add(k+','+c); run=1; }
      }
    }
    return [...hit].map(s=>{ const [r,c]=s.split(',').map(Number); return {r,c}; });
  }

  function collapse(hit){
    const cells={};
    hit.forEach(p=>cells[p.r+','+p.c]=true);
    score+=hit.length*10;
    scoreEl.textContent=score;
    for(let c=0;c<SIZE;c++){
      const keep=[];
      for(let r=SIZE-1;r>=0;r--) if(!cells[r+','+c]) keep.push(grid[r][c]);
      let idx=0;
      for(let r=SIZE-1;r>=0;r--) grid[r][c]=idx<keep.length?keep[idx++]:randomType();
    }
  }

  function swap(a,b){
    [grid[a.r][a.c],grid[b.r][b.c]]=[grid[b.r][b.c],grid[a.r][a.c]];
  }

  function adjacent(a,b){ return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1; }

  // 是否还存在可消除的相邻交换；全盘无可动时自动重排，避免卡死
  function hasMoves(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(c+1<SIZE){
        swap({r,c},{r,c:c+1});
        const ok=scan().length>0;
        swap({r,c},{r,c:c+1});
        if(ok) return true;
      }
      if(r+1<SIZE){
        swap({r,c},{r:r+1,c});
        const ok=scan().length>0;
        swap({r,c},{r:r+1,c});
        if(ok) return true;
      }
    }
    return false;
  }

  function reshuffle(msg){
    let guard=0;
    do{ grid=randomBoard(); guard++; } while(guard<40&&!hasMoves());
    selected=null;
    render();
    if(msg) statusEl.textContent=msg;
  }

  function init(){
    let guard=0;
    do{ grid=randomBoard(); guard++; } while(guard<40&&!hasMoves());
    selected=null; score=0; locked=false;
    scoreEl.textContent=0;
    statusEl.textContent='点击相邻两个图案交换，凑成三个以上即可消除';
    render();
  }

  function clickCell(r,c){
    if(locked) return;
    const p={r,c};
    if(!selected){ selected=p; render(); return; }
    if(selected.r===r&&selected.c===c){ selected=null; render(); return; }
    if(!adjacent(selected,p)){ selected=p; render(); return; }
    locked=true;
    const from=selected;
    swap(from,p);
    render();
    statusEl.textContent='交换中…';
    setTimeout(()=>{
      let hit=scan();
      if(!hit.length){
        swap(from,p); selected=null; locked=false; render();
        statusEl.textContent='这样交换消不掉，换一对试试';
        return;
      }
      selected=null;
      let guard=0;
      const step=()=>{
        if(!hit.length||guard++>20){
          locked=false;
          if(!hasMoves()) reshuffle('没有可消除的组合，已自动重排');
          else statusEl.textContent='消除 +10 分';
          render();
          return;
        }
        collapse(hit);
        render();
        hit=scan();
        setTimeout(step,180);
      };
      step();
    },160);
  }

  document.getElementById('m3New').addEventListener('click',init);
  init();
})();
</script>
