<style>
.dc-wrap { max-width: 560px; margin: 0 auto; }
.dc-card { background: var(--entry); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.dc-card h4 { margin-bottom: 12px; color: var(--primary); }
.dc-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 0.9rem; color: var(--secondary); }
.dc-row input[type="date"], .dc-row input[type="number"] { padding: 7px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); }
.dc-row button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; }
.dc-result { background: var(--code-bg); border-radius: 8px; padding: 12px; font-size: 0.95rem; color: var(--primary); line-height: 1.8; }
</style>

<div class="dc-wrap">
  <div class="dc-card">
    <h4>📅 日期间隔</h4>
    <div class="dc-row">
      <label>开始 <input type="date" id="dcA"></label>
      <label>结束 <input type="date" id="dcB"></label>
      <button id="dcDiff">计算</button>
    </div>
    <div class="dc-result" id="dcDiffOut">选择两个日期后计算</div>
  </div>
  <div class="dc-card">
    <h4>➕ 日期加减</h4>
    <div class="dc-row">
      <label>日期 <input type="date" id="dcBase"></label>
      <label>天数 <input type="number" id="dcDays" value="7"></label>
      <button id="dcAdd">计算</button>
    </div>
    <div class="dc-result" id="dcAddOut">输入日期和天数后计算</div>
  </div>
</div>

<script>
(()=>{
  const WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  function parse(id){ const v=document.getElementById(id).value; return v?new Date(v+'T00:00:00'):null; }
  function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'（'+WEEK[d.getDay()]+'）'; }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }

  document.getElementById('dcDiff').onclick=()=>{
    const a=parse('dcA'), b=parse('dcB');
    const out=document.getElementById('dcDiffOut');
    if(!a||!b){ out.textContent='请选择两个日期'; return; }
    const diff=daysBetween(a,b);
    const abs=Math.abs(diff);
    const weeks=Math.floor(abs/7), days=abs%7;
    out.innerHTML='<div>相隔 <strong>'+abs+'</strong> 天</div><div>约 '+weeks+' 周 '+days+' 天</div><div>'+fmt(a)+' → '+fmt(b)+'</div>';
  };

  document.getElementById('dcAdd').onclick=()=>{
    const base=parse('dcBase'), days=+document.getElementById('dcDays').value||0;
    const out=document.getElementById('dcAddOut');
    if(!base){ out.textContent='请选择日期'; return; }
    const d=new Date(base); d.setDate(d.getDate()+days);
    out.innerHTML='<div>'+fmt(base)+' 加上 '+days+' 天</div><div>= <strong>'+fmt(d)+'</strong></div>';
  };
})();
</script>
