<style>
.dc-wrap {
  --dc-line: color-mix(in srgb, var(--primary) 22%, transparent);
  --dc-card-line: color-mix(in srgb, var(--primary) 14%, transparent);
  max-width: 560px;
  margin: 0 auto;
}
.dc-card {
  background: var(--entry);
  border: 1px solid var(--dc-card-line);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 14px;
}
.dc-card h4 {
  margin-bottom: 14px;
  color: var(--primary);
  font-size: 1rem;
  font-weight: 600;
}
.dc-row { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; font-size: 0.9rem; color: var(--secondary); }
.dc-field { display: inline-flex; align-items: center; gap: 8px; }
.dc-row input[type="date"],
.dc-row input[type="number"] {
  padding: 7px 9px;
  border-radius: 8px;
  border: 1px solid var(--dc-line);
  background: var(--code-bg);
  color: var(--primary);
  font: inherit;
  font-size: 0.9rem;
}
.dc-row input[type="date"] { width: 148px; }
.dc-row input[type="number"] { width: 104px; }
.dc-row input:focus { border-color: var(--primary); }
.dc-btn {
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid var(--dc-line);
  background: var(--code-bg);
  color: var(--primary);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  margin-inline-start: auto;
  transition: background .15s ease, border-color .15s ease;
}
.dc-btn:hover { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--code-bg)); }
.dc-result {
  background: var(--code-bg);
  border: 1px solid color-mix(in srgb, var(--primary) 8%, transparent);
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 14px;
  min-height: 64px;
  font-size: 0.95rem;
  color: var(--primary);
  line-height: 1.8;
  word-break: break-word;
}
.dc-result strong { font-size: 1.05em; }
.dc-note { color: var(--secondary); font-size: 0.82rem; }
@media (max-width: 560px) {
  .dc-btn { width: 100%; margin-inline-start: 0; }
}
.dc-wrap button:focus-visible,
.dc-wrap input:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--primary) 55%, transparent);
  outline-offset: 2px;
}
</style>

<div class="dc-wrap">
  <div class="dc-card">
    <h4>📅 日期间隔</h4>
    <div class="dc-row">
      <label class="dc-field">开始 <input type="date" id="dcA"></label>
      <label class="dc-field">结束 <input type="date" id="dcB"></label>
      <button type="button" class="dc-btn" id="dcDiff">计算</button>
    </div>
    <div class="dc-result" id="dcDiffOut" aria-live="polite">选择两个日期后计算</div>
  </div>
  <div class="dc-card">
    <h4>➕ 日期加减</h4>
    <div class="dc-row">
      <label class="dc-field">日期 <input type="date" id="dcBase"></label>
      <label class="dc-field">天数 <input type="number" id="dcDays" step="1" value="7"></label>
      <button type="button" class="dc-btn" id="dcAdd">计算</button>
    </div>
    <div class="dc-result" id="dcAddOut" aria-live="polite">输入日期和天数后计算</div>
  </div>
</div>

<script>
(()=>{
  const WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const diffOut=document.getElementById('dcDiffOut');
  const addOut=document.getElementById('dcAddOut');

  function pad(n){ return String(n).padStart(2,'0'); }
  function toYmd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseDate(id){
    const v=document.getElementById(id).value;
    if(!v) return null;
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    if(!m) return null;
    const d=new Date(+m[1], +m[2]-1, +m[3]);
    if(isNaN(d.getTime())) return null;
    if(d.getFullYear()!==+m[1]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[3]) return null;
    return d;
  }
  function fmt(d){
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'（'+WEEK[d.getDay()]+'）';
  }
  function daysBetween(a,b){
    const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
    return Math.round((utc(b)-utc(a))/86400000);
  }

  function calcDiff(){
    const a=parseDate('dcA'), b=parseDate('dcB');
    if(!a||!b){ diffOut.textContent='请选择两个日期'; return; }
    const diff=daysBetween(a,b);
    const abs=Math.abs(diff);
    const weeks=Math.floor(abs/7), days=abs%7;
    const human=weeks>0?(weeks+' 周'+(days?' '+days+' 天':'')):(days+' 天');
    diffOut.innerHTML='<div>相隔 <strong>'+abs+'</strong> 天</div>'
      +'<div>约 '+human+'</div>'
      +'<div class="dc-note">'+fmt(a)+' → '+fmt(b)+'</div>'
      +(diff<0?'<div class="dc-note">结束日期早于开始日期</div>':'')
      +(diff===0?'<div class="dc-note">两个日期是同一天</div>':'');
  }

  function calcAdd(){
    const base=parseDate('dcBase');
    if(!base){ addOut.textContent='请选择日期'; return; }
    const raw=document.getElementById('dcDays').value.trim();
    if(!/^-?\d+$/.test(raw)){ addOut.textContent='请输入整数天数（可为负数）'; return; }
    const days=parseInt(raw,10);
    if(Math.abs(days)>3650000){ addOut.textContent='天数过大，无法计算'; return; }
    const d=new Date(base);
    d.setDate(d.getDate()+days);
    if(isNaN(d.getTime())){ addOut.textContent='日期超出可计算范围'; return; }
    const label=days>=0?('加上 '+days+' 天'):('减去 '+(-days)+' 天');
    addOut.innerHTML='<div class="dc-note">'+fmt(base)+' '+label+'</div>'
      +'<div>= <strong>'+fmt(d)+'</strong></div>';
  }

  document.getElementById('dcDiff').onclick=calcDiff;
  document.getElementById('dcAdd').onclick=calcAdd;

  (function init(){
    const today=new Date();
    const weekAgo=new Date(today.getFullYear(),today.getMonth(),today.getDate()-7);
    document.getElementById('dcA').value=toYmd(weekAgo);
    document.getElementById('dcB').value=toYmd(today);
    document.getElementById('dcBase').value=toYmd(today);
    calcDiff();
    calcAdd();
  })();
})();
</script>
