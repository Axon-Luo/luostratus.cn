<style>
.sm-wrap { --sm-line: color-mix(in srgb, var(--primary) 18%, transparent); max-width: 460px; margin: 0 auto; text-align: center; }
.sm-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px; margin-bottom: 14px; color: var(--secondary); font-size: 0.9rem; }
.sm-bar strong { color: var(--primary); }
.sm-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--sm-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.sm-bar button:hover { border-color: var(--primary); }
.sm-bar button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sm-pads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; }
.sm-pad { aspect-ratio: 1; padding: 0; border: 2px solid color-mix(in srgb, #000 22%, transparent); border-radius: 14px; color: rgba(255, 255, 255, 0.72); font-size: 1.5rem; font-weight: 700; line-height: 1; cursor: pointer; opacity: 0.72; transition: opacity 0.1s, transform 0.1s, box-shadow 0.1s; }
.sm-pad:hover { opacity: 0.9; }
.sm-pad:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sm-pad.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 0 4px var(--primary); }
.sm-status { color: var(--secondary); font-size: 0.85rem; min-height: 1.5em; margin: 14px 0 0; }
</style>

<div class="sm-wrap">
  <div class="sm-bar">
    <span>轮次 <strong id="smRound">0</strong></span>
    <span>最佳 <strong id="smBest">0</strong></span>
    <button id="smStart" type="button">▶ 开始</button>
  </div>
  <div class="sm-pads" id="smPads"></div>
  <p class="sm-status" id="smStatus">点击开始，记住亮起的顺序</p>
</div>

<script>
(()=>{
  const COLORS=[
    {id:0,color:'#e74c3c',freq:523},
    {id:1,color:'#2980b9',freq:587},
    {id:2,color:'#27ae60',freq:659},
    {id:3,color:'#f1c40f',freq:698}
  ];
  const padsEl=document.getElementById('smPads');
  const statusEl=document.getElementById('smStatus');
  const roundEl=document.getElementById('smRound');
  const bestEl=document.getElementById('smBest');
  const startBtn=document.getElementById('smStart');
  let seq=[], playerIdx=0, playing=false, started=false, waiting=false, audioCtx=null, gen=0, timers=[], best=0;

  function later(fn,ms){
    const id=setTimeout(()=>{ timers=timers.filter(t=>t!==id); fn(); },ms);
    timers.push(id);
    return id;
  }
  function cancelTimers(){
    timers.forEach(clearTimeout);
    timers=[];
  }

  function ensureAudio(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    if(!audioCtx){ try{ audioCtx=new AC(); }catch(e){ return null; } }
    if(audioCtx.state==='suspended'){ audioCtx.resume().catch(()=>{}); }
    return audioCtx;
  }

  function beep(freq){
    const ctx=ensureAudio();
    if(!ctx) return;
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      const t=ctx.currentTime;
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.12,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+0.19);
    }catch(e){}
  }

  function build(){
    padsEl.innerHTML='';
    COLORS.forEach(c=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='sm-pad';
      b.style.background=c.color;
      b.style.color=c.id===3?'rgba(46,36,0,0.78)':'rgba(255,255,255,0.78)';
      b.textContent=String(c.id+1);
      b.setAttribute('aria-label','色块 '+(c.id+1));
      b.onclick=()=>playerClick(c.id);
      padsEl.appendChild(b);
    });
  }

  function lit(id,ms){
    const b=padsEl.children[id];
    if(!b) return;
    b.classList.add('lit');
    beep(COLORS[id].freq);
    setTimeout(()=>b.classList.remove('lit'),ms);
  }

  function playSeq(myGen){
    if(myGen!==gen) return;
    playing=true;
    statusEl.textContent='看好了…';
    let i=0;
    const step=()=>{
      if(myGen!==gen) return;
      if(i>=seq.length){ playing=false; statusEl.textContent='轮到你了，按顺序点 '+seq.length+' 个'; return; }
      lit(seq[i],420);
      i++;
      later(step,560);
    };
    later(step,480);
  }

  function nextRound(myGen){
    if(myGen!==gen) return;
    seq.push(Math.floor(Math.random()*4));
    playerIdx=0;
    roundEl.textContent=seq.length;
    statusEl.textContent='记住顺序（'+seq.length+' 个）';
    later(()=>playSeq(myGen),300);
  }

  function start(){
    gen++;
    cancelTimers();
    seq=[]; playerIdx=0; playing=false; waiting=false; started=true;
    ensureAudio();
    startBtn.textContent='🔄 重新开始';
    roundEl.textContent=0;
    statusEl.textContent='准备…';
    const myGen=gen;
    later(()=>nextRound(myGen),300);
  }

  function playerClick(id){
    if(!started||playing||waiting) return;
    lit(id,180);
    if(id===seq[playerIdx]){
      playerIdx++;
      if(playerIdx===seq.length){
        playerIdx=0;
        waiting=true; playing=true;
        if(seq.length>best){ best=seq.length; bestEl.textContent=best; }
        statusEl.textContent='正确！下一轮…';
        const myGen=gen;
        later(()=>{
          if(myGen!==gen) return;
          waiting=false; playing=false;
          nextRound(myGen);
        },750);
      }
    } else {
      started=false; playing=false; waiting=false;
      gen++;
      cancelTimers();
      statusEl.textContent='记错了，本轮 '+seq.length+' 关';
      startBtn.textContent='▶ 再来一次';
    }
  }

  startBtn.addEventListener('click',start);
  build();
})();
</script>
