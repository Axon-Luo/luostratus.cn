<style>
.tk-wrap { max-width: 640px; margin: 0 auto; text-align: center; }
.tk-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; color: var(--secondary); font-size: 0.9rem; }
.tk-bar button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); cursor: pointer; }
#tkCanvas { border: 2px solid var(--border); border-radius: 8px; background: #17202a; max-width: 100%; }
.tk-tip { color: var(--secondary); font-size: 0.8rem; margin-top: 8px; }
</style>

<div class="tk-wrap">
  <div class="tk-bar"><span>得分 <strong id="tkScore">0</strong></span><span>生命 <strong id="tkLives">3</strong></span><button id="tkStart">▶ 开始</button></div>
  <canvas id="tkCanvas" width="640" height="520"></canvas>
  <p class="tk-tip">方向键移动 · 空格开火</p>
</div>

<script>
(()=>{
  const canvas=document.getElementById('tkCanvas');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('tkScore');
  const livesEl=document.getElementById('tkLives');
  const keys={};
  let player, bullets, enemies, enemyBullets, score, lives, running, lastShot=0, spawnTimer=0, raf=null, over=false;

  function reset(){
    player={x:300,y:470,w:44,h:44,speed:5};
    bullets=[]; enemies=[]; enemyBullets=[];
    score=0; lives=3; running=false; over=false; spawnTimer=0;
    scoreEl.textContent=0; livesEl.textContent=3;
    document.getElementById('tkStart').textContent='▶ 开始';
  }

  function spawn(){
    enemies.push({x:40+Math.random()*520,y:-40,w:38,h:38,speed:0.7+Math.random()*0.8,shootAt:performance.now()+1000+Math.random()*2500});
  }

  function shoot(from,dir,color){
    bullets.push({x:from.x+from.w/2-2,y:from.y+(dir<0?-6:from.h),w:4,h:10,dir,color});
  }

  function update(now){
    if(!running||over) return;
    if(keys['ArrowLeft']) player.x=Math.max(0,player.x-player.speed);
    if(keys['ArrowRight']) player.x=Math.min(canvas.width-player.w,player.x+player.speed);
    if(keys[' ']&&now-lastShot>300){ lastShot=now; shoot(player,-1,'#f1c40f'); }

    spawnTimer+=16;
    if(spawnTimer>1400){ spawnTimer=0; spawn(); }

    bullets=bullets.filter(b=>b.y>-20&&b.y<canvas.height);
    bullets.forEach(b=>b.y+=7*b.dir);
    enemyBullets=enemyBullets.filter(b=>b.y>-20&&b.y<canvas.height);
    enemyBullets.forEach(b=>b.y+=4);

    enemies.forEach(e=>{
      e.y+=e.speed;
      if(now>e.shootAt){ e.shootAt=now+1500+Math.random()*2000; enemyBullets.push({x:e.x+e.w/2-2,y:e.y+e.h,w:4,h:8}); }
    });
    enemies=enemies.filter(e=>e.y<canvas.height+40);

    bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(!e.dead&&b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){
          e.dead=true; b.dead=true; score+=100;
          scoreEl.textContent=score;
        }
      });
    });
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);

    enemyBullets.forEach(b=>{
      if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){
        b.dead=true; lives--; livesEl.textContent=lives;
        if(lives<=0){ over=true; running=false; document.getElementById('tkStart').textContent='▶ 再来一局'; }
      }
    });
    enemyBullets=enemyBullets.filter(b=>!b.dead);
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    bullets.forEach(b=>{ ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h); });
    enemyBullets.forEach(b=>{ ctx.fillStyle='#e74c3c'; ctx.fillRect(b.x,b.y,b.w,b.h); });
    enemies.forEach(e=>{
      ctx.fillStyle='#c0392b';
      ctx.fillRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle='#922b21'; ctx.fillRect(e.x+12,e.y-12,14,14);
    });
    ctx.fillStyle='#27ae60';
    ctx.fillRect(player.x+16,player.y-16,12,18);
    ctx.fillRect(player.x,player.y,player.w,player.h);
    if(over){
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
      ctx.fillText('游戏结束 · 得分 '+score,canvas.width/2,canvas.height/2);
    }
  }

  function loop(now){
    update(now);
    draw();
    if(running||over) raf=requestAnimationFrame(loop);
  }

  document.getElementById('tkStart').onclick=()=>{
    reset();
    running=true;
    if(raf) cancelAnimationFrame(raf);
    loop(performance.now());
  };
  document.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' ') e.preventDefault(); });
  document.addEventListener('keyup',e=>{ keys[e.key]=false; });
  reset();
})();
</script>
