<style>
.tk-wrap { max-width: 640px; margin: 0 auto; text-align: center; --tk-line: color-mix(in srgb, var(--primary) 20%, transparent); }
.tk-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 14px; margin-bottom: 12px; color: var(--secondary); font-size: 0.9rem; }
.tk-stat { background: var(--entry); border: 1px solid var(--tk-line); border-radius: 999px; padding: 5px 14px; }
.tk-stat strong { color: var(--primary); font-variant-numeric: tabular-nums; }
.tk-actions { display: flex; gap: 8px; }
.tk-wrap button { padding: 7px 15px; border-radius: 8px; border: 1px solid var(--tk-line); background: var(--entry); color: var(--primary); cursor: pointer; font-size: 0.88rem; }
.tk-wrap button.primary { background: var(--primary); color: var(--theme); border-color: var(--primary); font-weight: 600; }
.tk-wrap button:disabled { opacity: 0.45; cursor: not-allowed; }
#tkCanvas { display: block; box-sizing: border-box; margin: 0 auto; width: 100%; max-width: 640px; height: auto; border: 2px solid var(--tk-line); border-radius: 10px; background: #17202a; touch-action: none; }
.tk-pad { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
.tk-pad button { min-width: 62px; padding: 10px 16px; font-size: 1rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.tk-pad button[data-tk-fire] { min-width: 96px; }
.tk-tip { color: var(--secondary); font-size: 0.8rem; margin-top: 10px; line-height: 1.6; }
</style>

<div class="tk-wrap">
  <div class="tk-bar">
    <span class="tk-stat">得分 <strong id="tkScore">0</strong></span>
    <span class="tk-stat">生命 <strong id="tkLives">3</strong></span>
    <span class="tk-actions">
      <button type="button" id="tkStart" class="primary">▶ 开始</button>
      <button type="button" id="tkPause" disabled>⏸ 暂停</button>
    </span>
  </div>
  <canvas id="tkCanvas" width="640" height="520" aria-label="坦克大战游戏画面"></canvas>
  <div class="tk-pad" role="group" aria-label="触屏操作">
    <button type="button" data-tk-move="left" aria-label="向左移动">◀</button>
    <button type="button" data-tk-move="right" aria-label="向右移动">▶</button>
    <button type="button" data-tk-fire aria-label="开火">🔥 开火</button>
  </div>
  <p class="tk-tip">方向键移动 · 空格开火 · 也可用下方按钮操作（P 键暂停）</p>
</div>

<script>
(()=>{
  const canvas=document.getElementById('tkCanvas');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('tkScore');
  const livesEl=document.getElementById('tkLives');
  const startBtn=document.getElementById('tkStart');
  const pauseBtn=document.getElementById('tkPause');
  const W=canvas.width, H=canvas.height;
  const keys={};
  let player, bullets, enemies, enemyBullets, score, lives, running, paused, over, lastShot=0, spawnTimer=0, raf=null, lastTs=0;

  function reset(){
    player={x:300,y:470,w:44,h:44,speed:5};
    bullets=[]; enemies=[]; enemyBullets=[];
    score=0; lives=3; running=false; paused=false; over=false; spawnTimer=0; lastShot=0;
    scoreEl.textContent=0; livesEl.textContent=3;
    startBtn.textContent='▶ 开始';
    pauseBtn.textContent='⏸ 暂停'; pauseBtn.disabled=true;
  }

  function spawn(){
    enemies.push({x:40+Math.random()*520,y:-40,w:38,h:38,speed:0.7+Math.random()*0.8,shootAt:performance.now()+1000+Math.random()*2500});
  }

  function shoot(from,dir,color){
    bullets.push({x:from.x+from.w/2-2,y:from.y+(dir<0?-6:from.h),w:4,h:10,dir,color});
  }

  function update(now,dt){
    const k=Math.min(dt,48)/16.667;
    if(keys['ArrowLeft']) player.x=Math.max(0,player.x-player.speed*k);
    if(keys['ArrowRight']) player.x=Math.min(W-player.w,player.x+player.speed*k);
    if((keys[' ']||keys.fire)&&now-lastShot>300){ lastShot=now; shoot(player,-1,'#f1c40f'); }

    spawnTimer+=dt;
    if(spawnTimer>1400){ spawnTimer=0; spawn(); }

    bullets=bullets.filter(b=>b.y>-20&&b.y<H);
    bullets.forEach(b=>b.y+=7*b.dir*k);
    enemyBullets=enemyBullets.filter(b=>b.y>-20&&b.y<H);
    enemyBullets.forEach(b=>b.y+=4*k);

    enemies.forEach(e=>{
      e.y+=e.speed*k;
      if(now>e.shootAt){ e.shootAt=now+1500+Math.random()*2000; enemyBullets.push({x:e.x+e.w/2-2,y:e.y+e.h,w:4,h:8}); }
    });
    enemies=enemies.filter(e=>e.y<H+40);

    bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(!e.dead&&!b.dead&&b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){
          e.dead=true; b.dead=true; score+=100;
          scoreEl.textContent=score;
        }
      });
    });
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);

    enemyBullets.forEach(b=>{
      if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){
        b.dead=true; lives--; livesEl.textContent=Math.max(lives,0);
        if(lives<=0){ endGame(); }
      }
    });
    enemyBullets=enemyBullets.filter(b=>!b.dead);
  }

  function endGame(){
    over=true; running=false; paused=false;
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    startBtn.textContent='↺ 再来一局';
    pauseBtn.disabled=true;
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    if(!player) return;
    bullets.forEach(b=>{ ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h); });
    enemyBullets.forEach(b=>{ ctx.fillStyle='#e74c3c'; ctx.fillRect(b.x,b.y,b.w,b.h); });
    enemies.forEach(e=>{
      ctx.fillStyle='#c0392b';
      ctx.fillRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle='#922b21'; ctx.fillRect(e.x+12,e.y-12,14,14);
    });
    ctx.fillStyle='#27ae60';
    ctx.fillRect(player.x+16,player.y-16,12,18);
    ctx.fillRect(player.x,player.y,player.w,player.h);
    if(over){
      ctx.fillStyle='rgba(0,0,0,0.68)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
      ctx.fillText('游戏结束 · 得分 '+score,W/2,H/2);
      ctx.font='15px sans-serif';
      ctx.fillStyle='#d5d8dc';
      ctx.fillText('点击「再来一局」重新开始',W/2,H/2+32);
    }else if(paused){
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
      ctx.fillText('已暂停',W/2,H/2);
    }else if(!running){
      ctx.fillStyle='rgba(0,0,0,0.45)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
      ctx.fillText('坦克大战',W/2,H/2-14);
      ctx.font='15px sans-serif';
      ctx.fillStyle='#d5d8dc';
      ctx.fillText('点击「开始」进入游戏',W/2,H/2+22);
    }
  }

  function loop(ts){
    const dt=lastTs?ts-lastTs:16.7;
    lastTs=ts;
    if(running&&!paused) update(ts,dt);
    draw();
    if(running&&!paused) raf=requestAnimationFrame(loop);
    else { raf=null; lastTs=0; }
  }

  function start(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    reset();
    running=true;
    pauseBtn.disabled=false;
    lastTs=0;
    raf=requestAnimationFrame(loop);
  }

  function togglePause(){
    if(!running) return;
    paused=!paused;
    pauseBtn.textContent=paused?'▶ 继续':'⏸ 暂停';
    if(paused){
      if(raf){ cancelAnimationFrame(raf); raf=null; }
      lastTs=0;
      draw();
    }else{
      lastTs=0;
      raf=requestAnimationFrame(loop);
    }
  }

  startBtn.onclick=start;
  pauseBtn.onclick=togglePause;

  document.addEventListener('keydown',e=>{
    const k=e.key;
    keys[k]=true;
    if(k===' '||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
      if(running&&!paused) e.preventDefault();
    }
    if((k==='p'||k==='P')&&!e.repeat) togglePause();
  });
  document.addEventListener('keyup',e=>{ keys[e.key]=false; });
  window.addEventListener('blur',()=>{ keys[' ']=false; keys.fire=false; keys.ArrowLeft=false; keys.ArrowRight=false; });

  function hold(btn,on,off){
    if(!btn) return;
    btn.addEventListener('pointerdown',e=>{ e.preventDefault(); if(btn.setPointerCapture&&e.pointerId!==undefined){ try{ btn.setPointerCapture(e.pointerId); }catch(err){} } on(); });
    btn.addEventListener('pointerup',e=>{ e.preventDefault(); off(); });
    btn.addEventListener('pointercancel',off);
    btn.addEventListener('pointerleave',off);
    btn.addEventListener('contextmenu',e=>e.preventDefault());
  }
  hold(document.querySelector('[data-tk-move="left"]'),()=>keys.ArrowLeft=true,()=>keys.ArrowLeft=false);
  hold(document.querySelector('[data-tk-move="right"]'),()=>keys.ArrowRight=true,()=>keys.ArrowRight=false);
  hold(document.querySelector('[data-tk-fire]'),()=>keys.fire=true,()=>keys.fire=false);

  reset();
  draw();
})();
</script>
