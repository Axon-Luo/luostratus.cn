<style>
.mt-wrap { max-width: 480px; margin: 0 auto; text-align: center; }
.mt-display { font-size: 3.4rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; margin: 10px 0; }
.mt-beat { font-size: 1rem; color: var(--secondary); min-height: 24px; }
.mt-bar { display: flex; justify-content: center; gap: 18px; margin: 12px 0; align-items: center; color: var(--secondary); font-size: 0.9rem; flex-wrap: wrap; }
.mt-bar input { width: 70px; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--entry); color: var(--primary); }
.mt-bar input[type="range"] { width: 200px; }
.mt-btn { padding: 12px 34px; border-radius: 10px; border: none; background: var(--primary); color: var(--theme); font-size: 1.05rem; font-weight: 700; cursor: pointer; }
.mt-pend { width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--border); margin: 0 auto; transition: background 0.08s, transform 0.08s; }
.mt-pend.active { background: var(--primary); transform: scale(1.08); }
</style>

<div class="mt-wrap">
  <div class="mt-display" id="mtBpm">120</div>
  <div class="mt-bar">
    <label>BPM <input type="range" id="mtRange" min="40" max="220" value="120"></label>
    <input type="number" id="mtNum" min="40" max="220" value="120">
    <label>拍数 <input type="number" id="mtBeats" min="1" max="12" value="4"></label>
  </div>
  <div class="mt-pend" id="mtPend"></div>
  <div class="mt-beat" id="mtBeat">—</div>
  <button class="mt-btn" id="mtToggle">▶ 开始</button>
</div>

<script>
(()=>{
  const bpmEl=document.getElementById('mtBpm');
  const range=document.getElementById('mtRange');
  const num=document.getElementById('mtNum');
  const pend=document.getElementById('mtPend');
  const beatEl=document.getElementById('mtBeat');
  let running=false, timer=null, current=0, audioCtx=null;

  function bpm(){ return +num.value||120; }

  function click(accent){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=accent?1200:800;
    o.type='square'; g.gain.value=accent?0.35:0.2;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.06);
  }

  function tick(){
    const beats=+document.getElementById('mtBeats').value||4;
    current=(current%beats)+1;
    click(current===1);
    beatEl.textContent='第 '+current+' / '+beats+' 拍';
    pend.classList.remove('active');
    requestAnimationFrame(()=>pend.classList.add('active'));
  }

  function start(){
    if(running) return;
    running=true;
    document.getElementById('mtToggle').textContent='⏸ 停止';
    current=0;
    tick();
    timer=setInterval(tick,60000/bpm());
  }

  function stop(){
    running=false;
    clearInterval(timer);
    document.getElementById('mtToggle').textContent='▶ 开始';
    pend.classList.remove('active');
    beatEl.textContent='—';
  }

  function sync(){
    const v=bpm();
    range.value=v; bpmEl.textContent=v;
  }
  range.oninput=()=>{ num.value=range.value; sync(); };
  num.oninput=sync;
  document.getElementById('mtToggle').onclick=()=>running?stop():start();
  sync();
})();
</script>
