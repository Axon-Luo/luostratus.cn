<style>
.gm-wrap { max-width: 560px; margin: 0 auto; text-align: center; --gm-line: color-mix(in srgb, var(--primary) 16%, transparent); }
.gm-info { display: flex; gap: 16px; justify-content: center; margin-bottom: 12px; font-size: 0.95rem; color: var(--secondary); flex-wrap: wrap; }
.gm-info strong { color: var(--primary); }
.gm-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
.gm-wrap .gm-btns button { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--gm-line); background: color-mix(in srgb, var(--primary) 7%, var(--entry)); color: var(--primary); cursor: pointer; font-size: 0.9rem; }
.gm-wrap .gm-btns button:hover { background: color-mix(in srgb, var(--primary) 13%, var(--entry)); border-color: color-mix(in srgb, var(--primary) 34%, transparent); }
.gm-card { background: var(--entry); border: 1px solid var(--gm-line); border-radius: 12px; padding: 14px; display: inline-block; max-width: 100%; }
#gmCanvas { display: block; width: 100%; max-width: 548px; height: auto; border-radius: 8px; touch-action: none; cursor: pointer; }
.gm-status { margin-top: 10px; color: var(--secondary); font-size: 0.9rem; min-height: 22px; }
.gm-status.win { color: #22c55e; font-weight: 600; }
.gm-status.lose { color: #ef4444; font-weight: 600; }
</style>

<div class="gm-wrap">
  <div class="gm-info"><span>你：<strong>黑子</strong></span><span>电脑：<strong>白子</strong></span><span>先连成五子者胜</span></div>
  <div class="gm-btns">
    <button id="gmNew">🔄 新开局</button>
    <button id="gmUndo">↩️ 悔棋</button>
  </div>
  <div class="gm-card">
    <canvas id="gmCanvas" aria-label="五子棋棋盘"></canvas>
  </div>
  <p class="gm-status" id="gmStatus">点击棋盘落子</p>
</div>

<script>
(()=>{
  const N=15, CELL=36, PAD=24;
  const W=PAD*2+(N-1)*CELL;          /* 548：两侧留白对称，不再多出 36px 空白 */
  const canvas=document.getElementById('gmCanvas');
  const ctx=canvas.getContext('2d');
  const DPR=2;
  canvas.width=W*DPR; canvas.height=W*DPR;
  const status=document.getElementById('gmStatus');
  const SW='#8a5f2e', BOARD='#e9c690';
  let board=Array.from({length:N},()=>Array(N).fill(0));
  let over=false, busy=false, history=[], last=null;

  const DIRS=[[1,0],[0,1],[1,1],[1,-1]];

  function reset(){
    board=Array.from({length:N},()=>Array(N).fill(0));
    history=[]; over=false; busy=false; last=null;
    status.textContent='点击棋盘落子';
    status.className='gm-status';
    draw();
  }

  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,W);
    ctx.fillStyle=BOARD; ctx.fillRect(0,0,W,W);
    ctx.strokeStyle=SW; ctx.lineWidth=1;
    for(let i=0;i<N;i++){
      const p=PAD+i*CELL;
      ctx.beginPath(); ctx.moveTo(PAD,p); ctx.lineTo(PAD+(N-1)*CELL,p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p,PAD); ctx.lineTo(p,PAD+(N-1)*CELL); ctx.stroke();
    }
    /* 星位 */
    ctx.fillStyle=SW;
    for(const [r,c] of [[3,3],[3,11],[11,3],[11,11],[7,7]]){
      ctx.beginPath(); ctx.arc(PAD+c*CELL,PAD+r*CELL,3,0,Math.PI*2); ctx.fill();
    }
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(!board[r][c]) continue;
      const x=PAD+c*CELL, y=PAD+r*CELL;
      ctx.beginPath(); ctx.arc(x,y,CELL*0.42,0,Math.PI*2);
      ctx.fillStyle=board[r][c]===1?'#1c1c1c':'#f7f7f7';
      ctx.fill();
      ctx.lineWidth=1; ctx.strokeStyle=board[r][c]===1?'#000':'#9a9a9a'; ctx.stroke();
    }
    if(last){
      ctx.beginPath();
      ctx.arc(PAD+last.c*CELL,PAD+last.r*CELL,4,0,Math.PI*2);
      ctx.fillStyle='#e11d48'; ctx.fill();
    }
  }

  function countLine(r,c,dr,dc,color){
    let count=1, open=0;
    for(const sign of [1,-1]){
      let rr=r+dr*sign, cc=c+dc*sign;
      while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===color){ count++; rr+=dr*sign; cc+=dc*sign; }
      if(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===0) open++;
    }
    return {count,open};
  }

  function winAt(r,c,color){
    for(const [dr,dc] of DIRS){
      let count=1;
      for(const sign of [1,-1]){
        let rr=r+dr*sign, cc=c+dc*sign;
        while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===color){ count++; rr+=dr*sign; cc+=dc*sign; }
      }
      if(count>=5) return true;
    }
    return false;
  }

  function scoreCell(r,c,color){
    if(board[r][c]) return -1;
    let total=0;
    for(const [dr,dc] of DIRS){
      const {count,open}=countLine(r,c,dr,dc,color);
      if(count>=5) return 1000000;
      if(open===0) continue;
      if(count===4) total+=100000*open;
      else if(count===3) total+=8000*open;
      else if(count===2) total+=400*open;
      else total+=20*open;
    }
    return total;
  }

  function aiMove(){
    let best=null, bestScore=-1;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const s=scoreCell(r,c,2)*1.0+scoreCell(r,c,1)*0.92;
      if(s>bestScore){ bestScore=s; best={r,c}; }
    }
    return best;
  }

  function isFull(){ return board.every(row=>row.every(v=>v)); }

  function setEnd(msg,cls){ over=true; busy=false; status.textContent=msg; status.className='gm-status'+(cls?' '+cls:''); }

  function aiTurn(){
    if(over) return;
    const m=aiMove();
    if(!m){ setEnd('平局'); return; }
    board[m.r][m.c]=2; history.push([m.r,m.c]); last={r:m.r,c:m.c};
    if(winAt(m.r,m.c,2)) setEnd('电脑获胜','lose');
    else if(isFull()) setEnd('平局');
    else { busy=false; }
    draw();
  }

  canvas.addEventListener('click',e=>{
    if(over||busy) return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(W/rect.width);
    const y=(e.clientY-rect.top)*(W/rect.height);
    const c=Math.round((x-PAD)/CELL), r=Math.round((y-PAD)/CELL);
    if(r<0||r>=N||c<0||c>=N||board[r][c]) return;
    board[r][c]=1; history.push([r,c]); last={r,c};
    if(winAt(r,c,1)){ setEnd('你赢了 🎉','win'); draw(); return; }
    if(isFull()){ setEnd('平局'); draw(); return; }
    busy=true;
    draw();
    setTimeout(aiTurn,80);
  });

  document.getElementById('gmNew').onclick=reset;
  document.getElementById('gmUndo').onclick=()=>{
    /* 悔棋：撤销电脑最后一手与自己的最后一手；终局状态也允许悔棋继续下 */
    if(busy) return;
    if(!history.length){ return; }
    const pop=()=>{ const [r,c]=history.pop(); board[r][c]=0; };
    if(board[history[history.length-1][0]][history[history.length-1][1]]===2) pop();
    if(history.length) pop();
    last=history.length?{r:history[history.length-1][0],c:history[history.length-1][1]}:null;
    over=false;
    status.textContent='已悔棋，继续落子';
    status.className='gm-status';
    draw();
  };

  reset();
})();
</script>
