baseURL: https://luostratus.cn/
locale: zh-cn
title: LuoStratus 的个人站
theme: PaperMod

# 分页
pagination:
  pagerSize: 10

# 语法高亮
markup:
  highlight:
    style: catppuccin-macchiato
    noClasses: false

# 分类法（标签、分类等）
taxonomies:
  tag: tags
  category: categories

# 输出设置
outputs:
  home:
    - HTML
    - RSS
    - JSON  # PaperMod 搜索需要 JSON 索引
  section:
    - HTML
    - RSS

# PaperMod 主题配置
params:
  # 首页信息
  homeInfoParams:
    Title: 你好，我是洛云
    Content: |
      欢迎来到我的个人站点\
      暂未适配移动端，请使用电脑浏览本站

  # 社交链接
  socialIcons:
    - name: github
      url: "https://github.com/Axon-Luo"
    - name: bilibili
      url: "https://space.bilibili.com/438193192"

  # 显示功能开启
  ShowReadingTime: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowShareButtons: false

  # 日期格式
  dateFormat: "2006-01-02"

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 1
    - name: 画廊
      url: /gallery/
      weight: 2
    - name: 归档
      url: /archives/
      weight: 3
    - name: 标签
      url: /tags/
      weight: 4
    - name: 搜索
      url: /search/
      weight: 5
    - name: 关于
      url: /about/
      weight: 6
