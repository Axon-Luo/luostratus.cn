baseURL: https://luostratus.cn/
locale: zh-cn
title: LuoStratus 的个人站
theme: PaperMod

# 分页
pagination:
  pagerSize: 10

# 语法高亮
markup:
  highlight:
    style: catppuccin-macchiato
    noClasses: false

# PaperMod 主题配置
params:
  # 暗色模式 - 固定
  defaultTheme: dark
  disableThemeToggle: true

  # 首页信息
  homeInfoParams:
    Title: 你好，我是洛云
    Content: 欢迎来到我的个人站点。

  # 社交链接（先留空，后面添加）
  socialIcons:
    - name: github
      url: "https://github.com/"

  # 显示阅读时间
  ShowReadingTime: true
  # 显示文章目录
  ShowToc: true
  # 显示面包屑导航
  ShowBreadCrumbs: true
  # 显示代码复制按钮
  ShowCodeCopyButtons: true

  # 日期格式
  dateFormat: "2006-01-02"

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 1
    - name: 关于
      url: /about/
      weight: 2
    - name: 标签
      url: /tags/
      weight: 3
    - name: 搜索
      url: /search/
      weight: 4
